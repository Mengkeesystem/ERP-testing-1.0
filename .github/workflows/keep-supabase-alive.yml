# 明记 ERP：每 12 小时「查询」一次网站，并避免两件事把它停掉：
#   1) Supabase 免费版项目 7 天没人用会被自动暂停 → 每次都戳一下数据库；
#   2) GitHub 规定：公开仓库连续 60 天没有任何提交，定时任务会被自动停用 → 每次跑完顺手「重新启用」自己，重置这个计时。
# 只用公开的 publishable key（跟网页里的一样，浏览器本来就看得到），不放任何私钥。
# 任何一项检查失败，这个任务会变红，GitHub 会发邮件通知仓库主人。
name: keep-supabase-alive

on:
  schedule:
    - cron: "17 3,15 * * *"   # 每 12 小时一次（UTC 03:17 和 15:17 = 马来西亚 11:17 和 23:17）
  workflow_dispatch: {}       # 也可以在 Actions 页面手动点 Run workflow

permissions:
  actions: write              # 只用来「重新启用自己」，不能改代码
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 ERP 网站（GitHub Pages）
        run: |
          code=$(curl -sS -o /tmp/site.html -w "%{http_code}" --max-time 30 -L "https://mengkeesystem.github.io/ERP-testing-1.0/")
          echo "ERP 网站 HTTP $code"
          grep -o 'BUILD="[^"]*"' /tmp/site.html | head -1 || true
          if [ "$code" -ne 200 ]; then echo "ERP 网站打不开"; exit 1; fi

      - name: 检查 Supabase（走到数据库就算有活动）
        run: |
          URL="https://kmcdokwiyetlmsrdlgqw.supabase.co"
          KEY="sb_publishable_HVJ_hcFmSDU-N2kFUg5CRw_LH-X_phO"
          # 有登录权限限制时回 [] 或 401/403 都没关系，只要不是 5xx / 连不上
          code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/erp_users?select=email&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase HTTP $code"; head -c 200 /tmp/out.txt; echo
          if [ "$code" -ge 500 ] || [ "$code" -eq 0 ]; then
            echo "Supabase 没有正常回应（可能已被暂停或在维护）"; exit 1
          fi

      - name: 安全检查：没登录的人读不到任何资料（读到就变红、发邮件）
        run: |
          URL="https://kmcdokwiyetlmsrdlgqw.supabase.co"
          KEY="sb_publishable_HVJ_hcFmSDU-N2kFUg5CRw_LH-X_phO"
          bad=0
          for t in erp_store erp_users erp_push_subs erp_invite_codes; do
            body=$(curl -sS --max-time 30 "$URL/rest/v1/$t?select=*&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true)
            echo "$t → $(echo "$body" | head -c 80)"
            case "$body" in \[\{*) echo "⚠️ $t 没登录就读得到资料！"; bad=1;; esac
          done
          if [ "$bad" = 1 ]; then exit 1; fi
          echo "OK：没登录读不到任何表"

      - name: 安全检查：注册要先验证邮箱（Confirm email 没开就变红、发邮件）
        run: |
          s=$(curl -sS --max-time 30 "https://kmcdokwiyetlmsrdlgqw.supabase.co/auth/v1/settings" -H "apikey: sb_publishable_HVJ_hcFmSDU-N2kFUg5CRw_LH-X_phO" || true)
          echo "$s" | head -c 400; echo
          case "$s" in
            *'"mailer_autoconfirm":true'*) echo "⚠️ Confirm email 没开！别人可以用任何邮箱直接注册。"; exit 1;;
            *'"mailer_autoconfirm":false'*) echo "OK：注册要先验证邮箱";;
            *) echo "读不到设定（不算失败）";;
          esac

      - name: 看一眼拍照识别函数（只看，不算失败）
        continue-on-error: true
        run: |
          curl -sS --max-time 20 "https://kmcdokwiyetlmsrdlgqw.supabase.co/functions/v1/invoice-ocr?health=1" \
            -H "apikey: sb_publishable_HVJ_hcFmSDU-N2kFUg5CRw_LH-X_phO" || true
          echo

      - name: 重新启用本任务（重置「60 天没动静就停用」的计时）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-supabase-alive.yml/enable" && echo "已重新启用"
