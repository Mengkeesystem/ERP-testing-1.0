    if(e.touches.length!==1||_ptrBusy)return;

    const t=e.touches[0];if(t.clientX<30)return;                  // 左边缘留给「拉出菜单」

  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!st)return;const t=e.touches[0];const mx=t.clientX-st.x;dy=t.clientY-st.y;

      if(dy<12)return;pulling=true;mk();el.classList.remove('ptr-spin','ptr-done');
    }
    if((window.scrollY||0)>0){pulling=false;st=null;pos(0);return;}
    e.preventDefault();                                          // 不让页面自己橡皮筋回弹
    pos(dy*0.5);el.classList.toggle('ptr-go',dy>=TH);
    const a=el.querySelector('.ptr-a');if(a)a.style.transform='rotate('+(dy>=TH?180:0)+'deg)';
  },{passive:false});
  async function end(){
    if(!pulling){st=null;return;}
    const go=dy>=TH;pulling=false;st=null;

    try{await pullRefresh();}catch(e){}
    const wait=Math.max(0,700-(Date.now()-t0));await new Promise(r=>setTimeout(r,wait));
    el.classList.remove('ptr-spin');el.classList.add('ptr-done');
    setTimeout(()=>{pos(0);setTimeout(()=>el.classList.remove('ptr-done'),300);},500);
  }

  document.addEventListener('touchcancel',()=>{if(pulling){pulling=false;st=null;if(el)pos(0);}},{passive:true});
})();

function stockMovements(){
  const x=d(),out=[],unitOf=n=>{const it=(x.items||[]).find(i=>i.name===n);return it?it.unit:'';};
  (x.purchases||[]).forEach(r=>{const q=FISH_SUPPLIERS.includes(r.supplier)?(+r.weight||0):(+r.qty||0);if(q>0&&r.date)out.push({date:r.date,item:r.item,kind:'in',label:'进货',qty:q,amt:+r.price||0,note:(r.supplier||'')+(r.invoice?' · '+r.invoice:'')});});
  (x.moves||[]).forEach(m=>{const q=+m.qty||0;if(!(q>0)||!m.date)return;
    if(m.type==='in')out.push({date:m.date,item:m.item,kind:'in',label:'入库（旧）',qty:q,amt:+m.amt||0,note:m.note||''});
    else if(m.type==='production')out.push({date:m.date,item:m.item,kind:'in',label:'中厨生产',qty:q,amt:+m.amt||0,note:m.note||''});
    else if(m.type==='waste')out.push({date:m.date,item:m.item,kind:'out',label:'报废（旧）',qty:-q,amt:+m.amt||0,note:m.note||''});
    else if(m.type==='grn')out.push({date:m.date,item:m.item,kind:'out',label:'退货',qty:-q,amt:Math.abs(+m.amt||0),note:m.note||''});});
  (x.wasteLog||[]).forEach(r=>{const q=+r.qty||0;if(q>0&&r.date)out.push({date:r.date,item:r.item,kind:'out',label:'报废',qty:-q,amt:(+r.cost||0)*q,note:r.reason||''});});
  (x.transfers||[]).forEach(r=>{const q=+r.qty||0;if(!(q>0)||!r.date)return;const inn=r.dir==='in';
    out.push({date:r.date,item:r.item,kind:inn?'in':'out',label:inn?'调拨入':'调拨出',qty:inn?q:-q,amt:+r.amt||0,note:(r.to||r.from||'')+(r.note?' · '+r.note:'')});});
  (x.stocktakes||[]).forEach(r=>{if(!r.date)return;const diff=(+r.count||0)-(+r.theory||0);out.push({date:r.date,item:r.item,kind:'count',label:'盘点',qty:diff,amt:0,note:`实盘 ${num(+r.count||0,2)}，账面 ${num(+r.theory||0,2)}（只是记录，没有改库存）`,noStock:true});});
  out.forEach(r=>{r.unit=unitOf(r.item);});
  return out.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}

function prefill(type,id){
  if(type==='item'){const it=d().items.find(i=>i.id===id);if(!it)return;
    setV('i_name',it.name);setV('i_cat',it.cat);setV('i_unit',it.unit);setV('i_buy',it.buyUnit);setV('i_conv',it.conv);setV('i_yield',it.yield);setV('i_qty',it.qty);if(isFishItem(it)){const pr=document.getElementById('i_pcs_row');if(pr)pr.style.display='';setV('i_pcs',it.pcs==null?'':it.pcs);}setV('i_cost',it.cost);setV('i_par',it.par);setV('i_min',it.min==null?'':it.min);setV('i_exp',(it.batches&&it.batches[0])?it.batches[0].exp:'');
    setTitle(LANG==="zh"?"编辑品项":"Edit Item");}
  if(type==='recipe'){const r=d().recipes.find(x=>x.id===id);if(!r)return;
    setV('r_name',r.name);setV('r_price',r.price);if(r.ing&&r.ing[0]){setV('r_ing',r.ing[0].n);setV('r_q',r.ing[0].q);}
    setTitle(LANG==="zh"?"编辑配方":"Edit Recipe");}
  if(type==='emp'){const e=(d().staff||[]).find(x=>x.id===id);if(!e)return;
    const injOpt=(selId,val)=>{const s=document.getElementById(selId);if(s&&val&&![...s.options].some(o=>o.value===val)){const o=document.createElement('option');o.value=val;o.textContent=val;s.appendChild(o);}};
    injOpt('em_role',e.role);injOpt('em_nat',e.nationality||(e.local===false?'缅甸':'马来西亚'));
    setV('em_no',e.empNo||'');setV('em_name',e.name);setV('em_email',e.email||'');setV('em_role',e.role);setV('em_nat',e.nationality||(e.local===false?'缅甸':'马来西亚'));setV('em_ic',e.ic||'');setV('em_phone',e.phone||'');setV('em_addr',e.address||'');setV('em_emerg',e.emergency||'');setV('em_joined',e.joined||'');setV('em_marital',e.marital||(e.married?'married':'single'));setV('em_basic',e.basic);setV('em_allow',e.allowance);setV('em_children',+e.children||0);setV('em_bankname',e.bankName||'');setV('em_bankacc',e.bankAcc||'');
    setTitle(LANG==="zh"?"编辑员工":"Edit Employee");}
  if(type==='vendor'){const v=d().vendors.find(x=>x.id===id);if(!v)return;
    setV('v_name',v.name);setV('v_terms',v.terms);setTitle(LANG==="zh"?"编辑供应商":"Edit Vendor");}
}
function setV(id,val){const el=document.getElementById(id);if(el)el.value=val;}
function setTitle(txt){const h=document.querySelector('#mbox h3');if(h)h.childNodes[0].textContent=txt+" ";}
function closeM(){_xferInboxOpen=false;document.getElementById('mbg').classList.remove('show');_orderEditing=false;if(_updPending&&typeof tryShowForcedUpdate==='function')tryShowForcedUpdate();}
document.getElementById('mbg').addEventListener('click',e=>{if(e.target.id==='mbg')closeM();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const mbg=document.getElementById('mbg');if(mbg&&mbg.classList.contains('show'))closeM();}});
function poHint(){const s=document.getElementById('p_item');if(!s)return;const it=findItem(s.value);document.getElementById('poHint').innerHTML=it?`1 ${it.buyUnit} = ${it.conv} ${it.unit} · ${LANG==="zh"?"现价":"now"} ${money(it.cost)}/${it.unit}`:'';}
function stTheory(){const s=document.getElementById('st_item');if(!s)return;const it=findItem(s.value);document.getElementById('st_theory').value=it?it.qty+' '+it.unit:'';}
function sugList(){const list=d().items.filter(i=>stockLevel(i)==='low'||stockLevel(i)==='neg').map(i=>{const need=stockOrderQty(i);return `<div class="pl"><div class="row"><span><b>${i.name}</b><br><span class="mini">${LANG==="zh"?"现有":"On-hand"} ${i.qty} · ${stockMin(i)==null?'Par '+i.par:(LANG==="zh"?"最低 ":"Min ")+stockMin(i)+' · '+(LANG==="zh"?"标准 ":"Par ")+i.par}</span></span><b class="pos">${LANG==="zh"?"订":"Order"} ${need} ${i.unit}</b></div></div>`;}).join('');document.getElementById('sugList').innerHTML=list||`<div class="empty">✅ ${LANG==="zh"?"库存充足":"All stocked"}</div>`;}

async function doBulkAdd(kind){
  const zh=LANG==="zh";
  const raw=(document.getElementById('bulk_txt')||{}).value||'';
  const names=[...new Set(raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))];
  if(!names.length){alert(zh?"请先粘贴至少一个名称。":"Paste at least one name.");return;}
  const all=document.getElementById('bulk_all').checked || isAgg();
  const targets=all?OUTLETS.map(o=>o.id):[curOutlet];
  const who=curUser?(curUser.name+" ("+curUser.email+")"):ROLES[curRole].name;
  let total=0;
  for(const oid of targets){
    const db=DB[oid];if(!db)continue;let added=0;
    if(kind==='supplier'){db.vendors=db.vendors||[];names.forEach(n=>{if(!db.vendors.some(v=>v.name===n)){db.vendors.push({id:Math.max(0,...db.vendors.map(v=>v.id))+1,name:n,terms:30});added++;}});}
    else{db.items=db.items||[];names.forEach(n=>{if(!db.items.some(i=>i.name===n)){db.items.push({id:Math.max(0,...db.items.map(i=>i.id))+1,name:n,unit:'pcs',buyUnit:'',conv:1,qty:0,cost:0,cat:'其他',par:0,yield:100,batches:[]});added++;}});}
    if(added>0){db.audit=db.audit||[];db.audit.unshift({date:TODAY+" "+new Date().toTimeString().slice(0,5),user:who,roleKey:curRole,act:kind==='supplier'?"批量导入供应商":"批量导入品项",detail:added+(zh?" 项":" items"),old:"",new:""});await save(oid);total+=added;}
  }
  _aggCache=null;closeM();render();
  alert((zh?"已导入 ":"Added ")+total+(zh?" 项（重复已跳过）"+(all?"，已应用到全部分店。":"。"):" (duplicates skipped)."));
}

function monthsFrom(start){const res=[];let[y,m]=start.split('-').map(Number);const now=new Date();const ey=now.getFullYear(),em=now.getMonth()+1;let guard=0;while((y<ey||(y===ey&&m<=em))&&guard<240){res.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++;}guard++;}return res;}

  cat.forEach(c=>{if(!c.cid)c.cid=gridCid();if((c.code==null||c.code==='')&&meta[c.name]&&meta[c.name].code)c.code=meta[c.name].code;if((c.uom==null||c.uom==='')&&meta[c.name]&&meta[c.name].uom)c.uom=meta[c.name].uom;if(c.uom==null){const it=findItem(c.name);c.uom=it?it.unit:'';}if(c.spec==null)c.spec='';});

/* 月末盘点单价＝该品项当月每天进货单价的「中间值」(中位数，不是平均值)，自动算好直接用，不用手动填。
   例：菜心1-10号5元、11-20号6元、21-30号5.5元→30个日价钱排序取中间值。取不到(当月没进货过)才退回手动单价。 */
function monthMedianPrice(sup,item,month){
  const prices=(d().purchases||[]).filter(r=>r.supplier===sup&&r.item===item&&(r.date||'').slice(0,7)===month&&(+r.unitPrice||0)>0).map(r=>+r.unitPrice||0).sort((a,b)=>a-b);
  if(!prices.length)return 0;
  const n=prices.length,mid=Math.floor(n/2);
  return n%2?prices[mid]:(prices[mid-1]+prices[mid])/2;
}
function gridUnitPrice(mod,sup,cid,month){
  const c=gridCatRow(sup,cid);if(!c)return 0;
  if(mod==='monthend'){const med=monthMedianPrice(sup,c.name,month);if(med>0)return med;}
  return +c.price||0;
}
async function setGridQty(mod,sup,cid,date,val){
  const qty=+val||0;const cfg=ledgerCfg(mod);d()[cfg.arr]=d()[cfg.arr]||[];const arr=d()[cfg.arr];
  const cat=gridCatRow(sup,cid);const item=cat?cat.name:'';const unit=gridUnitPrice(mod,sup,cid,date.slice(0,7));
  let rec=arr.find(r=>r.supplier===sup&&r.cid===cid&&r.date===date);const oldQty=rec?+rec.qty||0:0;
  if(qty<=0){if(rec){if(mod==='purchase')unreceivePur(rec);if(mod==='monthend'&&+rec.pcs>0){rec.qty=0;rec.price=0;}else arr.splice(arr.indexOf(rec),1);}}
  else{if(!rec){rec={supplier:sup,date,cid,item,code:cat?cat.code:'',qty:0,weight:0,unitPrice:unit,price:0,note:''};arr.push(rec);}
    rec.cid=cid;rec.item=item;rec.unitPrice=unit;rec.qty=qty;rec.price=+(qty*unit).toFixed(2);if(cat){rec.code=cat.code;rec.uom=cat.uom||'';}rec.invoice=gridInv(mod,sup,date);
    if(mod==='purchase'){const dq=qty-oldQty;if(dq>0)invReceive(item,dq,dq*unit,null,null,date);else if(dq<0)invUnreceive(item,-dq,(-dq)*unit,rec);}}
  gridRecalc(mod,sup);gridSave(mod,sup); // 即时算合计；存档延后防卡
}
async function setGridPrice(mod,sup,cid,val){if(mod==='monthend')return; // 月末盘点单价改自动算，不再手动填
  const price=+val||0;const c=gridCatRow(sup,cid);if(c)c.price=price;const arr=d()[ledgerCfg(mod).arr]||[];arr.forEach(r=>{if(r.supplier===sup&&r.cid===cid){r.unitPrice=price;r.price=+((+r.qty||0)*price).toFixed(2);}});gridRecalc(mod,sup);gridSave(mod,sup);}
/* 进货单专用：每一格自己填数量/当天价钱(/重量)，不再共用一整月的单价。
   价钱每天可能不同，所以每格都要重算一次加权成本：先把这一格旧的「驱动数量」扣回(不追溯成本，
   跟原本 setGridQty 的做法一致)，再用新的驱动数量 × 这天填的价钱重新入库。
   鱼类供应商(FISH_SUPPLIERS)是「重量×价钱」算总数、驱动加权成本；其余供应商是「数量×价钱」。
   鱼类的「数量」(条数/尾数)只是参考记录，不影响金额跟库存。 */
async function setGridCell(mod,sup,cid,date,field,val){
  if(mod!=='purchase')return; // 目前只有「进货单」改成按日填价；退货/月末盘点维持原本共用单价的做法
  const cfg=ledgerCfg(mod);d()[cfg.arr]=d()[cfg.arr]||[];const arr=d()[cfg.arr];
  const cat=gridCatRow(sup,cid);const item=cat?cat.name:'';
  const fish=FISH_SUPPLIERS.includes(sup);
  let rec=arr.find(r=>r.supplier===sup&&r.cid===cid&&r.date===date);
  const oldDrive=rec?(fish?+rec.weight||0:+rec.qty||0):0;
  // 只有「驱动数量和价钱都已经填了」的那一笔，才算真的入过库——避免只填一半时
  // 用金额=0 入库把加权成本冲淡；而 invUnreceive 又不会把成本追溯还原，冲淡了就回不来了。
  const hadValidOld=oldDrive>0&&(rec?+rec.price||0:0)>0;const oldAmt=rec?+rec.price||0:0;const oldPcs0=rec?+rec.qty||0:0;
  if(!rec){rec={supplier:sup,date,cid,item,code:cat?cat.code:'',qty:0,weight:0,unitPrice:0,price:0,note:''};arr.push(rec);}
  if(field==='qty')rec.qty=+val||0;
  else if(field==='price')rec.unitPrice=+val||0;
  else if(field==='weight')rec.weight=+val||0;
  if(cat){rec.code=cat.code;rec.uom=cat.uom||'';}
  rec.item=item;rec.invoice=gridInv(mod,sup,date);
  const newQty=+rec.qty||0,newWeight=+rec.weight||0,newPrice=+rec.unitPrice||0;
  const newDrive=fish?newWeight:newQty;
  rec.price=+(newDrive*newPrice).toFixed(2);
  const validNow=newDrive>0&&newPrice>0;
  if(hadValidOld)invUnreceive(item,oldDrive,oldAmt,rec);
  if(validNow)invReceive(item,newDrive,rec.price,null,null,date);
  if(fish)fishPcsAdj(item,(validNow?newQty:0)-(hadValidOld?oldPcs0:0));   // 库存「条数」跟着进货加减（只在这一格真的入过库时）
  if(newQty<=0&&newWeight<=0){const i=arr.indexOf(rec);if(i>=0)arr.splice(i,1);} // 数量、重量都清空才算这格没填
  gridRecalc(mod,sup);gridSave(mod,sup);
}
/* 输入当下(还没存档前)就先更新这一格自己显示的『总数』，存档交给 onchange→setGridCell
   有「重量」栏的(鱼类)用 重量×价钱；没有的用 数量×价钱。 */
function gridCellRecalc(el){
  const box=el.closest('.gcw');if(!box)return;
  let qty=0,price=0,weight=0,hasWeight=false;
  box.querySelectorAll('input[data-f]').forEach(inp=>{const v=+inp.value||0;if(inp.dataset.f==='qty')qty=v;else if(inp.dataset.f==='price')price=v;else if(inp.dataset.f==='weight'){weight=v;hasWeight=true;}});
  const drive=hasWeight?weight:qty;
  const amt=box.querySelector('.gcamt');if(amt)amt.textContent=(drive&&price)?money(drive*price):'-';
  try{dvFlag(el);}catch(e){}
}
function gridCellHTML(mod,sup,cid,date,w){
  const r=gridRec(mod,sup,cid,date);
  const qty=r?(+r.qty||0):0,price=r?(+r.unitPrice||0):0,weight=r?(+r.weight||0):0,amt=r?(+r.price||0):0;
  const fish=FISH_SUPPLIERS.includes(sup);const S=gEsc(sup);const zh=LANG==="zh";const dis=w?'':'disabled';
  const wtIn=fish?`<input type="number" step="0.01" placeholder="${zh?'重量':'Wt'}" data-f="weight" value="${weight||''}" ${dis} oninput="gridCellRecalc(this)" onchange="setGridCell('${mod}','${S}','${cid}','${date}','weight',this.value)">`:'';
  return `<div class="gcw">${wtIn}<input type="number" step="0.01" placeholder="${fish?(zh?'条数':'Pcs'):(zh?'数量':'Qty')}" data-f="qty" value="${qty||''}" ${dis} oninput="gridCellRecalc(this)" onchange="setGridCell('${mod}','${S}','${cid}','${date}','qty',this.value)"><input type="number" step="0.01" placeholder="${zh?'当天价钱':'Price'}" data-f="price" value="${price||''}" ${dis} oninput="gridCellRecalc(this)" onchange="setGridCell('${mod}','${S}','${cid}','${date}','price',this.value)"><div class="gcamt">${amt?money(amt):'-'}</div></div>`;
}
async function addGridItem(sup){const n=(prompt(LANG==="zh"?"新增品项名称：":"New item name:")||'').trim();if(!n)return;const cat=ensureGridCat(sup);const it=findItem(n);cat.push({cid:gridCid(),name:n,code:'',uom:it?it.unit:'',spec:'',price:it?+it.cost||0:0});await save();render();} // 允许重复品项
async function delGridItem(mod,sup,cid,month){const c=gridCatRow(sup,cid);const item=c?c.name:'';if(!confirm((LANG==="zh"?"移除品项『"+item+"』？会删除它本月的录入。":"Remove item "+item+"?")))return;const cat=ensureGridCat(sup);const i=cat.findIndex(x=>x.cid===cid);if(i>=0)cat.splice(i,1);const arr=d()[ledgerCfg(mod).arr]||[];for(let k=arr.length-1;k>=0;k--){const r=arr[k];if(r.supplier===sup&&r.cid===cid&&(r.date||'').slice(0,7)===month){if(mod==='purchase')unreceivePur(r);arr.splice(k,1);}}await save();render();}
async function addGridDate(mod,sup,month){const def=(TODAY.slice(0,7)===month)?TODAY:(month+'-01');const dt=(prompt(LANG==="zh"?"添加日期 (YYYY-MM-DD)：":"Add date (YYYY-MM-DD):",def)||'').trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(dt))return;if(dt.slice(0,7)!==month)return alert(LANG==="zh"?"日期必须在本月内":"Date must be in this month");const key=mod+'|'+sup+'|'+month;d().gridExtra=d().gridExtra||{};d().gridExtra[key]=d().gridExtra[key]||[];if(!d().gridExtra[key].includes(dt))d().gridExtra[key].push(dt);await save();render();}
async function delGridDate(mod,sup,month,date){if(!confirm((LANG==="zh"?"删除日期列 "+date+"？":"Delete date "+date+"?")))return;const arr=d()[ledgerCfg(mod).arr]||[];for(let k=arr.length-1;k>=0;k--){const r=arr[k];if(r.supplier===sup&&r.date===date){if(mod==='purchase')unreceivePur(r);arr.splice(k,1);}}const key=mod+'|'+sup+'|'+month;if(d().gridExtra&&d().gridExtra[key])d().gridExtra[key]=d().gridExtra[key].filter(x=>x!==date);await save();render();}

async function setGridPcs(mod,sup,cid,date,val){   // 月末盘点：记录这一格的条数（只是记录，不影响盘点金额和库存）

  else{if(pcs>0)rec.pcs=pcs;else delete rec.pcs;if(!(+rec.qty>0)&&!(+rec.pcs>0))arr.splice(arr.indexOf(rec),1);}

/* ================= 进货「按日」视图（SUPY 风格，mk76）=================
   手机上每天进货就是：选日期 → 找到品项 → 填 数量 / 单价（鱼类还有重量）→ 自动算金额。
   表格视图还在（右上角切换），两边读写的是同一份数据（setGridCell）。 */
/* ===== 「操作 ▾」下拉菜单（SUPY 做法：主按钮留外面，次要操作收进这里）===== */
function actm(items,label){const zh=LANG==="zh";items=items.filter(Boolean);if(!items.length)return '';
  return `<div class="actm"><button class="btn ghost sm" onclick="actmToggle(event,this)">${label||(zh?'操作':'Actions')} ▾</button><div class="actm-pop">${items.map(i=>`<button class="${i.danger?'dg':''}" onclick="actmClose();${i.on}">${i.l}</button>`).join('')}</div></div>`;}
function actmToggle(e,b){e.stopPropagation();const pp=b.nextElementSibling;const on=pp.classList.contains('show');actmClose();if(!on)pp.classList.add('show');}
function actmClose(){document.querySelectorAll('.actm-pop.show').forEach(x=>x.classList.remove('show'));}
document.addEventListener('click',e=>{if(!e.target.closest||!e.target.closest('.actm'))actmClose();});

/* 一行三个格子（重量/数量/单价）任何一格改了，都把这一行当前的值一起存：
   数量填好、单价还空着 → 自动带入上次的单价（SUPY 的做法）；先填单价再填数量也不会丢（表格视图会丢，这里不会）。 */
function dvLive(el){ // 输入时实时：数量/重量清空 → 单价立刻消失并存档
  const f=el.dataset.f;
  if(f!=='price'){const box=el.closest('.dv-in');const g=k=>{const i=box.querySelector('input[data-f="'+k+'"]');return i?(+i.value||0):0;};
    const pi=box.querySelector('input[data-f="price"]');
    if(g('qty')<=0&&g('weight')<=0&&pi&&pi.value){pi.value='';el.onchange&&el.onchange();return;}}
  gridCellRecalc(el);
}
async function dvCommit(el,sup,cid,dt){
  const box=el.closest('.dv-in');const inp=f=>box.querySelector('input[data-f="'+f+'"]');
  const g=f=>{const i=inp(f);return i?(+i.value||0):0;};
  let wt=g('weight'),q=g('qty'),pr=g('price');
  if(el.dataset.f==='qty'&&q>0&&!pr){const lp=dvLastPrice(sup,cid);if(lp>0){pr=lp;inp('price').value=lp;}}
  // 重量和数量都清空了 → 单价（含自动带出的）一起消失；只改单价那一格时不动
  if(el.dataset.f!=='price'&&q<=0&&wt<=0&&pr>0){pr=0;const pi=inp('price');if(pi)pi.value='';}
  if(inp('weight'))await setGridCell('purchase',sup,cid,dt,'weight',wt);
  await setGridCell('purchase',sup,cid,dt,'qty',q);
  await setGridCell('purchase',sup,cid,dt,'price',pr);

/* ============ 进货单拍照识别（mk94）============
   拍照 → 压缩 → Edge Function invoice-ocr（Claude 读图）→ 人工核对 → 写进「进货单」按日记录。
   识别结果只是「建议」，必须按「写入」才会动数据。 */
const INV_OCR_URL=SUPABASE_URL?(SUPABASE_URL+"/functions/v1/invoice-ocr"):"";
let _inv=null;
function invNorm(t){return String(t||'').toLowerCase().replace(/[^a-z0-9一-鿿]+/g,'');}
function invBigrams(t){const n=invNorm(t),o=new Set();for(let i=0;i<n.length-1;i++)o.add(n.slice(i,i+2));if(n.length===1)o.add(n);return o;}
function invGuess(name,cat){const a=invBigrams(name);if(!a.size)return '';let best='',bs=0;for(const c of cat){const b=invBigrams(c.name);if(!b.size)continue;let x=0;a.forEach(g=>{if(b.has(g))x++;});const sc=x/Math.min(a.size,b.size)*0.6+x/(a.size+b.size-x)*0.4;if(sc>bs){bs=sc;best=c.cid;}}return bs>=0.55?best:'';}
// —— 入口：底部中间按钮 / 进货单页「拍照识别」。弹出「拍照 / 从相册选」，识别出是哪家供应商后自动跳进去 ——
function invScan(hintSup){
  const zh=LANG==="zh";
  if(!AUTH()||!INV_OCR_URL)return alert(zh?"拍照识别需要登录云端账号后才能用":"Sign in to use invoice scan");
  window._invHint=hintSup||'';
  openForm(`<h3>${zh?'识别进货单':'Scan invoice'} <span class="x" onclick="closeM()">×</span></h3>
    <div class="mini" style="margin-bottom:12px;">${zh?'系统会自己认出是哪一家供应商，识别完先让你核对，确认后才写进去。同一张照片不能重复导入。':'The system detects the supplier, you review, then it is saved.'}</div>
    <div style="display:grid;gap:10px;">
      <button class="btn brand block" onclick="invPick(true)">${zh?'拍照':'Take photo'}</button>
      <button class="btn ghost block" onclick="invPick(false)">${zh?'从相册选':'Choose from album'}</button></div>`);
}
function invPick(camera){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';if(camera)inp.setAttribute('capture','environment');
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(f)invScanFile(window._invHint||'',f);};inp.click();

// 压缩 + 指纹：SHA-256（同一张图一模一样）+ 8×8 灰度平均哈希（重新存档/压缩过的同一张图也认得出）
async function invPrep(file){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  const max=1800,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const image=c.toDataURL('image/jpeg',0.85).split(',')[1];
  const s=document.createElement('canvas');s.width=8;s.height=8;const sx=s.getContext('2d');sx.drawImage(bmp,0,0,8,8);
  const px=sx.getImageData(0,0,8,8).data,g=[];for(let i=0;i<64;i++)g.push(px[i*4]*0.3+px[i*4+1]*0.59+px[i*4+2]*0.11);
  const avg=g.reduce((a,b)=>a+b,0)/64;let bits='';g.forEach(v=>{bits+=v>avg?'1':'0';});
  let ah='';for(let i=0;i<64;i+=4)ah+=parseInt(bits.slice(i,i+4),2).toString(16);
  let sha='';try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(image));sha=Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let hh=5381;for(let i=0;i<image.length;i+=7)hh=((hh<<5)+hh+image.charCodeAt(i))|0;sha='x'+(hh>>>0).toString(16)+'-'+image.length;}
  return {image,sha,ah};
}
function invHamming(a,b){if(!a||!b||a.length!==b.length)return 99;let n=0;for(let i=0;i<a.length;i++){let x=parseInt(a[i],16)^parseInt(b[i],16);while(x){n+=x&1;x>>=1;}}return n;}
function invFindDup(sha,ah){return (d().invScans||[]).find(r=>r.h===sha||(r.ah&&invHamming(r.ah,ah)<=3));}
function invWho(){return curUser?curUser.name:(ROLES[curRole]&&ROLES[curRole].name)||'';}
// 按发票上的供应商名/品项，在 ERP 的供应商里找出是哪一家
function invPickSupplier(j,hint){
  const names=supplierList().map(v=>v.name);
  if(j.supplierMatch&&names.includes(j.supplierMatch))return j.supplierMatch;
  if(j.supplier){const a=invBigrams(j.supplier);let best='',bs=0;names.forEach(n=>{const b=invBigrams(n.replace(/^[\(（][^\)）]*[\)）]/,''));if(!a.size||!b.size)return;let x=0;a.forEach(g=>{if(b.has(g))x++;});const sc=x/Math.min(a.size,b.size);if(sc>bs){bs=sc;best=n;}});if(bs>=0.7)return best;}
  let best='',bn=0;names.forEach(n=>{const cat=ensureGridCat(n)||[];let k=0;(j.lines||[]).forEach(l=>{if(invGuess(l.name,cat))k++;});if(k>bn){bn=k;best=n;}});
  if(bn>0&&bn>=Math.ceil((j.lines||[]).length/2))return best;
  return hint&&names.includes(hint)?hint:'';
}
function invMatchLines(lines,sup){
  const cat=sup?ensureGridCat(sup):[];
  return lines.map(l=>{let cid='';if(l.mname){const c=cat.find(x=>x.name===l.mname);if(c)cid=c.cid;}if(!cid&&cat.length)cid=invGuess(l.name,cat);return Object.assign(l,{cid,on:!!cid});});
}
async function invScanFile(hintSup,file){
  const zh=LANG==="zh";
  openForm(`<h3>${zh?'识别进货单':'Scan invoice'} <span class="x" onclick="closeM()">×</span></h3><div style="text-align:center;padding:26px 0;"><div class="skel" style="height:10px;width:60%;margin:0 auto 12px;"></div><div class="mini">${zh?'正在读取发票，约 5–15 秒…':'Reading invoice…'}</div></div>`);
  try{
    const pp=await invPrep(file);
    const dup=invFindDup(pp.sha,pp.ah);
    if(dup&&!window._invForce){
      try{auditLog('重复发票照片',`${invWho()} 又上传了已导入过的发票照片（原：${dup.by||''} ${dup.ts||''} · ${dup.sup||''} ${dup.date||''}${dup.invoiceNo?' · 单号 '+dup.invoiceNo:''}）`);await save();}catch(e){}
      window._invPending={hintSup,file};
      return openForm(`<h3>${zh?'这张照片已经导入过了':'Duplicate photo'} <span class="x" onclick="closeM()">×</span></h3>
        <div class="al al-r" style="line-height:1.7;">${zh?`<b>照片已重复。</b><br>${oEsc(dup.by||'')} 在 ${oEsc(dup.ts||'')} 已经导入过这张：<br>${oEsc(dup.sup||'')} · ${oEsc(dup.date||'')}${dup.invoiceNo?' · 单号 '+oEsc(dup.invoiceNo):''}${dup.n?' · '+dup.n+' 项':''}<br><span class="mini">这次重复上传已记进「审计日志」。</span>`:'Already imported.'}</div>
        <button class="btn block ghost" style="margin-top:10px;" onclick="closeM()">${zh?'取消（推荐）':'Cancel'}</button>
        <button class="btn block ghost" style="margin-top:8px;color:#b42318;" onclick="invForceScan()">${zh?'我确定要再导入一次':'Import anyway'}</button>`);

/* ============ 进货价格变动提醒（mk99，参照 SUPY「Received Items / Price Updated」）============

   「价格变动」页集中列出，逐条核对：确认新价 / 已向供应商追差价 / 忽略。判定结果存在 d().priceReview。 */

function priceFlagHTML(prev,now){
  prev=+prev||0;now=+now||0;if(!(prev>0&&now>0))return '';
  const pct=(now-prev)/prev*100;if(Math.abs(pct)<priceAlertPct())return '';
  const zh=LANG==="zh";return `<span class="pflag ${pct>0?'up':'dn'}">${pct>0?(zh?'涨':'Up'):(zh?'跌':'Down')} ${pct>0?'+':''}${pct.toFixed(1)}% · ${zh?'上次':'prev'} ${money(prev)}</span>`;
}

function priceChanges(){
  const by={};(d().purchases||[]).forEach(r=>{if((+r.unitPrice||0)>0&&r.supplier&&r.cid){(by[r.supplier+'|'+r.cid]=by[r.supplier+'|'+r.cid]||[]).push(r);}});
  const out=[],rv=d().priceReview||{};
  Object.values(by).forEach(arr=>{arr.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    for(let i=1;i<arr.length;i++){const a=arr[i-1],b=arr[i],p=+a.unitPrice,n=+b.unitPrice,pct=(n-p)/p*100;
      if(Math.abs(pct)<priceAlertPct())continue;

async function saveLedger(mod,editIdx){
  const cfg=ledgerCfg(mod);const g=id=>document.getElementById(id);
  const sup=g('l_sup').value;
  const rec={supplier:sup,date:g('l_date').value||TODAY,invoice:g('l_inv').value.trim(),code:g('l_code').value.trim(),item:g('l_item').value,qty:+g('l_qty').value||0,weight:+g('l_wt').value||0,price:+g('l_price').value||0,note:g('l_note').value.trim()};
  if(cfg.hasSettle)rec.settle=g('l_settle').value;
  if(!d()[cfg.arr])d()[cfg.arr]=[];
  if(editIdx!=null&&d()[cfg.arr][editIdx]){
    const old=d()[cfg.arr][editIdx];
    if(mod==='purchase'){unreceivePur(old);invReceive(rec.item,rec.qty,rec.price,null,null,rec.date);} // 采购编辑→库存差量
    auditLog("编辑单据",cfg.title+" "+sup+" "+rec.item, old.item+" "+money(old.price)+"×"+num(old.qty,2), rec.item+" "+money(rec.price)+"×"+num(rec.qty,2));
    d()[cfg.arr][editIdx]=rec;
  }else{
    d()[cfg.arr].push(rec);
    if(mod==='purchase')invReceive(rec.item,rec.qty,rec.price,null,null,rec.date); // 采购新增→自动入库+加权成本
    auditLog(cfg.title,sup+" "+rec.item+" "+money(rec.price),"",rec.invoice);
  }
  await save();selSupplier=sup;closeM();render();
}
async function delLedger(mod,gi){if(!confirm(LANG==="zh"?"删除此单据？":"Delete record?"))return;const cfg=ledgerCfg(mod);const old=d()[cfg.arr][gi]||{};if(mod==='purchase')unreceivePur(old);d()[cfg.arr].splice(gi,1);auditLog("删除单据",cfg.title+" "+(old.item||'')+" "+(old.invoice||''),money(old.price),"");await save();render();}

const SL24J_RATE={f1:0.0075,f2:0.01,f3:0.0125};
function round5(n){return Math.round(n*20)/20;}          // 取整到 5 仙
function ceilRM(n){return Math.ceil(n-1e-9);}            // 进位到下一令吉
function payWageCap(w){return Math.min(w,6000);}         // SOCSO/EIS/SL24J 封顶 RM6000
function epfShares(wage,local){ // EPF 第三附表（近似：取薪级带上限后进位到令吉）
  if(local===false||wage<=0)return {ee:0,er:0};
  const erRate=wage>5000?0.12:0.13;
  if(wage>20000)return {ee:ceilRM(wage*0.11),er:ceilRM(wage*0.12)};
  const top=wage<=5000?Math.ceil(wage/20)*20:Math.ceil(wage/100)*100;
  return {ee:ceilRM(top*0.11),er:ceilRM(top*erRate)};
}
function socsoShares(wage){ // 第一类别（工伤+残疾），费率×薪级中点
  const w=payWageCap(wage);if(w<=0)return{ee:0,er:0};
  const top=Math.min(Math.ceil(w/100)*100,6000);const mid=top-50;
  return {er:round5(mid*0.0175),ee:round5(mid*0.005)};
}
function eisShares(wage){
  const w=payWageCap(wage);if(w<=0)return{ee:0,er:0};
  const top=Math.min(Math.ceil(w/100)*100,6000);const mid=top-50;
  return {er:round5(mid*0.002),ee:round5(mid*0.002)};
}
function sl24jAmt(wage,on,rate){if(on===false)return 0;const w=payWageCap(wage);if(w<=0)return 0;return round5(w*(rate||0.0075));}
function empPositions(){if(!d().positions)d().positions=["经理","主管","服务员","总厨","二厨","普通厨师","洗碗工"];return d().positions;}
function empNats(){if(!d().nationalities)d().nationalities=["马来西亚","缅甸"];return d().nationalities;}
function isLocalNat(nat){return (nat||'')==='马来西亚';} // 国籍→EPF本地判定
function empIsLocal(e){return e.nationality?isLocalNat(e.nationality):(e.local!==false);}
function yearsService(e){if(!e||!e.joined)return 0;const j=new Date(e.joined);if(isNaN(j.getTime()))return 0;const y=(new Date(TODAY)-j)/(365.25*864e5);return Math.max(0,y);}
function sl24jPhaseOf(e){const y=yearsService(e);if(y<2)return {k:'f1',r:0.0075,label:'0.75%'};if(y<5)return {k:'f2',r:0.01,label:'1.0%'};return {k:'f3',r:0.0125,label:'1.25%'};}
function nextEmpNo(){const nums=(d().staff||[]).map(e=>{const m=/(\d+)/.exec(e.empNo||'');return m?+m[1]:0;});const mx=nums.length?Math.max(...nums):0;return 'EMP'+String(mx+1).padStart(3,'0');}
function taxResident(ci){ // YA2025 居民累进税
  if(ci<=5000)return 0;
  const b=[[5000,0],[20000,.01],[35000,.03],[50000,.06],[70000,.11],[100000,.19],[400000,.25],[600000,.26],[2000000,.28],[Infinity,.30]];
  let tax=0,prev=0;
  for(const[cap,rate]of b){if(ci>cap){tax+=(cap-prev)*rate;prev=cap;}else{tax+=(ci-prev)*rate;break;}}
  return tax;
}
function otHourly(basic){return (+basic||0)/26/8;}       // 马来西亚标准：月薪/26天/8小时
 // 5.5 → "5h 30m"，不带倍数
function computeRow(e,month){
  month=month||payrunMonth;
  const _r=(d().payrollRuns&&d().payrollRuns[month]);const ov=(_r&&_r.ov&&_r.ov[e.id])||{};
  const basic=+e.basic||0;
  const allowance=ov.allowance!=null?(+ov.allowance||0):(+e.allowance||0);
  const incentive=+ov.incentive||0;
  const ph=+ov.ph||0; // 公共假期津贴：手动 key in 的固定金额，介于奖励与OT之间
  const otHours=+ov.otHours||0; const otMult=ov.otMult!=null?+ov.otMult:1.5;
  const otAmt=round5(otHours*otHourly(basic)*otMult);
  const gross=basic+allowance+incentive+ph+otAmt;
  const local=empIsLocal(e);
  const epf=epfShares(gross,local),soc=socsoShares(gross),eis=eisShares(gross);
  const slp=sl24jPhaseOf(e);
  const sl=sl24jAmt(gross,ov.sl24jOn!==false,slp.r);
  // PCB 估算（年度投影，等额月薪）
  const epfReliefAnnual=Math.min(epf.ee*12,4000);
  let ci=gross*12-9000-epfReliefAnnual-((e.married&&!e.spouseWorking)?4000:0)-(Math.max(0,+e.children||0)*2000);
  let tax=taxResident(ci); if(ci<=35000)tax=Math.max(0,tax-400);
  const pcbAuto=Math.max(0,round5(tax/12));
  const pcb=ov.pcb!=null?(+ov.pcb||0):pcbAuto;
  const levy=+ov.levy||0; // 人头税占位（暂 0，不计入实发）
  const empDed=epf.ee+soc.ee+eis.ee+sl+pcb;
  const net=gross-empDed;
  return {basic,allowance,incentive,ph,otHours,otMult,otAmt,gross,epf,soc,eis,sl,slLabel:slp.label,pcb,pcbAuto,levy,empDed,net,erCost:gross+epf.er+soc.er+eis.er};
}

   都是本机产生的标准格式文件(CSV/打印表)，方便对照政府/银行格式手动上传或调整，
   不是官方系统直连——正式申报仍以 LHDN e-PCB / KWSP i-Akaun / PERKESO ASSIST 网站为准。 */
function downloadCSV(filename,rows){
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=filename;a.click();
}

/* 顶栏在窄手机上文字太多会自动换行、变高(实测 375px 宽的手机顶栏可以到 139px 高)；
   量出顶栏"现在真正的高度"写进 --topH 这个 CSS 变量，侧边菜单/遮罩层跟着它定位，
   永远从顶栏结束的地方开始，不会被拉高的顶栏盖住导致点不到。 */
function syncTopH(){
  const top=document.querySelector('.top');if(!top)return;
  const h=Math.ceil(top.getBoundingClientRect().height)||44;
  document.documentElement.style.setProperty('--topH',h+'px');
}
if(typeof window!=='undefined'){
  window.addEventListener('resize',syncTopH);
  window.addEventListener('orientationchange',()=>setTimeout(syncTopH,150));
}
/* ============ 效期管理（mk152）：每一批货登记到期日，快到期/过期提醒，先到期的先用 ============
   独立的数据 d().expiryLots=[{id,item,qty,unit,recv,exp,st:'open'|'used'|'discard',note,by,doneAt}]，
   不碰旧的「品项批次 batches」；用完/丢弃只改这一批的状态，库存数量照旧由进货/报废等流程管。
   「过期丢弃」会打开报废表单并填好品项/数量/原因，按保存才真的扣库存、记损耗。 */
let lotFilter='open',lotQuery='';
function lotDiff(exp){return Math.round((new Date(exp+'T00:00:00')-new Date(TODAY+'T00:00:00'))/86400000);} // 负数=已过期几天
function lotStatus(l){if(l.st==='used')return {k:'used',c:'p-n',t:'已用完'};if(l.st==='discard')return {k:'discard',c:'p-n',t:'已丢弃'};
  const n=lotDiff(l.exp);if(n<0)return {k:'exp',c:'p-r',t:'已过期'};if(n<=3)return {k:'d3',c:'p-r',t:'3 天内到期'};if(n<=7)return {k:'d7',c:'p-a',t:'7 天内到期'};return {k:'ok',c:'p-g',t:'正常'};}
function expiryCounts(){const L=(d().expiryLots||[]).filter(l=>l.st==='open'||!l.st);let exp=0,d3=0,d7=0;
  L.forEach(l=>{const n=lotDiff(l.exp);if(n<0)exp++;else if(n<=3)d3++;else if(n<=7)d7++;});return {open:L.length,exp,d3,d7};}
function setLotFilter(k){lotFilter=k;render();}

  const w=canW('inv');const all=(d().expiryLots||[]).map(l=>Object.assign({},l,{st:l.st||'open'}));const c=expiryCounts();
  const q=lotQuery.trim().toLowerCase();
  let list=all.filter(l=>{const s=lotStatus(l).k;
    if(lotFilter==='open'&&l.st!=='open')return false;
    if(lotFilter==='exp'&&s!=='exp')return false;
    if(lotFilter==='d3'&&!(s==='d3'||s==='exp'))return false;
    if(lotFilter==='d7'&&!(s==='d7'||s==='d3'||s==='exp'))return false;
    if(lotFilter==='done'&&l.st==='open')return false;
    return !q||(l.item||'').toLowerCase().includes(q)||(l.note||'').toLowerCase().includes(q);});
  list.sort((a,b)=>(a.st==='open'?0:1)-(b.st==='open'?0:1)||String(a.exp).localeCompare(String(b.exp)));
  const chip=(k,t,n)=>`<button class="${lotFilter===k?'active':''}" onclick="setLotFilter('${k}')">${t}${n!=null?' '+n:''}</button>`;
  const cards=list.map(l=>{const s=lotStatus(l),n=lotDiff(l.exp),open=l.st==='open';
    const left=!open?'':(n<0?(zh?`已过期 ${-n} 天`:`Expired ${-n}d`):n===0?(zh?'今天到期':'Expires today'):(zh?`还剩 ${n} 天`:`${n} days left`));
    return `<div class="dv-row inv-card ${open&&n<=3?'low':''}" data-name="${oEsc(((l.item||'')+' '+(l.note||'')).toLowerCase())}">
      <div style="min-width:0;"><div class="dv-name">${oEsc(l.item)} <span class="pill ${s.c}">${zh?s.t:s.k}</span></div>
        <div class="mini">${zh?'到期':'Exp'} ${l.exp}${left?' · <b>'+left+'</b>':''} · ${zh?'进货':'In'} ${l.recv||'—'}</div>${l.note?`<div class="mini">${oEsc(l.note)}</div>`:''}</div>
      <div class="inv-qty"><div class="inv-q">${l.qty} <small>${oEsc(l.unit||'')}</small></div>${w?`<div class="inv-act">${open?`<button class="btn ghost sm" onclick="lotDone(${l.id},'used')">${zh?'用完':'Used'}</button><button class="btn ghost sm" onclick="lotDone(${l.id},'discard')">${zh?'丢弃':'Discard'}</button>`:''}<button class="ib" onclick="formLot(${l.id})">✏️</button><button class="ib" onclick="delLot(${l.id})">🗑️</button></div>`:''}</div></div>`;}).join('');
  return `<div class="fb"><h2 class="h" style="margin:0;">${zh?'(有效期)管理':'Expiry'} <span class="tag">${nm(outletObj())}</span></h2>${w?`<button class="btn brand sm" onclick="formLot()">+ ${zh?'登记批次':'Add lot'}</button>`:''}</div>

  <details class="hintd"><summary>${zh?'说明':'Notes'}</summary><div>${zh?'每次收到有保质期的货（肉、海鲜、酱料、半成品…），就登记一批：品项、数量、到期日。系统按到期日从早到晚排，最早到期的排最上面，请先用它。\n用完了按「用完」；坏了、过期了按「丢弃」（会打开报废表单并填好，按保存才扣库存）。\n快到期（3 天内）或已过期的会出现在「运营健康 → 通知中心」。\n这里只管「哪一批什么时候到期」，库存数量照旧由进货单、报废等地方管。':'Register each lot with an expiry date. Earliest first. Mark used / discard.'}</div></details>
  <div class="dv-tools"><input class="dv-search" type="search" value="${oEsc(lotQuery)}" placeholder="${zh?'搜索品项/备注…':'Search…'}" oninput="lotQuery=this.value;render()" autocomplete="off"></div>
  <div class="seg mtabs nox" style="margin-bottom:10px;">${chip('open',zh?'在库':'Open',c.open)}${chip('d7',zh?'7 天内':'≤7d')}${chip('d3',zh?'3 天内':'≤3d')}${chip('exp',zh?'已过期':'Expired')}${chip('done',zh?'已处理':'Done')}${chip('all',zh?'全部':'All')}</div>
  <div class="inv-grid">${cards||`<div class="empty">${zh?(all.length?'没有符合的批次':'还没有登记任何批次。收到有保质期的货，按右上「登记批次」。'):'None'}</div>`}</div>`;
}

function lotDaysCalc(){const n=document.getElementById('lot_days').value,r=document.getElementById('lot_recv').value;if(n===''||!r)return;const dt=new Date(r+'T00:00:00');dt.setDate(dt.getDate()+(+n||0));document.getElementById('lot_exp').value=dt.toLocaleDateString('en-CA');}
async function saveLot(id){
  const zh=LANG==="zh",g=k=>document.getElementById(k).value.trim();
  const item=g('lot_item'),qty=+g('lot_qty'),exp=g('lot_exp');
  if(!item)return alert(zh?'请填品项':'Item required');
  if(!(qty>0))return alert(zh?'数量要大于 0':'Qty > 0');
  if(!exp)return alert(zh?'请填到期日（或填保质天数）':'Expiry required');
  if(!d().expiryLots)d().expiryLots=[];
  const rec={item,qty,unit:g('lot_unit'),recv:g('lot_recv')||TODAY,exp,note:g('lot_note')};
  if(id){const l=d().expiryLots.find(x=>x.id===id);if(!l)return;Object.assign(l,rec);auditLog('编辑效期批次',item+' '+exp);}
  else{d().expiryLots.push(Object.assign({id:Date.now(),st:'open',by:(curUser&&curUser.name)||''},rec));auditLog('登记效期批次',item+' ×'+qty+' 到期 '+exp);}
  await save();closeM();render();
}
async function lotDone(id,st){
  const zh=LANG==="zh";const l=(d().expiryLots||[]).find(x=>x.id===id);if(!l)return;
  if(!confirm(st==='used'?(zh?`「${l.item}」这一批已经用完？`:'Mark used?'):(zh?`「${l.item}」这一批要丢弃？接下来会打开报废表单，按保存才会扣库存。`:'Discard this lot?')))return;
  l.st=st;l.doneAt=TODAY;auditLog(st==='used'?'效期批次用完':'效期批次丢弃',l.item+' ×'+l.qty);await save();render();
  if(st==='discard'){
    try{if(typeof formWaste2==='function'&&can('waste')){formWaste2();
      const set=(k,v)=>{const e=document.getElementById(k);if(e)e.value=v;};
      const it=(d().items||[]).find(i=>i.name===l.item);

  }
}

/* ============ 菜单分析（mk152）：每道菜「卖得多不多」×「赚得多不多」分四类 ============
   用当月 POS 导入的销量（monthSales）× 菜品配方成本。只看食材成本毛利，不含人工租金。
   分类法（餐饮业常用的 Kasavana–Smith）：受欢迎＝份数 ≥ 平均份数×70%；赚钱＝单份毛利 ≥ 全部菜的加权平均单份毛利。 */
let meMonth=null;
function pgMenuEng(){return finTabs('menueng')+pgMenuEngBody();}
function menuEngData(m){
  const dishes=d().dishCosts||[];const rows=[],nocost=[];
  monthSales(m).forEach(s=>{const dc=dishes.find(x=>x.id===s.dishId);const q=+s.qty||0;if(!dc||q<=0)return;
    const price=+dc.price||0,cost=dishCostForMonth(dc,m);
    if(!(cost>0)||!(price>0)){nocost.push({name:dc.cn||dc.code||'?',qty:q,price,cost});return;}
    rows.push({name:dc.cn||dc.code||'?',en:dc.en||'',qty:q,price,cost,gp:price-cost,pct:cost/price*100});});
  const totQ=rows.reduce((a,r)=>a+r.qty,0),totGP=rows.reduce((a,r)=>a+r.gp*r.qty,0);
  const avgGP=totQ?totGP/totQ:0,popLine=rows.length?totQ/rows.length*0.7:0;
  rows.forEach(r=>{r.share=totQ?r.qty/totQ*100:0;r.pop=r.qty>=popLine;r.prof=r.gp>=avgGP;r.cls=r.pop&&r.prof?'star':r.pop?'horse':r.prof?'puzzle':'dog';});
  return {rows,nocost,totQ,totGP,avgGP,popLine};
}
function pgMenuEngBody(){
  const zh=LANG==="zh",cur=TODAY.slice(0,7),pm=prevMonthOf(cur),months=[prevMonthOf(pm),pm,cur];
  if(!meMonth)meMonth=months.find(x=>monthSales(x).length)||pm;const m=meMonth;
  if(isAgg())return `<div class="empty">${zh?'请先在右上角选一间分店。':'Pick an outlet first.'}</div>`;
  const D=menuEngData(m);
  const tabs=`<div class="seg mtabs nox" style="margin-bottom:10px;">${months.map(x=>`<button class="${x===m?'active':''}" onclick="meMonth='${x}';render()">${monthLabel2(x)}</button>`).join('')}</div>`;
  const head=`<div class="fb"><h2 class="h" style="margin:0;">${zh?'菜单分析':'Menu analysis'} <span class="tag">${nm(outletObj())}</span></h2></div>`;
  if(!D.rows.length)return head+tabs+`<div class="empty">${zh?`${monthLabel2(m)} 还没有可以分析的销量。先到「月度核算」导入 POS 销售报表（或手动录入销量），并确认每道菜都设好成本。`:'No sales.'}</div>`+(D.nocost.length?`<div class="mini" style="margin-top:8px;">${zh?'这些菜没设成本，没法分析：':'No cost:'} ${D.nocost.map(r=>oEsc(r.name)).join('、')}</div>`:'');
  const info={star:{t:zh?'明星菜':'Stars',c:'p-g',h:zh?'卖得多、也赚钱。保持品质，放在菜单最显眼位置，不要乱涨价。':'Popular & profitable.'},

async function saveTemp(date,slot){

/* ============ 批量操作（mk155）：多选 → 一次删除 / 一次标记，只给店长以上 ============
   做法：不改各页面原来的代码。页面画好之后（render 末尾 bulkDecorate），找出每张卡片上原本的「🗑 删除」按钮，
   把它的 onclick（例如 delWaste2(3)）当作这张卡片的「删除动作」；批量删除时就把选中的卡片的删除动作逐个执行，
   执行期间暂时跳过逐笔确认和逐笔保存，最后只保存一次（所以每一笔的库存还原、审计记录都和单个删除一模一样）。
   按钮没出现的卡片（没权限、已锁定）自然不能选。 */
const BULK_ROLES=['owner','hrmgr','area','outletmgr','manager'];
const BULK_PAGES=['hr','waste2','offer','opexlog','grn','transfer','schedule','bom','monthly','expiry'];
let bulkOn=false,bulkPage='',bulkSel=new Set();
function bulkAllowed(){const r=(typeof realRole==='function')?realRole():curRole;return BULK_ROLES.includes(r)&&BULK_ROLES.includes(curRole)&&!isAgg();}
function bulkItems(){ // 每张可删除的卡片：{card,call}
  const host=document.getElementById('pageHost');if(!host)return [];const out=[],seen=new Set();
  host.querySelectorAll('[onclick]').forEach(b=>{const c=(b.getAttribute('onclick')||'').trim();
    if(!/^del[A-Za-z0-9]+\([^()]*\)$/.test(c))return;
    const card=b.closest('.dv-row,.stf-card,.inv-card,.xfer-card');if(!card||seen.has(card))return;
    const dels=[...card.querySelectorAll('[onclick]')].filter(x=>/^del[A-Za-z0-9]+\(/.test((x.getAttribute('onclick')||'').trim()));
    if(dels.length!==1)return;seen.add(card);out.push({card,call:c});});
  return out;}
function bulkToggle(on){bulkOn=!!on;if(!on)bulkSel.clear();render();}
function bulkPick(call,checked){if(checked)bulkSel.add(call);else bulkSel.delete(call);bulkRefresh();}
function bulkAll(checked){bulkItems().forEach(x=>{if(checked)bulkSel.add(x.call);else bulkSel.delete(x.call);});render();}
function bulkRefresh(){const n=bulkSel.size;const c=document.getElementById('bulkCnt');if(c)c.textContent=n;document.querySelectorAll('.bulkbar button[data-needsel]').forEach(b=>{b.disabled=!n;});}
// 批量按钮放哪里：优先放在页面上已有的「操作 ▾」右边；没有的话放进页头那排按钮的最后；都没有才单独一行（页面不要多出一整行）
function bulkPlaceBtn(label,on,cls){
  const host=document.getElementById('pageHost');if(!host)return;
  const btn=document.createElement('button');btn.className='btn ghost sm bulkbtn';btn.textContent=label;btn.setAttribute('onclick',on);
  const am=host.querySelector('.actm');
  if(am&&am.parentNode){am.insertAdjacentElement('afterend',btn);return;}
  const fb=host.querySelector('.fb');const grp=fb&&fb.lastElementChild;
  if(grp&&grp.tagName==='DIV'&&grp.querySelector('button')){grp.appendChild(btn);return;}
  const bar=document.createElement('div');bar.className='bulkbar';bar.appendChild(btn);
  if(fb&&fb.nextSibling)fb.parentNode.insertBefore(bar,fb.nextSibling);else host.insertBefore(bar,host.firstChild);
}
function bulkDecorate(){
  document.querySelectorAll('.bulkbar,.bulkbtn').forEach(e=>e.remove());
  if(bulkPage!==curPage){bulkOn=false;bulkSel.clear();bulkPage=curPage;}
  try{supBulkDecorate();}catch(e){}
  if(!BULK_PAGES.includes(curPage)||!bulkAllowed()){return;}
  const items=bulkItems();if(!items.length){bulkOn=false;return;}
  const zh=LANG==="zh",host=document.getElementById('pageHost');
  const bar=document.createElement('div');bar.className='bulkbar';
  if(!bulkOn){bulkPlaceBtn(zh?'批量操作':'Bulk actions','bulkToggle(true)');return;}
  // 清掉已经不存在的选择
  const calls=new Set(items.map(x=>x.call));[...bulkSel].forEach(c=>{if(!calls.has(c))bulkSel.delete(c);});
  items.forEach(x=>{x.card.classList.add('bk-on');const ck=document.createElement('input');ck.type='checkbox';ck.className='bkc';ck.checked=bulkSel.has(x.call);
    ck.onclick=ev=>ev.stopPropagation();ck.onchange=()=>bulkPick(x.call,ck.checked);x.card.insertBefore(ck,x.card.firstChild);});
  const extra=(curPage==='expiry')?`<button class="btn ghost sm" data-needsel="1" onclick="bulkLotsUsed()">${zh?'批量用完':'Mark used'}</button>`:'';
  bar.className='bulkbar on';
  bar.innerHTML=`<label style="display:flex;gap:6px;align-items:center;"><input type="checkbox" ${bulkSel.size===items.length?'checked':''} onchange="bulkAll(this.checked)"> ${zh?'全选':'All'}</label><span>${zh?'已选':'Selected'} <b id="bulkCnt">${bulkSel.size}</b> / ${items.length}</span><span style="flex:1"></span>${extra}<button class="btn sm" style="background:var(--red,#b3261e);color:#fff;" data-needsel="1" onclick="bulkDelete()">${zh?'删除选中':'Delete'}</button><button class="btn ghost sm" onclick="bulkToggle(false)">${zh?'取消':'Cancel'}</button>`;
  host.insertBefore(bar,host.firstChild);bulkRefresh();
}
async function bulkDelete(){
  const zh=LANG==="zh";const calls=[...bulkSel];if(!calls.length)return;
  if(!confirm(zh?`确定删除选中的 ${calls.length} 项？\n每一项都和单个删除一样处理（例如报废会把库存加回去），删除后不能复原。`:`Delete ${calls.length} items?`))return;
  // 同一种删除，按参数从大到小执行（按位置删除的列表才不会错位）
  const parsed=calls.map(c=>{const m=c.match(/^(del[A-Za-z0-9]+)\((.*)\)$/);const args=m?m[2].split(','):[];const last=(args[args.length-1]||'').trim();
    return {c,fn:(m?m[1]:'')+'|'+args.slice(0,-1).join(','),num:/^-?\d+$/.test(last)?+last:-1};})
    .sort((a,b)=>a.fn.localeCompare(b.fn)||b.num-a.num);
  const rs=save,rr=render,rc=window.confirm;let ok=0,bad=0;
  save=async()=>{};render=()=>{};window.confirm=()=>true;
  try{for(const p of parsed){try{await (new Function('return '+p.c))();ok++;}catch(e){bad++;}}}
  finally{save=rs;render=rr;window.confirm=rc;}
  try{auditLog('批量删除',`${curPage} 共 ${ok} 项`+(bad?`，失败 ${bad} 项`:''));}catch(e){}
  bulkSel.clear();bulkOn=false;await save();render();
  if(bad)alert(zh?`有 ${bad} 项没删掉，其余 ${ok} 项已删除。`:`${bad} failed`);
}
async function bulkLotsUsed(){
  const zh=LANG==="zh";const ids=[...bulkSel].map(c=>{const m=c.match(/^delLot\((\d+)\)$/);return m?+m[1]:null;}).filter(Boolean);if(!ids.length)return;
  if(!confirm(zh?`把选中的 ${ids.length} 批标记为「已用完」？`:'Mark used?'))return;
  let n=0;(d().expiryLots||[]).forEach(l=>{if(ids.includes(l.id)&&(l.st==='open'||!l.st)){l.st='used';l.doneAt=TODAY;n++;}});
  try{auditLog('效期批次批量用完',n+' 批');}catch(e){}bulkSel.clear();bulkOn=false;await save();render();
}

/* ============ 供应商品项批量管理（mk157，店长以上）============
   两个地方：① 进货单 / 退货补货 / 月末盘点 点进某家供应商后（品项表 d().gridCat[供应商]，三处共用）；
            ② 库存 点进某家供应商后（库存品项 d().items）。
   页面上自动多一个「批量管理品项」按钮（supBulkDecorate，在 bulkDecorate 里调用，不改原页面代码）。
   能做：勾选品项 → 批量更动（只套用有填的栏位）/ 清除数据 / 删除。删除和清除的处理方式跟原本单个删除一样。 */
function supBulkDecorate(){
  if(!bulkAllowed())return;const zh=LANG==="zh";const host=document.getElementById('pageHost');if(!host)return;
  let on='';
  if(['purchase','grn','monthend'].includes(curPage)&&selSupplier&&subCanW(curPage))on=`openGridBulk('${curPage}')`;
  else if(curPage==='inv'&&invSupplier&&canW('inv'))on='openInvBulk()';
  if(!on)return;
  bulkPlaceBtn(zh?'批量管理':'Bulk edit',on);
}
function supBulkSel(){return [...document.querySelectorAll('.sbsel:checked')].map(c=>c.value);}
function supBulkAll(on){document.querySelectorAll('.sbsel').forEach(c=>{c.checked=!!on;});supBulkCount();}
function supBulkCount(){const n=supBulkSel().length,e=document.getElementById('sbCnt');if(e)e.textContent=n;}
function supBulkList(rows){ // rows:[{v,t,s}]
  return `<div style="display:flex;gap:10px;align-items:center;margin:4px 0 6px;"><label style="display:flex;gap:6px;align-items:center;"><input type="checkbox" onchange="supBulkAll(this.checked)"> ${LANG==="zh"?'全选':'All'}</label><span class="mini">${LANG==="zh"?'已选':'Selected'} <b id="sbCnt">0</b> / ${rows.length}</span></div>
  <div style="max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 8px;">${rows.map(r=>`<label style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);"><input type="checkbox" class="sbsel" value="${oEsc(r.v)}" onchange="supBulkCount()" style="width:20px;height:20px;flex:0 0 auto;"><span style="min-width:0;"><b>${oEsc(r.t)}</b><br><span class="mini">${r.s}</span></span></label>`).join('')}</div>`;
}
// ---------- ① 进货单 / 退货补货 / 月末盘点 ----------

  const def=(ledgerMonth&&ledgerMonth!=='all')?ledgerMonth:TODAY.slice(0,7);if(!months.includes(def))months.unshift(def);
  const S=gEsc(sup);const priceOK=mod==='grn';
  openForm(`<h3>${zh?'批量管理品项':'Bulk edit items'} <span class="x" onclick="closeM()">×</span></h3>
    <div class="mini" style="margin-bottom:6px;">${oEsc(sup)} · ${ledgerCfg(mod).title}</div>

    <div class="sec" style="font-weight:700;margin:14px 0 4px;">${zh?'批量更动（只套用有填的栏位，空的不动）':'Change (only filled fields)'}</div>

    ${priceOK?'':`<div class="mini" style="margin-bottom:6px;">${mod==='purchase'?(zh?'进货单的单价是每天各自填的，这里不批量改。':''):(zh?'月末盘点的单价是自动算的（本月进货单价中位数），这里不批量改。':'')}</div>`}
    <button class="btn brand block" onclick="gridBulkApply('${mod}')">${zh?'套用到选中的品项':'Apply'}</button>
    <div class="sec" style="font-weight:700;margin:16px 0 4px;">${zh?'清除数据 / 删除':'Clear / delete'}</div>
    <div class="fr"><label>${zh?'哪个月':'Month'}</label><select id="gb-month">${months.map(m=>`<option value="${m}" ${m===def?'selected':''}>${monthLabel2(m)}</option>`).join('')}</select></div>

    <div class="mini" style="margin-top:6px;">${zh?'清除＝品项留着，只把这个月填过的数量/价钱清空。删除＝品项从这家供应商的清单拿掉（进货单、退货补货、月末盘点共用同一份清单），并清除它这个月的录入。':''}</div>`);
}
async function gridBulkApply(mod){
  const zh=LANG==="zh";const ids=supBulkSel();if(!ids.length)return alert(zh?'先勾选品项':'Select items first');
  const v=k=>{const e=document.getElementById(k);return e?e.value.trim():'';};const uom=v('gb-uom'),spec=v('gb-spec'),code=v('gb-code'),price=v('gb-price');
  if(!uom&&!spec&&!code&&price==='')return alert(zh?'没有填要改的东西':'Nothing to change');
  const cat=ensureGridCat(selSupplier);let n=0;cat.forEach(c=>{if(!ids.includes(c.cid))return;if(uom)c.uom=uom;if(spec)c.spec=spec;if(code)c.code=code;if(price!==''&&!isNaN(+price))c.price=+price;n++;});
  try{auditLog('批量更动品项',`${selSupplier} ${n} 项`+[uom&&('单位='+uom),spec&&('规格='+spec),code&&('代码='+code),price!==''&&('单价='+price)].filter(Boolean).map(x=>' '+x).join(''));}catch(e){}
  await save();closeM();render();
}
function gridBulkRemoveEntries(mod,ids,month){ // 和单个删除一样：进货单要把库存扣回去
  const arr=d()[ledgerCfg(mod).arr]||[];let n=0;
  for(let k=arr.length-1;k>=0;k--){const r=arr[k];if(r.supplier===selSupplier&&ids.includes(r.cid)&&(r.date||'').slice(0,7)===month){if(mod==='purchase')unreceivePur(r);arr.splice(k,1);n++;}}
  return n;}
async function gridBulkClear(mod){
  const zh=LANG==="zh";const ids=supBulkSel();if(!ids.length)return alert(zh?'先勾选品项':'Select items first');const m=document.getElementById('gb-month').value;
  if(!confirm(zh?`清除选中的 ${ids.length} 个品项在 ${monthLabel2(m)} 的全部录入？品项会留着。${mod==='purchase'?'\n进货的库存会一起扣回去。':''}\n清除后不能复原。`:'Clear?'))return;
  const n=gridBulkRemoveEntries(mod,ids,m);try{auditLog('批量清除录入',`${selSupplier} ${monthLabel2(m)} ${ids.length} 个品项，共 ${n} 笔`);}catch(e){}
  await save();closeM();render();
}
async function gridBulkDel(mod){
  const zh=LANG==="zh";const ids=supBulkSel();if(!ids.length)return alert(zh?'先勾选品项':'Select items first');const m=document.getElementById('gb-month').value;
  if(!confirm(zh?`删除选中的 ${ids.length} 个品项？\n它们会从这家供应商的清单拿掉（进货单、退货补货、月末盘点都看不到），${monthLabel2(m)} 的录入也会清除。\n删除后不能复原。`:'Delete?'))return;
  const n=gridBulkRemoveEntries(mod,ids,m);const cat=ensureGridCat(selSupplier);
  for(let i=cat.length-1;i>=0;i--)if(ids.includes(cat[i].cid))cat.splice(i,1);
  try{auditLog('批量删除品项',`${selSupplier} ${ids.length} 个品项，清除 ${n} 笔录入`);}catch(e){}
  await save();closeM();render();
}

function ui2Iconize(root){
  if(!UI2||!root)return;
  const doText=t=>{
    const s=t.nodeValue;if(!s||!UI2_RE.test(s)){UI2_RE.lastIndex=0;return;}UI2_RE.lastIndex=0;
    const par=t.parentNode;if(!par||UI2_SKIP[par.nodeName]||(par.closest&&par.closest('[contenteditable],svg')))return;
    if(par.nodeName==='OPTION'){t.nodeValue=s.replace(UI2_RE,'').replace(/^\s+/,'');UI2_RE.lastIndex=0;return;}
    const frag=document.createDocumentFragment();let last=0,m;
    while((m=UI2_RE.exec(s))){
      if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      if(m[1]){const w=document.createElement('span');w.innerHTML=ui2Svg(UI2_EMOJI[m[1]]);frag.appendChild(w.firstChild);}
      else if(m[2]){const d=document.createElement('span');d.className='dotc';d.style.background=UI2_DOT[m[2]];frag.appendChild(d);}
      last=m.index+m[0].length;}
    if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));
    UI2_RE.lastIndex=0;par.replaceChild(frag,t);
  };
  if(root.nodeType===3){doText(root);return;}
  if(root.nodeType!==1||UI2_SKIP[root.nodeName])return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);const list=[];let n;while((n=w.nextNode()))list.push(n);
  list.forEach(doText);
  // 标题、按钮、折叠标题前面的图标不要（只用文字，更干净统一）；纯图标按钮保留
  const SEL='.h,.m h3,summary,.btn';
  const hs=(root.matches&&root.matches(SEL))?[root]:[];root.querySelectorAll&&root.querySelectorAll(SEL).forEach(x=>hs.push(x));
  hs.forEach(el=>{let c=el.firstChild;while(c&&c.nodeType===3&&!c.nodeValue.trim())c=c.nextSibling;
    if(c&&c.nodeType===1&&c.classList.contains('ic')&&(el.textContent||'').trim()){while(el.firstChild!==c)el.removeChild(el.firstChild);c.remove();}});
}

/* —— 三种音色（全部现场合成）——
   机械风 = 机械键盘青轴「click-clack」；中式风 = 麻将牌拍桌「啪」/洗牌；Default = 只有小鱼的水花声 */
function _key(ac,t,vol,pitch){   // 机械键盘青轴：清脆「click」一声
  _noise(ac,t,.012,.34*vol,'highpass',5200);_tone(ac,t,'square',2400*pitch,1500*pitch,.012,.05*vol);
  _tone(ac,t+.004,'sine',175*pitch,85*pitch,.05,.16*vol);_noise(ac,t+.004,.04,.1*vol,'bandpass',950,520);
}
function _mj(ac,t,vol,low){      // 麻将牌拍在木桌上
  _noise(ac,t,.03,.55*vol,'bandpass',2300,1200);_tone(ac,t,'triangle',1900,900,.025,.08*vol);
  _tone(ac,t,'sine',low?115:190,low?58:95,.12,.34*vol);_noise(ac,t+.01,.1,.14*vol,'lowpass',720,300);
}
function _splashSnd(ac,t,big){   // 水花
  _noise(ac,t,big?.5:.34,big?.34:.24,'bandpass',big?1400:1800,480);_noise(ac,t,.2,.1,'highpass',3500,6500);_tone(ac,t,'sine',150,60,.16,.13);
  for(let i=0;i<(big?5:3);i++)_tone(ac,t+.03+Math.random()*.26,'sine',300+Math.random()*300,900+Math.random()*700,.07,.07);
}
function sfx(kind){
  if(!sfxOn())return;const th=ui2Theme();
  const sp=kind==='splash'||kind==='splashbig'||kind==='dragon';
  if(th==='classic'&&!sp)return;
  const now=Date.now();if(kind==='tap'&&now-_sfxLast<45)return;_sfxLast=now;
  const ac=sfxCtx();if(!ac)return;if(sp&&ac.state!=='running')return;   // 开屏时手机还没点过屏幕 → 浏览器不让出声，就不出
  const t=ac.currentTime+.005;
  if(kind==='dragon'){_noise(ac,t,.9,.1,'bandpass',300,1800);_tone(ac,t,'sawtooth',70,48,.9,.07);_tone(ac,t,'sine',200,1400,.7,.05);[0,.12,.24,.36,.5].forEach((d,i)=>_tone(ac,t+d,'sine',1500+i*260,1500+i*260,.35,.045));return;}
  if(sp){_splashSnd(ac,t,kind==='splashbig');return;}
  if(th==='mech')_key(ac,t,1,1);          // click
  else _mj(ac,t,1,false);                  // 啪
}

const FISH_ON=false;
function ui2Fish(){
  if(!FISH_ON)return;   // 鱼跃龙门动画暂时关闭（业主 2026-11 要求）；要恢复把 FISH_ON 改 true

  const old=document.getElementById('fishFx');if(old)old.remove();
  const W=window.innerWidth,H=window.innerHeight,mobile=W<=760;
  const POOL=34,tabOff=mobile?70:0,waterY=H-tabOff-POOL;
  const G=Math.min(300,Math.round(H*.4)),GW=Math.round(G*150/230),cx=W/2;
  const box=document.createElement('div');box.id='fishFx';
  box.innerHTML=`<div class="fish-gate" style="left:${cx-GW/2}px;top:${waterY-G+8}px;width:${GW}px;height:${G}px;">${GATE_SVG}</div>
    <canvas class="dragon-cv"></canvas><div class="fish-wrap"><div class="fish-flip">${FISH_SVG}</div></div><div class="fish-glow"></div><div class="fish-pool" style="bottom:${tabOff}px;height:${POOL}px"></div>`;
  document.body.appendChild(box);

  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx._w=W;cv._w=W;ctx.canvas._w=W;
  const poolB=tabOff+POOL,fish=box.querySelector('.fish-wrap'),flip=box.querySelector('.fish-flip'),glow=box.querySelector('.fish-glow');
  const FW=mobile?150:170,FH=Math.round(FW*52/110);
  fish.style.width=FW+'px';fish.style.height=FH+'px';flip.style.width=FW+'px';flip.style.height=FH+'px';
  const apexH=Math.round(G*.52),apexY=waterY-apexH;
  const jumps=[{t0:.3,x0:.16,x1:.38,h:100,D:.8},{t0:1.15,x0:.84,x1:.62,h:135,D:.85},{t0:2.05,x0:cx/W-.32,x1:cx/W+.32,h:apexH,D:1.15}];
  const tApex=jumps[2].t0+jumps[2].D/2,DR=3.1,Wmax=mobile?42:54,R=apexY+Wmax*10;
  jumps.forEach((j,i)=>{const last=i===2;
    setTimeout(()=>{fishSplash(box,j.x0*W,poolB,false);sfx('splash');},j.t0*1000);
    if(!last)setTimeout(()=>{fishSplash(box,j.x1*W,poolB,false);sfx('splash');},(j.t0+j.D)*1000-40);});
  setTimeout(()=>{fxGold(box,cx,apexY,34);sfx('dragon');glow.style.cssText=`left:${cx}px;top:${apexY}px;`;glow.classList.add('on');},tApex*1000);
  const P=v=>{if(v<0)return {x:cx,y:apexY-v*R*.9};return {x:cx+Math.sin(v*7.4)*(.55+.45*Math.min(1,v*2))*Math.min(W*.3,120),y:apexY-R*(v*1.2-.2*v*v)};};
  const t00=performance.now();let raf=0;
  function frame(now){const t=(now-t00)/1000;let fishOn=false;
    for(const j of jumps){const u=(t-j.t0)/j.D;if(u<0||u>1)continue;if(j===jumps[2]&&t>=tApex)break;fishOn=true;
      const x=(j.x0+(j.x1-j.x0)*u)*W,y=j.h*4*u*(1-u),dir=j.x1>j.x0?1:-1,vy=j.h*4*(1-2*u)/j.D,vx=Math.abs(j.x1-j.x0)*W/j.D,ang=-dir*Math.atan2(vy,vx)*180/Math.PI;
      flip.style.transform='scaleX('+dir+')';fish.style.transform=`translate(${(x-FW/2).toFixed(1)}px,${(waterY-y-FH/2).toFixed(1)}px) rotate(${ang.toFixed(1)}deg)`;break;}
    fish.style.opacity=fishOn?1:0;
    ctx.clearRect(0,0,W,H);
    if(t>=tApex){const v=(t-tApex)/DR*1.5;const a=Math.min(1,v*8)*Math.min(1,Math.max(0,(1.5-v)/.35));if(a>0)drawDragon(ctx,P,v,now,Wmax,a,waterY);}
    if(t<tApex+DR+.1)raf=requestAnimationFrame(frame);}
  fish.style.opacity=0;raf=requestAnimationFrame(frame);
  setTimeout(()=>box.classList.add('out'),(tApex+DR)*1000);
  setTimeout(()=>{cancelAnimationFrame(raf);box.remove();},(tApex+DR+1.8)*1000);
}

async function doResetPassword(){

  }catch(e){if(m)m.innerHTML='❌ '+(e.message||e);}

async function doAuthLogin(){
  const email=fv('au_email'),pw=fv('au_pw');const m=document.getElementById('au_msg');
  if(!email||!pw){if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"请输入邮箱和密码":"Enter email & password");return;}
  if(m)m.textContent=LANG==="zh"?"登录中…":"Signing in…";
  try{const {data,error}=await _sb.auth.signInWithPassword({email,password:pw});
    if(error){if(m)m.innerHTML='❌ '+error.message;return;}
    await afterAuth(data.user);
  }catch(e){if(m)m.innerHTML='❌ '+(e.message||e);}
}
async function doAuthSignup(){
  const email=fv('au_email');
  const pw=fv('au_pw');
  const code=(document.getElementById('au_code')?.value||'').trim(); // 获取邀请码
  const m=document.getElementById('au_msg');

  if(!email||!pw){
    if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"请输入邮箱和密码（至少6位）":"Enter email & password (≥6)");
    return;
  }
  // 首次注册必须填邀请码；唯独 NO_CODE_EMAIL 这个管理员救援账号不用填(方便系统出问题时还能进得去)
  // 没填邀请码也允许注册：管理员已在「设置 → 白名单」把这个邮箱加进名单的人（执行董事/人事经理等）不用邀请码；
  // 不在名单的人注册后登录时会被挡住（见 afterAuth）。

  // 有填邀请码就检查：必须是列表内的有效邀请码
  if(code){
    const lk=await inviteLookup(code);
    if(lk.error){
      if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"暂时无法验证邀请码，请稍后再试或联系管理员。":"Cannot verify the invite code right now — try again or contact your admin.");
      return;
    }
    if(!lk.inv){
      if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"邀请码不正确，请向管理员确认。":"Invalid invite code — check with your admin.");
      return;
    }
  }

  if(m)m.textContent=LANG==="zh"?"注册中…":"Signing up…";
  try{
    const {data,error}=await _sb.auth.signUp({
      email,password:pw,
      options:{
        emailRedirectTo:(location.origin+location.pathname),
        data:{invite_code:code.toLowerCase()} // 将邀请码打包传给注册后处理逻辑（afterAuth）
      }
    });
    if(error){if(m)m.innerHTML='❌ '+error.message;return;}
    if(data.session&&data.user){await afterAuth(data.user);}
    else{if(m)m.innerHTML='✅ '+(LANG==="zh"?"注册成功。若开启了邮箱确认，请查收邮件确认后再登录。":"Signed up. Confirm email if required, then sign in.");}
  }catch(e){if(m)m.innerHTML='❌ '+(e.message||e);}
}
async function afterAuth(user){
  if(_pwRecoveryActive)return; // 正在走"设置新密码"流程，不能被登录检查抢回主系统画面
  // 已通过 Supabase 验证 → 白名单检查
  const r=await loadUsers();
  if(!r.ok){
    showAuthLogin(LANG==="zh"?"白名单表 erp_users 尚未建立。请先在 Supabase SQL Editor 运行建表脚本（supabase-schema.sql），再登录。":"Whitelist table erp_users not found — run supabase-schema.sql first.");
    try{await _sb.auth.signOut();}catch(e){}return;
  }
  let wu=findUser(user.email);
  // 本人未在册：先试邀请码分配职位；没有邀请码/邀请码失败，才试「首位注册者自动成为执行董事」
  // （白名单是不是真的空的，交给数据库那边的 RLS 规则去判断，这里本地看到的 USERS 列表
  // 因为权限隔离，看不到别人的资料，不能用来判断"是不是空的"）
  if(!wu){
    const inviteCode=(user.user_metadata&&user.user_metadata.invite_code||'').toLowerCase();
    const inv=inviteCode?(await inviteLookup(inviteCode)).inv:null;
    if(inv){
      try{const {error}=await _sb.from('erp_users').upsert({email:(user.email||'').toLowerCase(),name:(user.email||'').split('@')[0],role:inv.role,outlet:inv.outlet,active:true},{onConflict:'email'});
        if(error)throw error;await loadUsers();wu=findUser(user.email);
      }catch(e){/* 邀请码本身没问题，但写入失败(可能是权限/网络) → 往下走，交给最后的白名单检查统一报错 */}
    }
    if(!wu){
      try{const {error}=await _sb.from('erp_users').upsert({email:(user.email||'').toLowerCase(),name:(user.email||'').split('@')[0],role:'owner',outlet:'b1',active:true},{onConflict:'email'});
        if(error)throw error;await loadUsers();wu=findUser(user.email);
      }catch(e){/* 白名单其实不是空的(数据库会拒绝) → 忽略，走到下面统一报错 */}
    }
  }
  if(!wu||wu.active===false){
    showAuthLogin((LANG==="zh"?`账号 ${user.email} 不在白名单或已停用，请联系管理员。`:`${user.email} is not whitelisted or is disabled. Contact your admin.`));
    try{await _sb.auth.signOut();}catch(e){}return;
  }
  curUser={email:(wu.email||user.email),name:wu.name||user.email,role:ROLES[wu.role]?wu.role:'staff',outlet:wu.outlet||'b1'};
  curRole=curUser.role;
  curOutlet=ROLES[curRole].ckOnly?'ck':(ROLES[curRole].allBranch?(curOutlet||'b1'):(curUser.outlet||'b1')); // 中央厨房专属锁定 ck；非全分店角色锁定本店
  await loadDB();await loadRolePerms();
  document.querySelector('.top').style.display='';
  const sb=document.getElementById('sidebar');if(sb)sb.style.display='';
  curPage=firstAllowedPage();render();
  try{startOrderPoll();notifyNewOrders(true);enablePushSub();startXferPoll();updateXferBell();}catch(e){}
  setTimeout(expiryAlertCheck,2500);
  markActivity(); // 登录当下重新起算闲置时间，避免登入前累积的闲置时间被算进去
}
async function authLogout(idleReason){if(typeof dismissIdleWarn==='function')dismissIdleWarn();try{if(AUTH())await _sb.auth.signOut();}catch(e){}curUser=null;clearSession();showAuthLogin(idleReason?`<b>${LANG==="zh"?"⏱️ 长时间未操作，已自动登出，请重新登录。":"Logged out due to inactivity. Please sign in again."}</b>`:undefined);}
/* ================= 闲置自动登出(仅限 店长/厨师长/员工/中央经理/中央员工) =================
   执行董事/运营经理/人事经理/店面经理常常需要长时间开着看大盘、不方便被强制踢出，
   所以不受影响；店长/厨师长/员工/中央经理/中央员工 这五个比较基层、共用设备
   机会较高的角色，闲置满29分钟会先跳出「闲置超时提醒」卡片、倒数60秒，
   这60秒内只要有任何操作(按继续、或单纯滑动/打字)提示就会取消、正常
   继续用；倒数真的归零都没反应，才在满30分钟那一刻强制登出，要求
   重新输入密码。正在填表单(弹窗开着)时一律当作有在用，不计闲置、
   也不会跳提醒，避免资料还没保存就被强制登出弄丢。 */
const IDLE_LIMIT_MS=30*60*1000;
const IDLE_WARN_MS=60*1000; // 最后60秒先提醒
const IDLE_ROLES=['manager','headchef','staff','ckmgr','ckstaff'];
let _lastActivity=Date.now();
let _idleWarnShown=false,_idleWarnEl=null,_idleWarnTick=null;
function dismissIdleWarn(){
  _idleWarnShown=false;
  if(_idleWarnTick){clearInterval(_idleWarnTick);_idleWarnTick=null;}
  if(_idleWarnEl){_idleWarnEl.remove();_idleWarnEl=null;}
}
function markActivity(){_lastActivity=Date.now();if(_idleWarnShown)dismissIdleWarn();}
function showIdleWarn(){
  if(_idleWarnShown)return;_idleWarnShown=true;
  const zh=LANG==="zh";let remain=60;
  const el=document.createElement('div');
  el.style.cssText='position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99998;background:#12203A;color:#fff;padding:14px 18px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:320px;width:calc(100% - 32px);text-align:center;';
  el.innerHTML=`<div style="font-weight:800;margin-bottom:6px;">⏰ ${zh?"闲置超时提醒":"Idle Timeout Warning"}</div>
    <div class="mini" style="margin-bottom:10px;color:#C7D0DE;">${zh?"即将自动登出，剩余":"Auto logout in"} <b id="idleWarnSec">60</b> ${zh?"秒":"s"}</div>
    <button class="btn block brand" id="idleWarnBtn">✅ ${zh?"继续使用":"Keep me logged in"}</button>`;
  document.body.appendChild(el);_idleWarnEl=el;
  document.getElementById('idleWarnBtn').onclick=()=>markActivity();
  _idleWarnTick=setInterval(()=>{
    remain--;
    const s=document.getElementById('idleWarnSec');if(s)s.textContent=remain;
    if(remain<=0){clearInterval(_idleWarnTick);_idleWarnTick=null;authLogout(true);}
  },1000);
}
function startIdleWatch(){
  ['click','keydown','touchstart','mousemove','scroll','wheel'].forEach(ev=>document.addEventListener(ev,markActivity,{passive:true}));
  setInterval(()=>{
    if(!curUser||!AUTH())return; // 未登录/demo模式不管
    if(!IDLE_ROLES.includes(curRole))return; // 只对这五个角色生效
    const mbg=document.getElementById('mbg');
    if(mbg&&mbg.classList.contains('show')){markActivity();return;} // 表单开着算作有在用，不计闲置
    const elapsed=Date.now()-_lastActivity;
    if(elapsed>=IDLE_LIMIT_MS-IDLE_WARN_MS&&elapsed<IDLE_LIMIT_MS)showIdleWarn();
  },5*1000);
}

/* ---------- init ---------- */
let _deferredPrompt=null;
function installApp(){
  if(_deferredPrompt){_deferredPrompt.prompt();try{_deferredPrompt.userChoice.finally(()=>{_deferredPrompt=null;});}catch(e){_deferredPrompt=null;}return;}
  const iOS=/iP(hone|ad|od)/.test(navigator.userAgent);
  alert(LANG==="zh"
    ?(iOS?"📲 安装到 iPhone/iPad：\n点浏览器下方『分享』按钮 → 选『加入主画面 / Add to Home Screen』，就能像 App 一样从主画面打开。":"📲 安装到安卓：\n点浏览器右上菜单(⋮) → 『安装应用 / 添加到主屏幕』。装好后从主画面打开即可像 App 使用。")
    :(iOS?"iOS: Share → Add to Home Screen":"Android: Menu (⋮) → Install app / Add to Home Screen"));
}
(async()=>{
  if('serviceWorker'in navigator){
    navigator.serviceWorker.register('sw.js').then(r=>{
      _swReg=r;
      // 有新版本的 sw.js 装好待命时(装好=网络已经拿到新版本)，立刻查一次版本号跳强制更新窗，
      // 不用等5分钟那个定时检查，网络够快的话几乎是开App当下就会侦测到。
      r.addEventListener('updatefound',()=>{
        const nw=r.installing;if(!nw)return;
        nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)checkForUpdate();});
      });
    }).catch(()=>{});
  }
  try{navigator.serviceWorker.addEventListener('message',ev=>{if(ev.data&&ev.data.type==='version')checkForUpdate();});}catch(e){} // 收到「新版本」推送：马上检查，不等 5 分钟
  setTimeout(()=>{try{startUpdateCheck();}catch(e){}},0); // 不等登录/载入数据：那一步万一卡住，也照样能发现新版本（等整个脚本载入完再启动，否则会碰到还没定义的变量）
  try{window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_deferredPrompt=e;});}catch(e){}
  try{window.addEventListener('click',function(){if(typeof primeAudio==='function')primeAudio();},{once:true});}catch(e){}
  initCloud();
  // 点了"忘记密码"邮件连结回来时，网址会带 type=recovery；这时不能走正常登录流程直接放人进系统，
  // 要先逼他设好新密码——用网址判断比等 onAuthStateChange 的事件更快，避免被 getSession() 抢先跳进系统。
  const _pwRecovery=/type=recovery/.test(location.hash)||/type=recovery/.test(location.search);
  if(AUTH()&&_pwRecovery){
    showResetPassword();
  }else if(AUTH()){
    try{const {data}=await _sb.auth.getSession();
      if(data&&data.session&&data.session.user){await afterAuth(data.session.user);}
      else{showAuthLogin();}
    }catch(e){showAuthLogin();}
  }else{
    await loadDB();await loadRolePerms();showLogin();
  }
  startIdleWatch();
})();
/* ================= 自动检查新版本（不用删除重装 App）=================
   PWA 装到手机主屏幕后，网页本身没有做任何离线缓存(sw.js 没拦截 fetch)，
   所以内容更新其实早就是"打开就是最新的"，不用重装——唯独图标变更是
   手机系统自己缓存的，那个没办法用网页技术解决，只有那种情况才需要重装。
   这里加一个小提示条：每隔几分钟、或从背景切回前台时，去服务器抓一次最新
   HTML 的 BUILD 版本号，发现比手上这份新，就跳一个"有新版本"的小条，
   点一下才刷新(不会没提示就自己重刷，打字打到一半不会被打断)。 */
let _updChecking=false,_updShown=false,_updPending=false,_updPendingVer='';
let _updCheckStart=0;
async function checkForUpdate(manual){
  // 上一次检查如果卡住超过 30 秒（手机网络差、App 被系统暂停等），当作失败，别让它永远挡住后面的检查
  if(_updChecking&&Date.now()-_updCheckStart>30000)_updChecking=false;
  if(_updChecking||_updShown){if(manual)alert(LANG==="zh"?"已经在检查/已经有更新待处理。":"Already checking / update pending.");return;}
  _updChecking=true;_updCheckStart=Date.now();
  let _ac=null,_acT=null;try{_ac=new AbortController();_acT=setTimeout(()=>{try{_ac.abort();}catch(e){}},15000);}catch(e){}
  try{
    const res=await fetch(location.pathname+'?_ts='+Date.now(),{cache:'no-store',signal:_ac?_ac.signal:undefined});
    if(res.ok){
      const txt=await res.text();
      const m=txt.match(/const BUILD\s*=\s*"([^"]+)"/);
      if(m&&m[1]&&m[1]!==BUILD){showUpdateBanner(m[1]);}
      else if(manual){alert(LANG==="zh"?`当前版本 v${BUILD}，已是最新版。`:`v${BUILD} — already up to date.`);}
    }
  }catch(e){if(manual)alert(LANG==="zh"?"检查更新失败，请稍后再试。":"Check failed, try again later.");}
  if(_acT)clearTimeout(_acT);
  _updChecking=false;
}
/* 版本更新提示音：模仿 iPhone 内建「Tri-tone」提示音的三声上扬琶音风格
   (G5→C6→E6，一声接一声往上扬)，用 WebAudio 原创合成、不是抓 Apple 的音频档
   (那是苹果的版权音效，没办法直接内嵌)——但节奏/音符数刻意做成"三音上扬"，
   一听就有"Tri-tone"那种熟悉的辨识度，也跟新订单的两声"Note"风格铃声区分开。 */
function playUpdateChime(){
  try{primeAudio();if(!_audioCtx)return;const ctx=_audioCtx,now=ctx.currentTime;
    [[783.99,0],[1046.50,0.14],[1318.51,0.28]].forEach(([f,delay])=>{
      const t=now+delay;
      const master=ctx.createGain();master.connect(ctx.destination);
      master.gain.setValueAtTime(0.0001,t);
      master.gain.exponentialRampToValueAtTime(0.85,t+0.01);
      master.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      [[f,1],[f*2,0.3]].forEach(([freq,v])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=v;o.connect(g);g.connect(master);o.start(t);o.stop(t+0.55);});
    });
    try{if(navigator.vibrate)navigator.vibrate([150,80,150,80,150]);}catch(e){}
  }catch(e){}
}
function updBellRefresh(){const bc=document.getElementById('updBellCount');if(bc)bc.style.display=_updPending?'':'none';try{updateMoreBadge();}catch(e){}}
/* 铃铛点开：有更新待处理就重新弹出强制更新窗(避免不小心被切走/看不到)；
   没有的话就只是显示目前版本号，给所有账号都能查。 */
function openUpdatePanel(){
  if(_updPending){_updShown=false;showUpdateBanner(_updPendingVer);return;}
  alert(LANG==="zh"?`🛎️ 版本更新通知\n\n当前版本：v${BUILD}\n已是最新版，一旦有更新会自动跳出提醒+响铃。`:`Current version: v${BUILD} — up to date.`);
}
/* 强制更新：屏幕正中间弹一个盖住全屏的提示，只有一个"确认更新"按钮，
   没有关闭/点旁边取消的办法，逼着一定要更新到最新版才能继续用系统
   (避免有人一直用旧版本操作，数据结构/功能跟别人对不上)。
   所有账号(不分职位)都会收到这个提醒+专属提示音；运营经理以下账号
   本来就看不到订单铃铛(bellBtn)，只会看到这个版本更新铃铛。 */
/* 正在填表单/正在打字的时候，绝对不能突然跳出强制更新窗把画面锁住——
   还没按『保存』的资料只存在画面上，还没写进系统，一被切页/刷新就没了。
   所以：侦测到新版本先只响铃+跳红点(不打断)，真正的强制更新窗要等
   "表单弹窗关掉、且当下没有任何输入框在打字" 才会跳出来；关表单/
   打字告一段落后，这里会自动每1.5秒检查一次，一safe就立刻跳出来。 */
function isBusyEditing(){
  const mbg=document.getElementById('mbg');
  if(mbg&&mbg.classList.contains('show'))return true; // 新增/编辑表单开着
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&!(ae.closest&&ae.closest('.top')))return true; // 正在某个输入框里打字/选择(如採购网格逐格输入)；顶栏的分店/岗位选单选完会一直保持焦点，不算在填表
  return false;
}
let _updWaitT=null;
function tryShowForcedUpdate(){
  if(_updShown||!_updPending)return;
  if(isBusyEditing()){
    if(!_updWaitT)_updWaitT=setInterval(()=>{if(!isBusyEditing()){clearInterval(_updWaitT);_updWaitT=null;tryShowForcedUpdate();}},1500);
    return;
  }
  _updShown=true;
  const zh=LANG==="zh";const newBuild=_updPendingVer;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(15,25,45,.72);display:flex;align-items:center;justify-content:center;padding:20px;';
  ov.innerHTML=`<div style="background:#fff;border-radius:16px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);">
    <div style="font-size:36px;margin-bottom:10px;">🔄</div>
    <div style="font-weight:800;font-size:17px;color:var(--ink);margin-bottom:8px;">${zh?"有新版本可用":"New Version Available"}</div>
    <div class="mini" style="margin-bottom:18px;line-height:1.6;">${zh?`系统已更新到 <b>${newBuild}</b>，请更新后才能继续使用，避免跟其他人使用的版本不一致。`:`The app was updated to <b>${newBuild}</b>. Please update to continue.`}</div>
    <button class="btn block brand" id="forceUpdBtn">✅ ${zh?"确认更新":"Update Now"}</button>
  </div>`;
  document.body.appendChild(ov);
  const _shownAt=Date.now();
  // 弹出后 0.9 秒内的点击不算（避免你正好在点别的东西时，手指落在「确认更新」上被误触发）
  document.getElementById('forceUpdBtn').onclick=(ev)=>{if(Date.now()-_shownAt<900)return;location.replace(location.pathname+'?_ts='+Date.now());};   // 用 replace：不在浏览记录里多垫一页（以前每次更新多一页，iPhone 左边缘滑动就会露出「上一个版本」）
}
function showUpdateBanner(newBuild){
  const already=_updPending;
  _updPending=true;_updPendingVer=newBuild;updBellRefresh();
  if(!already)playUpdateChime(); // 只响一次铃，不会因为每次检查都重复响
  tryShowForcedUpdate();
}
function startUpdateCheck(){
  checkForUpdate();
  setInterval(()=>{checkForUpdate();if(_swReg)_swReg.update().catch(()=>{});},5*60*1000); // 每5分钟查一次，顺便叫 sw.js 也主动check
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkForUpdate();if(_swReg)_swReg.update().catch(()=>{});}}); // 从背景切回前台也查一次
}
</script>
