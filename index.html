<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  button,.btn,.ib,.lang,.menu-btn,select,.side button,a,[onclick]{touch-action:manipulation;}
  .gwrap,.card.tbl,.m{-webkit-overflow-scrolling:touch;}

  }
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:13.5px;line-height:1.45;padding-bottom:70px;}

  .brand-logo svg{display:block;border-radius:8px;}

  .top h1{font-size:15px;font-weight:700;}
  /* ===== 采购网格 Excel 风格 ===== */
  .gwrap{max-height:72vh;overflow:auto;border:1px solid #333;border-radius:6px;}
  .gtbl{border-collapse:separate;border-spacing:0;font-size:12px;background:#fff;}

  .gtbl td.gname,.gtbl th.gname{position:sticky;left:74px;z-index:2;text-align:left;font-weight:700;padding:7px 8px;min-width:180px;max-width:180px;box-shadow:1px 0 0 #333;}
  .gtbl td.gunit,.gtbl th.gunit{position:sticky;left:254px;z-index:2;min-width:56px;max-width:56px;}
  .gtbl td.gpack,.gtbl th.gpack{position:sticky;left:310px;z-index:2;min-width:120px;max-width:120px;}
  .gtbl td.gprice,.gtbl th.gprice{position:sticky;left:430px;z-index:2;min-width:76px;max-width:76px;box-shadow:1px 0 0 #333;}
  .gtbl thead th.gcode{z-index:4;background:#E8EDF3;}
  .gtbl thead th.gname,.gtbl thead th.gunit,.gtbl thead th.gpack,.gtbl thead th.gprice{z-index:4;background:#E8EDF3;}
  /* 识别列/表头行：Code·品名·单位·规格·单价 用统一浅蓝底，一眼区分录入区 */
  .gtbl td.gcode,.gtbl td.gunit,.gtbl td.gpack,.gtbl td.gprice{background:#F3F6FB;}
  .gtbl td.gname{background:#EDF2F9;}
  /* ≤10 布局上方四行(Code/单价RM/单位/规格) */
  .gtbl tr.ghdr td{background:#EDF2F9;}
  .gtbl tr.ghdr input{font-weight:600;color:#12203A;text-align:center;}
  .gtbl tr.ghdr td.ghlab{background:#DCE5F1;font-weight:800;color:#12203A;text-align:center;padding:7px 6px;}
  .gtbl tr.ghdr-end td{border-bottom:2px solid #333;}
  /* 中央厨房 · 订货表 Order List */
  .obanner{font-weight:800;color:#fff;background:#c0202a;padding:8px 14px;border-radius:8px;font-size:15px;}
  .owrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;margin-top:10px;}
  @media(max-width:920px){.owrap{grid-template-columns:1fr;}}
  .ocol{min-width:0;}
  .otbl{width:100%;border-collapse:collapse;font-size:12px;background:#fff;table-layout:fixed;}
  .otbl th,.otbl td{border:1px solid #333;padding:3px 5px;vertical-align:middle;overflow:hidden;}
  .otbl thead th{background:#E8EDF3;color:#12203A;text-align:center;font-weight:800;}
  .otbl th.oimg,.otbl td.oimg{text-align:center;padding:8px 6px;line-height:0;}
  .otbl td.oimg img{object-fit:contain;display:block;margin:6px auto;image-rendering:auto;}   /* 每张照片各占一行 */
  .ouniimg{text-align:center;padding:10px;}
  .ouniimg img{max-width:250px;width:100%;height:auto;border-radius:6px;}
  /* DESCRIPTION：中英文整段直接显示、自动换行、不需拉动 */
  .otbl td.odesc{white-space:normal;word-break:break-word;vertical-align:middle;}
  .otbl .odesc-view{line-height:1.4;padding:3px 2px;color:var(--ink);}
  .otbl .odesc-edit{line-height:1.4;padding:4px;min-height:34px;white-space:pre-wrap;word-break:break-word;border:1px dashed transparent;border-radius:4px;}
  .otbl .odesc-edit:hover{border-color:#cbd5e1;}
  .otbl .odesc-edit:focus{outline:none;border:1px solid var(--gold);background:#FFFBEB;}
  /* 大小档位：小 / 中 / 大（图片+文字整体缩放，电脑/手机都能调清楚）*/
  .orderroot .otbl td.oqty input{width:100%;border:0;text-align:center;font-family:inherit;font-weight:700;background:transparent;padding:6px 2px;box-sizing:border-box;}
  .orderroot.size-s .otbl td.oimg{width:78px;} .orderroot.size-s .otbl td.oimg img{width:70px;height:70px;}
  .orderroot.size-s .otbl .odesc-view,.orderroot.size-s .otbl .odesc-edit{font-size:11px;} .orderroot.size-s .otbl td.oqty input{font-size:12px;} .orderroot.size-s .otbl th.oqty,.orderroot.size-s .otbl td.oqty{width:44px;}
  .orderroot.size-m .otbl td.oimg{width:112px;} .orderroot.size-m .otbl td.oimg img{width:104px;height:104px;}
  .orderroot.size-m .otbl .odesc-view,.orderroot.size-m .otbl .odesc-edit{font-size:13px;} .orderroot.size-m .otbl td.oqty input{font-size:14px;} .orderroot.size-m .otbl th.oqty,.orderroot.size-m .otbl td.oqty{width:54px;}
  .orderroot.size-l .otbl td.oimg{width:156px;} .orderroot.size-l .otbl td.oimg img{width:148px;height:148px;}
  .orderroot.size-l .otbl .odesc-view,.orderroot.size-l .otbl .odesc-edit{font-size:15px;} .orderroot.size-l .otbl td.oqty input{font-size:16px;} .orderroot.size-l .otbl th.oqty,.orderroot.size-l .otbl td.oqty{width:62px;}
  .orderroot.size-l .owrap{grid-template-columns:repeat(2,1fr);}   /* 大号：电脑改两栏，图片更大更清楚 */
  @media(max-width:920px){.orderroot.size-l .owrap,.orderroot.size-m .owrap{grid-template-columns:1fr;}}
  .otbl td.oqty input{width:100%;border:0;text-align:center;font-family:inherit;font-size:13px;font-weight:700;background:transparent;padding:6px 2px;box-sizing:border-box;}
  .otbl th.odel,.otbl td.odel{width:30px;text-align:center;padding:2px;}
  .otbl input:focus,.otbl textarea:focus{outline:2px solid var(--gold);outline-offset:-2px;background:#FFFBEB;}
  .otbl tr.odiv td{color:#fff;text-align:center;font-weight:800;letter-spacing:1px;padding:5px;}
  .otbl .odivdel{border-color:rgba(255,255,255,.6);color:#fff;padding:0 5px;margin-left:6px;}
  .opre{font-size:10px;font-weight:700;color:#b45309;background:#fef3c7;border-radius:4px;padding:1px 5px;margin-left:4px;}
  .oadd{margin-top:6px;}
  @media print{.top,.sidebar,#sidebar,.seg,.hint,.obanner ~ div,.oadd,.odel,.odivdel{display:none !important;}.owrap{grid-template-columns:repeat(3,1fr);}}
  /* 中央厨房 · 生产成本格子 */
  .pctbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff;min-width:640px;}
  .pctbl th,.pctbl td{border:1px solid #333;padding:6px 8px;white-space:nowrap;}
  .pctbl thead th{position:sticky;top:0;background:#E8EDF3;color:#12203A;font-weight:800;text-align:center;z-index:2;}
  .pctbl td.pcid{background:#F3F6FB;text-align:center;}
  .pctbl td.pcname{background:#EDF2F9;text-align:left;font-weight:700;min-width:190px;white-space:normal;}
  .pctbl td.pcnum{padding:0;}
  .pctbl td.pcnum input{width:100%;border:0;text-align:center;font:inherit;font-weight:700;background:transparent;padding:8px 4px;box-sizing:border-box;}
  .pctbl td.pcnum input:focus{outline:2px solid var(--gold);outline-offset:-2px;background:#FFFBEB;}
  .pctbl td.pcresult{font-weight:800;text-align:right;background:#FAFBFC;color:#0f766e;}
  .pctbl td.pcedit{padding:0;}
  .pctbl td.pcedit input{width:100%;border:0;text-align:center;font:inherit;background:transparent;padding:6px 6px;box-sizing:border-box;}
  .pctbl td.pcname.pcedit input{text-align:left;font-weight:700;}
  .pctbl td.pcedit input:focus{outline:2px solid var(--gold);outline-offset:-2px;background:#FFFBEB;}
  .pctbl td.pcdel{text-align:center;width:36px;background:#fff;}
  /* 订单详情编辑表 */
  .odtbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .odtbl th,.odtbl td{border:1px solid var(--line);padding:5px 7px;}
  .odtbl thead th{background:#EDF2F9;color:#12203A;font-weight:800;}
  .odtbl td.c,.odtbl th.c{text-align:center;}
  .odtbl td.odnum,.odtbl input.odnum{}
  .odtbl input.odnum{width:100%;border:1px solid var(--line);border-radius:5px;text-align:center;font:inherit;padding:5px 4px;box-sizing:border-box;}
  .odtbl input.odnum:focus{outline:2px solid var(--gold);outline-offset:-2px;background:#FFFBEB;}
  .odtbl tfoot td{background:#F2F4F7;}
  /* Invoice 单据 */
  #invoiceDoc{background:#fff;color:#111;padding:18px;font-size:13px;border:1px solid #e2e8f0;border-radius:8px;}
  #invoiceDoc .inv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px;}
  #invoiceDoc .inv-co{font-size:18px;font-weight:800;}
  #invoiceDoc .inv-sub{font-size:12px;color:#555;letter-spacing:1px;}
  #invoiceDoc .inv-meta{text-align:right;font-size:12px;white-space:nowrap;}
  #invoiceDoc .inv-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;margin-bottom:10px;}
  #invoiceDoc .inv-tbl{width:100%;border-collapse:collapse;font-size:12px;}
  #invoiceDoc .inv-tbl th,#invoiceDoc .inv-tbl td{border:1px solid #333;padding:6px 8px;vertical-align:top;}
  #invoiceDoc .inv-tbl th{background:#eef2f7;}
  #invoiceDoc .inv-tbl td.c,#invoiceDoc .inv-tbl th.c{text-align:center;}
  #invoiceDoc .inv-foot{margin-top:12px;font-size:12px;}
  #invoiceDoc .inv-sign{display:flex;justify-content:space-between;gap:20px;margin-top:40px;text-align:center;}
  @media print{
    body.inv-print>*{display:none !important;}
    body.inv-print #mbg{display:block !important;position:static !important;background:#fff !important;padding:0 !important;}
    body.inv-print #mbg .m{position:static !important;transform:none !important;box-shadow:none !important;max-width:100% !important;width:100% !important;max-height:none !important;margin:0 !important;border:0 !important;padding:0 !important;overflow:visible !important;}
    body.inv-print #mbg .m>div{max-height:none !important;overflow:visible !important;}
    body.inv-print .noprint{display:none !important;}
    body.inv-print #invoiceDoc{border:0 !important;}
  }
  .gtbl td.gtot{background:#FAFBFC;font-weight:700;text-align:right;padding:6px 8px;}
  .gtbl tr.gsum td{background:#F2F4F7;font-weight:800;padding:6px 8px;}
  .gtbl td.gdate,.gtbl th.gdate{position:sticky;left:0;z-index:2;min-width:64px;max-width:64px;text-align:center;box-shadow:1px 0 0 #333;background:#fff;}

  .top .r{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  .sel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:6px 8px;font-size:12px;font-weight:600;}
  .sel option{color:#000;}
  .role-chip{font-size:10.5px;padding:3px 8px;border-radius:20px;background:var(--brand2);font-weight:700;}
  .lang{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 9px;font-size:11px;font-weight:700;cursor:pointer;min-width:32px;min-height:32px;}
  /* layout */
  .wrap{max-width:1060px;margin:0 auto;padding:14px;}
  .page{display:none;} .page.active{display:block;animation:f .2s;}
  @keyframes f{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
  @keyframes su{from{transform:translateY(100%);}to{transform:none;}}

  .h:first-child{margin-top:2px;}

  .sub{font-size:11.5px;color:var(--grey);font-weight:400;margin-left:4px;}

  .grid{display:grid;gap:10px;}
  .g2{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(3,1fr);}.g4{grid-template-columns:repeat(2,1fr);}

  .kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;}
  .kpi .k{font-size:11px;color:var(--grey);font-weight:600;margin-bottom:5px;}
  .kpi .v{font-size:19px;font-weight:800;letter-spacing:-.01em;}
  .kpi .v.sm{font-size:15px;}
  .kpi .s{font-size:10.5px;margin-top:3px;font-weight:600;}
  .pos{color:var(--green);}.neg{color:var(--red);}.warnc{color:var(--amber);}

  .pl{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 15px;}
  .pl .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--soft);font-size:13px;}

  .pl .row.ind span:first-child{padding-left:12px;color:var(--ink2);}
  .pl .r-neg{color:var(--red);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  .tbl{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}

  tr:last-child td{border-bottom:none;}
  .mini{font-size:10.5px;color:var(--grey);font-weight:400;}

  --grid-line:#8A939C;--grid-line2:#5A646E;--grid-head:#C2C9D0;--grid-c1:#E2E6EA;--grid-c2:#D8DDE2;--grid-lab:#BFC6CD;
  --radius:0px;--radius-sm:0px;--pill:0px;
  --font-body:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"PingFang SC","Noto Sans SC","Microsoft YaHei",monospace;
  --font-head:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"PingFang SC","Noto Sans SC",monospace;--font-num:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
/* ---- 中式风：宣纸米 + 朱红 + 金 + 墨黑，回纹/窗格/印章 ---- */
html.ui2[data-theme="cn"]{
  --ink:#2A1A14;--ink2:#5A4034;--paper:#F6EEDC;--card:#FFFBF0;--line:#E2CFA4;--line2:#CDB47E;
  --brand:#B3241B;--brand2:#C8432F;--brand-dk:#85160F;--gold:#C79A2B;--red:#B3241B;--amber:#A8731A;--green:#3F6B4A;
  --blue:#3D6A8F;--purple:#6F5A8A;--grey:#8A7258;--soft:#F1E5C8;--hover:#EBDBB5;--row-hover:#FFF6E0;--row-line:#EEDFB9;--hint-bg:#F5E7C2;
  --btn:#2A1A14;--btn-hover:#4A3126;--focus:rgba(179,36,27,.18);--shadow-bub:rgba(179,36,27,.42);
  --top-bg:#8F1C14;--top-solid:#8F1C14;--top-ink:#FBEFD0;--top-line:#8F1C14;--top-btn-bg:rgba(255,235,190,.12);--top-btn-line:rgba(255,226,160,.4);--top-btn-hover:#A82A1F;
  --sel-bg:rgba(255,235,190,.14);--sel-ink:#FBEFD0;--sel-line:rgba(255,226,160,.45);
  --side-bg:#F1E4C4;--side-ink:#5A4034;--side-hover:#E8D6AA;--side-active-bg:#FFFBF0;--side-active-ink:#2A1A14;--side-bar:#B3241B;--side-icon-on:#B3241B;--side-grp:#9A7B3E;
  --th-ink:#8A6A2C;--th-line:#CDB47E;--tab-bg:rgba(246,238,220,.98);
  --grid-line:#DCC795;--grid-line2:#CDB47E;--grid-head:#F1E5C8;--grid-c1:#FBF2DB;--grid-c2:#F5E8C8;--grid-lab:#EBDBB5;
  --radius:4px;--radius-sm:3px;--pill:3px;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --font-head:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;--font-num:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
}
html.ui2 body{font-family:var(--font-body);font-size:14px;-webkit-font-smoothing:antialiased;}
html.ui2 .ic{display:inline-flex;align-items:center;vertical-align:-.2em;}
html.ui2 .dotc{display:inline-block;width:.62em;height:.62em;border-radius:50%;vertical-align:.04em;margin-right:.2em;}
html.ui2 .ic svg{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
/* 顶栏 */
html.ui2 .top{background:var(--top-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--top-ink);border-bottom:1px solid var(--top-line);padding:9px 20px;}
html.ui2 .top h1{font-family:var(--font-head);font-weight:600;font-size:17px;letter-spacing:.03em;}
html.ui2 #topBranchTag{display:none;}
html.ui2 .brand-logo svg{width:32px;height:32px;box-shadow:0 1px 3px rgba(0,0,0,.25);}
html.ui2 .menu-btn{border:1px solid var(--top-btn-line);color:var(--top-ink);background:var(--top-btn-bg);font-size:0;border-radius:var(--radius-sm);}
html.ui2 .menu-btn .ic{font-size:18px;}
html.ui2 .lang{border:1px solid transparent;background:transparent;color:var(--top-ink);border-radius:var(--radius-sm);min-width:34px;min-height:34px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-size:12px;}
html.ui2 .lang:hover{background:var(--top-btn-hover);}
html.ui2 .lang .ic{font-size:18px;}
html.ui2 .sel{background:var(--sel-bg);color:var(--sel-ink);border:1px solid var(--sel-line);border-radius:var(--radius-sm);font-weight:600;padding:6px 8px;}
html.ui2 .sel option{color:#000;background:#fff;}
html.ui2 #xferBellCount,html.ui2 #bellCount{background:var(--brand)!important;}
html.ui2 #updBellCount{background:var(--gold)!important;}
html.ui2 #updBellBtn img{display:none;}
/* 侧栏 */
html.ui2 .side{background:var(--side-bg);color:var(--side-ink);border-right:1px solid var(--line);width:236px;box-shadow:none;}
html.ui2 .side.open{box-shadow:6px 0 24px rgba(0,0,0,.22);}
html.ui2 .side .grp{color:var(--side-grp);letter-spacing:.08em;font-size:11px;font-weight:600;padding:16px 18px 5px;}
html.ui2 .side button{color:var(--side-ink);font-weight:500;border-left:3px solid transparent;}
html.ui2 .side button:hover{background:var(--side-hover);color:var(--side-active-ink);}
html.ui2 .side button.active{background:var(--side-active-bg);color:var(--side-active-ink);font-weight:600;border-left-color:var(--side-bar);}
html.ui2 .side button.active .si{color:var(--side-icon-on);}

html.ui2 .main{max-width:1120px;padding:22px 28px 40px;}
/* 标题 */
html.ui2 .h{font-family:var(--font-head);font-weight:600;font-size:17px;letter-spacing:0;color:var(--ink);margin:22px 0 10px;}
html.ui2 .page.active>.fb:first-child .h,html.ui2 .page.active>.h:first-child{font-size:26px;font-weight:500;letter-spacing:-.01em;}
html.ui2 .h .tag{font-family:inherit;font-weight:500;background:var(--soft);}
html.ui2 .sub{color:var(--grey);}
/* 卡片/数字 */
html.ui2 .card,html.ui2 .kpi,html.ui2 .pl,html.ui2 .chart-wrap{border-radius:var(--radius);border-color:var(--line);background:var(--card);}
html.ui2 .kpi{padding:14px 16px;}
html.ui2 .kpi .k{font-size:12px;font-weight:500;}
html.ui2 .kpi .v{font-family:var(--font-num);font-size:25px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums;}
html.ui2 .kpi .v.sm{font-size:19px;}
html.ui2 .pl .row.tot{border-top:1px solid var(--line2);}
/* 表格 */
html.ui2 th{background:transparent;color:var(--th-ink);font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;border-bottom:1px solid var(--th-line);padding:10px 12px;}
html.ui2 td{padding:11px 12px;border-bottom:1px solid var(--row-line);}
html.ui2 .card.tbl tbody tr{transition:background .12s;}
html.ui2 .card.tbl tbody tr:hover td{background:var(--row-hover);}
/* 状态标签 */
html.ui2 .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 9px;white-space:nowrap;border-radius:var(--pill);}
html.ui2 .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
html.ui2 .p-g{background:#E6F0E9;color:var(--green);}html.ui2 .p-a{background:#F7ECD3;color:var(--amber);}
html.ui2 .p-r{background:#FBE7E3;color:var(--red);}html.ui2 .p-n{background:#EEEAE0;color:var(--grey);}
html.ui2 .p-b{background:#E5EDF4;color:var(--blue);}html.ui2 .p-p{background:#EEE9F3;color:var(--purple);}
/* 按钮/输入 */
html.ui2 .btn{background:var(--btn);border-radius:var(--radius-sm);font-weight:600;padding:8px 14px;transition:transform .08s,background .14s;}
html.ui2 .btn:hover{background:var(--btn-hover);}
html.ui2 .btn.brand{background:var(--brand);}html.ui2 .btn.brand:hover{background:var(--brand-dk);}
html.ui2 .btn.gold{background:var(--btn);}
html.ui2 .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2);}html.ui2 .btn.ghost:hover{background:var(--hover);}
html.ui2 .ib{border-radius:var(--radius-sm);border-color:var(--line);background:var(--card);color:var(--ink2);}
html.ui2 .ib .ic{font-size:15px;}
html.ui2 .fr label{font-weight:600;color:var(--ink2);}
html.ui2 .fr input,html.ui2 .fr select,html.ui2 .fr textarea{border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--card);color:var(--ink);}
html.ui2 .fr input:focus,html.ui2 .fr select:focus,html.ui2 .fr textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--focus);}
html.ui2 .seg{background:var(--soft);border-radius:var(--radius-sm);}html.ui2 .seg button{font-weight:600;border-radius:var(--radius-sm);}
html.ui2 .hint{background:var(--hint-bg);color:var(--ink2);border-radius:var(--radius-sm);}
html.ui2 .al-b{background:var(--hint-bg);border-color:var(--line);color:var(--ink2);}
html.ui2 .al-a{background:#F7ECD3;border-color:#EBDBB0;color:#6B4A0C;}
html.ui2 .al-r{background:#FBE7E3;border-color:#F0C6BF;color:#7A2418;}
/* 弹窗 */
html.ui2 .mbg{background:rgba(20,16,14,.5);}
html.ui2 .m{border-radius:calc(var(--radius) + 6px) calc(var(--radius) + 6px) 0 0;background:var(--card);color:var(--ink);}
html.ui2 .m h3{font-family:var(--font-head);font-weight:600;font-size:18px;}
@media(min-width:640px){html.ui2 .m{border-radius:calc(var(--radius) + 4px);}}
/* 采购进销入口卡片：去掉彩色粗线 */
html.ui2 button.card[style*="border-left"]{border-left:1px solid var(--line)!important;transition:border-color .16s,transform .16s var(--ease);}
html.ui2 button.card[style*="border-left"]:hover{border-color:var(--line2);transform:translateY(-1px);}
html.ui2 button.card[style*="border-left"]>div:first-child{color:var(--ink2);}
html.ui2 .obanner{background:var(--brand);}
/* Excel 风格表格：保留功能，只换颜色 */
html.ui2 .gwrap{border:1px solid var(--grid-line2);}
html.ui2 .gtbl th,html.ui2 .gtbl td{border-right-color:var(--grid-line);border-bottom-color:var(--grid-line);}
html.ui2 .gtbl thead th{background:var(--grid-head);color:var(--ink);border-bottom:2px solid var(--grid-line2);}
html.ui2 .gtbl td.gcode,html.ui2 .gtbl td.gunit,html.ui2 .gtbl td.gpack,html.ui2 .gtbl td.gprice{background:var(--grid-c1);}
html.ui2 .gtbl td.gname{background:var(--grid-c2);box-shadow:1px 0 0 var(--grid-line2);}
html.ui2 .gtbl td.gprice,html.ui2 .gtbl th.gprice,html.ui2 .gtbl td.gdate,html.ui2 .gtbl th.gdate{box-shadow:1px 0 0 var(--grid-line2);}
html.ui2 .gtbl thead th.gcode,html.ui2 .gtbl thead th.gname,html.ui2 .gtbl thead th.gunit,html.ui2 .gtbl thead th.gpack,html.ui2 .gtbl thead th.gprice,html.ui2 .gtbl thead th.gdate{background:var(--grid-head);}
html.ui2 .gtbl tr.ghdr td{background:var(--grid-c2);}html.ui2 .gtbl tr.ghdr td.ghlab{background:var(--grid-lab);}
html.ui2 .gtbl tr.ghdr-end td{border-bottom:2px solid var(--grid-line2);}
html.ui2 .otbl th,html.ui2 .otbl td,html.ui2 .pctbl th,html.ui2 .pctbl td{border-color:var(--grid-line);}
html.ui2 .otbl thead th,html.ui2 .pctbl thead th,html.ui2 .odtbl thead th{background:var(--grid-head);color:var(--ink);}
html.ui2 .pctbl td.pcid{background:var(--grid-c1);}html.ui2 .pctbl td.pcname{background:var(--grid-c2);}
/* 手机底部导航：选中哪一个，哪一个就是深红（主题色）圆圈 */
#tabbar{display:none;}
html.ui2 #tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--grey);padding:4px 0;position:relative;min-height:46px;font-family:inherit;cursor:pointer;touch-action:manipulation;}
html.ui2 #tabbar .ico{width:44px;height:30px;display:grid;place-items:center;border-radius:50%;transition:transform .22s var(--ease),background .18s,color .18s,box-shadow .22s;}
html.ui2 #tabbar .ico .ic{font-size:21px;}
html.ui2 #tabbar button.on{color:var(--brand);font-weight:600;}
html.ui2 #tabbar button.on .ico{width:44px;height:44px;background:var(--brand);color:#fff;margin-top:-20px;margin-bottom:2px;box-shadow:0 6px 14px var(--shadow-bub),0 0 0 4px var(--paper);animation:tabpop .26s var(--ease);}

#moreBtn,#topMore{display:none;}

  html.ui2 #topMore .lang{display:flex;width:100%;justify-content:flex-start;gap:10px;padding:10px 12px;min-height:42px;position:relative;color:var(--ink2);}

  html.ui2 .main{padding:14px 14px 20px;}
  html.ui2 body{padding-bottom:calc(86px + env(safe-area-inset-bottom));}

/* ---- 进货/供应商列表（mk75） ---- */

/* ===================== 流畅度（三个主题共用） ===================== */
html.ui2 *{-webkit-tap-highlight-color:transparent;}
html.ui2 button,html.ui2 .btn,html.ui2 .side button,html.ui2 select{touch-action:manipulation;}
@keyframes pgin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
html.ui2 .page.active.enter{animation:pgin .24s var(--ease) both;}
@keyframes skel{0%{background-position:120% 0;}100%{background-position:-120% 0;}}

/* ===================== 机械风 · 装饰（钢板 + 螺丝 + 硬阴影 + 仪表） ===================== */
html.ui2[data-theme="mech"] body{background-color:#B9C0C7;background-image:
  linear-gradient(rgba(20,24,28,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(20,24,28,.07) 1px,transparent 1px),

function trBuild(){

  tpl.sort((a,b)=>b[0].replace(/\{\}/g,'').length-a[0].replace(/\{\}/g,'').length);

function trText(s){
  if(UILANG!=='vi'&&UILANG!=='my')return s;
  if(!s||!ZHRE.test(s))return s;
  const k=s.trim();
  if(TR.map[k]!==undefined)return s.replace(k,TR.map[k]);
  if(k.slice(0,2)==='• ')return s.replace(k,'• '+trText(k.slice(2))); // 说明里的圆点句

  if(ZHRE.test(out)&&!/[，。；：「」！？•]/.test(k)){

    if(db.payrollCfg!=null&&pay.payrollCfg==null)pay.payrollCfg=db.payrollCfg;

/* ===== 分店隔离（BUILD 1102mk69）=====
   数据库（store-lock.sql）按角色限制能碰哪些 key：本店角色只能读写自己那间的 erpv2:<店>，中央角色只能碰 erpv2:ck，
   运营经理 = 全部分店（不含中央厨房），执行董事/人事经理 = 全部。网页这边照同样的规则只载入自己能碰的分店，
   读不到的绝不会被当成「空数据」去重新初始化。
   两处原本会跨店改别人整包的地方改成：
   ① 订货表(orderList)从中央厨房整包拆到共用 key erpv2:ckorder（所有人可读写）；
   ② 跨店调拨改成「申请 → 对方批准」：申请存成独立记录 erpv2:req:<发起店>:<被申请店>:<编号>（见下方「跨店调拨申请」）。 */
const cloudFetch=payFetch, cloudWriteNow=payWriteNow;
function canWriteOutlet(oid){
  if(!curUser)return true; // 演示模式（没登录）不限制
  const r=curUser.role;
  if(r==='owner'||r==='hrmgr')return true;
  if(r==='area')return oid!=='ck';
  if(r==='ckmgr'||r==='ckstaff')return oid==='ck';
  return oid===curUser.outlet;
}
function myOutlets(){return OUTLETS.filter(o=>canWriteOutlet(o.id));}
let CKO={}, CKO_FAILED=false;   // 订货表：{orderList}
async function loadCkOrder(){   // 回传 true = 中央厨房整包要重新存一次（旧订货表已搬走）
  CKO_FAILED=false;
  const f=await cloudFetch('erpv2:ckorder');
  if(!f.ok){CKO_FAILED=true;CKO={};return false;}   // 读取失败：只显示、不允许写，免得覆盖真正的订货表
  if(f.val&&f.val.orderList){
    CKO={orderList:f.val.orderList};
    if(DB.ck&&DB.ck.orderList&&canWriteOutlet('ck')){delete DB.ck.orderList;return true;} // 旧版又写回中央厨房整包：再清掉
    return false;
  }
  let leg=DB.ck&&DB.ck.orderList;                    // 还没迁移：先借用中央厨房整包里的旧订货表
  if(!leg){try{const r=await Store.get('erpv2:ck');if(r){const o=JSON.parse(r.value);leg=o&&o.orderList;}}catch(e){}}
  CKO=leg?{orderList:leg}:{};
  if(leg&&DB.ck&&canWriteOutlet('ck')){              // 迁移：确认云端写成功才从中央厨房整包剥离
    if(await cloudWriteNow('erpv2:ckorder',{v:1,orderList:leg,at:new Date().toISOString()})){delete DB.ck.orderList;return true;}
  }
  return false;
}
async function saveCkOrder(){
  if(CKO_FAILED)return;
  try{await Store.set('erpv2:ckorder',JSON.stringify({v:1,orderList:CKO.orderList,at:new Date().toISOString()}));}catch(e){}
}
/* ===== 跨店调拨申请（BUILD 1102mk70）=====
   「跨店调拨」页原本只是在自己店里记一笔流水账，对方店完全不知情。现在改成：
   发起店送出申请 → 被申请店收到通知 → 被申请店「批准」后，双方店的调拨记录里才会出现、库存同时增减；
   没处理 = 待批准(Pending)；拒绝 = 被拒绝（附原因）。物品：调出方扣库存、调入方加库存；人力借调只记录，不移动员工档案。
   每张申请是 erp_store 里的一条记录：erpv2:req:<发起店>:<被申请店>:<编号>。双方都能读，数据库触发器
   erp_req_guard 保证：新申请只能是 pending、只有被申请店（或执行董事/人事经理/运营经理）能批准/拒绝、批准后不能再改。 */
const XFER_APPROVE_ROLES=['owner','hrmgr','area','outletmgr','manager','headchef','ckmgr'];
const XFER_ROLES=XFER_APPROVE_ROLES.concat(['ckstaff']);

function xferKey(r){return 'erpv2:req:'+r.reqBy+':'+r.counter+':'+r.id;}

async function cloudDeleteNow(key){

async function loadXreqs(){ // 读我有权限看到的所有调拨申请；失败回 false（保持原样，不当成「没有」）
  let rows=[];
  if(CLOUD&&_sb){
    try{const {data,error}=await _sb.from(CLOUD_TABLE).select('key,value').like('key','erpv2:req:%');if(error)return false;rows=(data||[]).map(r=>r.value);}catch(e){return false;}
  }else{
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('erpv2:req:')===0){try{rows.push(JSON.parse(localStorage.getItem(k)));}catch(_){}}}}catch(e){}
  }

function applyApprovedFor(oid){ // 把「已批准」的申请记进这间店（扣/加库存 + 调拨记录）；回传 true = 整包要重新存
  const db=DB[oid];if(!db||!canWriteOutlet(oid))return false;
  const done=new Set(db.xferApplied||[]);let ch=false;
  XREQ.filter(r=>r.status==='approved'&&(r.from===oid||r.to===oid)&&!done.has(r.id)).forEach(r=>{
    withOutlet(oid,()=>{
      const out=(r.from===oid);const peer=out?(r.toName||oidName(r.to)):(r.fromName||oidName(r.from));
      if(r.kind==='item'){
        if(out)invReduce(r.item,r.qty);else invReceive(r.item,r.qty,null,r.unit);
        (db.transfers=db.transfers||[]).unshift({date:r.date,item:r.item,code:r.code||'',qty:+r.qty||0,unit:r.unit||'',to:peer,mode:r.mode||'transfer',amt:+r.amt||0,note:r.note||'',dir:out?'out':'in',reqId:r.id});
        auditLog("跨店调拨(已批准)",r.item+" "+num(r.qty)+(r.unit||'')+(out?" →":" ←")+peer,"",modeTxt(r.mode||'transfer'));
      }else{
        (db.staffLoans=db.staffLoans||[]).unshift({date:r.date,staff:r.staff,role:r.role||'',to:peer,mode:r.mode||'loan',note:r.note||'',dir:out?'out':'in',reqId:r.id});
        auditLog("人力借调(已批准)",r.staff+(out?" →":" ←")+peer,"",modeTxt(r.mode||'loan'));
      }
    });
    done.add(r.id);ch=true;
  });
  if(ch)db.xferApplied=[...done].slice(-1000);
  return ch;
}
async function xferSync(first){ // 重新读申请 → 记进我有权写的店 → 更新铃铛/提示
  if(_xferSyncing)return;_xferSyncing=true;

    const dirty=[];for(const o of myOutlets()){if(DB[o.id]&&applyApprovedFor(o.id))dirty.push(o.id);}
    for(const id of dirty){await save(id);}
    xferCheck(!!first);
    const sig=XREQ.map(r=>r.id+':'+r.status).join(',');const changed=sig!==_xreqSig;_xreqSig=sig;

    }
  }finally{_xferSyncing=false;}
}

const ALL_ID="ALL"; // 全部分店总和（不含中央厨房）

function buildAggregate(){
  // 把所有分店合并成一个只读的汇总视图
  const ids=branchIds();
  const agg={items:[],recipes:[],subRecipes:[],moves:[],vendors:[],payables:[],stocktakes:[],staff:[],sales:[],
    purchases:[],grn:[],transfers:[],staffLoans:[],wasteLog:[],offers:[],monthEnd:[],
    opex:{rent:0,commission:0,salaries:0,epf:0,socso:0,eis:0,levy:0,ot:0,electricity:0,water:0,gas:0,marketing:0,maintenance:0,wifi:0,rubbish:0,possaas:0,accounting:0,repair:0},
    fin:{posGross:0},audit:[]};
  // 合并库存：同名品项数量与库存值相加，成本用加权
  const itemMap={};const salesMap={};
  ids.forEach(id=>{
    const b=DB[id];if(!b)return;
    agg.fin.posGross+=b.fin.posGross;
    (b.sales||[]).forEach(s=>{salesMap[s.recipeId]=(salesMap[s.recipeId]||0)+s.qty;}); // 汇总各店销量
    Object.keys(agg.opex).forEach(k=>agg.opex[k]+=(b.opex[k]||0));
    b.moves.forEach(m=>agg.moves.push({...m}));
    b.staff&&b.staff.forEach(s=>agg.staff.push({...s,_branch:id}));
    b.payables.forEach(p=>agg.payables.push({...p}));
    ['purchases','grn','transfers','staffLoans','wasteLog','offers','monthEnd'].forEach(k=>{(b[k]||[]).forEach(r=>agg[k].push({...r,_branch:id}));});
    b.items.forEach(it=>{
      if(!itemMap[it.name]){itemMap[it.name]={...it,qty:0,batches:[]};itemMap[it.name]._costQtySum=0;itemMap[it.name]._costSum=0;}
      const a=itemMap[it.name];a.qty+=it.qty;a._costSum+=it.qty*it.cost;a._costQtySum+=it.qty;
      (it.batches||[]).forEach(bt=>a.batches.push({...bt}));
    });
    // 配方以第一间店为准（各店配方相同）
    if(agg.recipes.length===0)b.recipes.forEach(r=>agg.recipes.push({...r}));
    if(agg.subRecipes.length===0)b.subRecipes.forEach(s=>agg.subRecipes.push({...s}));
  });
  Object.values(itemMap).forEach(a=>{a.cost=a._costQtySum?+(a._costSum/a._costQtySum).toFixed(2):a.cost;agg.items.push(a);});
  agg.sales=Object.entries(salesMap).map(([rid,qty])=>({recipeId:+rid,qty}));
  agg.moves.sort((x,y)=>new Date(y.date)-new Date(x.date));
  return agg;
}

/* ---------- cost helpers ---------- */
function findItem(name){return d().items.find(i=>i.name===name);}
function findSub(name){return d().subRecipes.find(s=>s.name===name);}
function netCost(it){return it.cost/((it.yield||100)/100);} // 得率后净料成本
function subCost(sub){ // 半成品单位成本
  const total=sub.ing.reduce((s,ig)=>{const it=findItem(ig.n);return s+(it?netCost(it)*ig.q:0);},0);
  return sub.yieldQty?total/sub.yieldQty:0;
}
function recipeCost(r){ // 支持多级 BOM
  return r.ing.reduce((s,ig)=>{
    if(ig.sub){const sub=findSub(ig.n);return s+(sub?subCost(sub)*ig.q:0);}
    const it=findItem(ig.n);return s+(it?netCost(it)*ig.q:0);
  },0);
}

/* ================= 库存联动引擎 =================
   进货 → 加库存(加权平均成本+批次)；报废/调出/销售(BOM) → 扣库存。
   全部经由这里改动 items.qty，采购/报废/调拨/销售任何增删改都会实时反映。 */
function invItem(name){return (d().items||[]).find(i=>i.name===name);}
function invReceive(name,qty,amount,unit,exp,date){ // 进货入库
  qty=+qty||0;if(!qty)return;
  let it=invItem(name);
  if(!it){it={id:Math.max(0,...(d().items||[]).map(i=>i.id),0)+1,name,unit:unit||'pcs',buyUnit:'',conv:1,qty:0,cost:0,cat:'其他',par:0,yield:100,batches:[]};(d().items=d().items||[]).push(it);}
  const nq=it.qty+qty;
  if(amount!=null&&qty>0){
    const amt=+amount||0;
    if(it.qty>0)it.cost=+(((it.qty*it.cost)+amt)/(nq||1)).toFixed(4);         // 正常：加权平均
    else if(amt>0)it.cost=+(amt/qty).toFixed(4);                                // 库存是 0 或负数：原来的成本不能参与平均（否则算出负数/怪数字），用这一笔自己的单价
  }
  it.qty=+nq.toFixed(3);
  if(exp){it.batches=it.batches||[];it.batches.push({qty,exp,in:date||TODAY});}
}
function invReduce(name,qty){ // 出库/扣减（FIFO 扣批次）
  qty=+qty||0;if(!qty)return;
  const it=invItem(name);if(!it)return;
  it.qty=+(it.qty-qty).toFixed(3);
  let rem=qty;(it.batches||[]).sort((a,b)=>new Date(a.exp)-new Date(b.exp));
  for(const b of (it.batches||[])){if(rem<=0)break;const dd=Math.min(b.qty,rem);b.qty-=dd;rem-=dd;}
  it.batches=(it.batches||[]).filter(b=>b.qty>0.0001);
}
// 反做一笔进货（编辑/删除时用）：扣回数量（成本不追溯还原）
/* 反做一笔进货（编辑/删除时用）：扣回数量，并把这一笔当初拉进加权平均的金额也扣回来（填错价再改掉，成本跟着还原）。
   amount＝这一笔当初入库的金额；excl＝这一笔的记录本身（库存扣光时，找「其余进货」里最近的单价来当成本，要排除它）。 */
function purRcv(r){   // 一笔进货当初「真的入过库」的数量和金额（鱼类供应商按重量入库，其余按数量；数量或金额没填齐的那一格从没入过库）
  const fish=FISH_SUPPLIERS.includes(r&&r.supplier);const drive=fish?(+r.weight||0):(+r.qty||0);const amt=+(r&&r.price)||0;
  return (drive>0&&amt>0)?{drive,amt}:null;
}
function unreceivePur(r){const x=purRcv(r);if(x){invUnreceive(r.item,x.drive,x.amt,r);if(FISH_SUPPLIERS.includes(r.supplier))fishPcsAdj(r.item,-(+r.qty||0));}}   // 删除/清除/编辑一笔进货：只有真的入过库的才扣回
function invUnreceive(name,qty,amount,excl){
  qty=+qty||0;if(!qty)return;
  const it=invItem(name);
  if(it&&amount!=null&&(+amount)>0){
    const rem=it.qty-qty;
    const others=(d().purchases||[]).filter(r=>r!==excl&&r.item===name&&(+r.unitPrice||0)>0&&(+r.qty||0)+(+r.weight||0)>0).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
    const lastPrice=others.length?+(+others[0].unitPrice).toFixed(4):null;
    if(rem>0.0001){
      const c=(it.qty*it.cost-(+amount))/rem;
      if(isFinite(c)&&c>0)it.cost=+c.toFixed(4);
      else if(lastPrice!=null)it.cost=lastPrice;      // 扣出来是 0 或负数（填错之后又用掉了一部分库存）：成本不能当成 0，退回其余进货里最近的单价；一笔都没有就保持现在的成本
    }else{ // 这一笔扣掉后库存没了：成本退回「其余进货里最近一次的单价」（一笔都没有就设成 0＝未设成本，比留着填错的价好）
      it.cost=lastPrice!=null?lastPrice:0;
    }
  }
  invReduce(name,qty);
}
// 一份销量对应的「食材消耗表」（展开多级 BOM）
function salesConsumption(salesArr){
  const map={};const b=d();
  (salesArr||[]).forEach(s=>{const rp=(b.recipes||[]).find(x=>x.id===s.recipeId);if(!rp)return;const q=+s.qty||0;
    rp.ing.forEach(ig=>{
      if(ig.sub){const sub=(b.subRecipes||[]).find(x=>x.name===ig.n);if(sub&&sub.yieldQty){const per=ig.q/sub.yieldQty;sub.ing.forEach(si=>{map[si.n]=(map[si.n]||0)+si.q*per*q;});}}
      else{map[ig.n]=(map[ig.n]||0)+ig.q*q;}
    });
  });
  return map;
}
// 应用销量变化对库存的差量（新-旧）：POS/手动录销量共用
function applySalesDelta(oldArr,newArr){
  const o=salesConsumption(oldArr),n=salesConsumption(newArr);
  new Set([...Object.keys(o),...Object.keys(n)]).forEach(nm=>{const delta=(n[nm]||0)-(o[nm]||0);if(delta>0)invReduce(nm,delta);else if(delta<0)invReceive(nm,-delta,null);});
}
/* ★ POS 接口预留 ★ 未来 POS 推送销量时，调用本函数即可自动扣库存并联动净利：
   window.applyPOSSales([{recipeId, qty}, ...])  →  覆盖当日销量并按差量扣食材。 */
async function applyPOSSales(newSales){
  const old=JSON.parse(JSON.stringify(d().sales||[]));
  d().sales=(newSales||[]).map(s=>({recipeId:+s.recipeId,qty:+s.qty||0}));
  applySalesDelta(old,d().sales);
  auditLog("POS销售过账",(newSales||[]).length+(LANG==="zh"?" 项":" items"),"","");
  await save();if(typeof render==='function')render();
}

/* ============ 手势：从左边缘往右滑 / 手机「返回」＝ 打开菜单（mk105）============
   以前：iPhone 从左边往右滑＝浏览器「上一页」，会跳出系统；Android 返回键/手势一样。
   现在：① 页面开着 history 保护（pushState），返回手势/返回键只触发 popstate，我们改成开菜单（弹窗开着就先关弹窗，菜单开着就关菜单），不会离开 App；
        ② 已加到主屏幕的 PWA（没有浏览器返回）用左边缘右滑手势直接开菜单。两条路用时间戳避免重复触发。 */
let _edgeAt=0,_tsx=0,_tsy=0,_tsok=false;

(function(){
  const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  // Android / 一般浏览器：垫一格历史，返回键/手势改成开菜单。iPhone 不垫——垫了之后 iOS 系统的「返回」手势会出现白屏滑动动画（业主 11-24 录屏）。
  if(!isIOS){
    try{history.replaceState({erp:1},'',location.href);history.pushState({erp:2},'',location.href);}catch(e){}
    window.addEventListener('popstate',function(){
      try{history.pushState({erp:2},'',location.href);}catch(e){}
      if(Date.now()-_edgeAt<1500)return;
      openMenuByGesture();
    });
  }
  // 左边缘往右拉：菜单跟着手指走（手指放开超过三分之一就打开，否则收回去）——不再依赖系统返回
  let drag=null;
  const narrow=()=>window.matchMedia('(max-width:760px)').matches;
  document.addEventListener('touchstart',function(e){
    drag=null;const t=e.touches[0];
    if(e.touches.length!==1||t.clientX>28||!narrow())return;
    const sb=navGestureTarget(),mbg=document.getElementById('mbg');
    if(!sb||sb.classList.contains('open')||(mbg&&mbg.classList.contains('show')))return;
    drag={x0:t.clientX,y0:t.clientY,active:false,w:sb.offsetWidth||236,sb,bd:document.getElementById('backdrop')};
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!drag)return;const t=e.touches[0],dx=t.clientX-drag.x0,dy=Math.abs(t.clientY-drag.y0);
    if(!drag.active){
      if(dy>30&&dy>dx){drag=null;return;}   // 明显是上下滑：放弃
      if(dx>8&&dx>dy*1.2){drag.active=true;drag.sb.style.transition='none';drag.bd&&(drag.bd.style.transition='none',drag.bd.classList.add('show'),drag.bd.style.opacity='0');}
      else return;
    }
    if(e.cancelable)e.preventDefault();
    const x=Math.max(0,Math.min(drag.w,dx));
    drag.sb.style.transform='translateX('+(x-drag.w)+'px)';
    if(drag.bd)drag.bd.style.opacity=String(Math.min(1,x/drag.w));
  },{passive:false});
  function endDrag(e){
    if(!drag)return;const d0=drag;drag=null;if(!d0.active)return;
    const t=(e.changedTouches&&e.changedTouches[0])||{clientX:d0.x0},dx=t.clientX-d0.x0;

/* ===== 销售驱动的营收与成本（★ 联动核心 ★）=====
   营业额 = Σ(菜价 × 销量)；COGS = Σ(配方成本 × 销量)。
   改进货成本→加权单价变→recipeCost变→COGS变→净利变。全链联动。
   未来接 POS：只需让 salesData() 回传 POS 推送的销量。 */
function salesData(){return d().sales||[];}
function outletRevenue(id){const b=DB[id];if(!b)return 0;
  const ms=(b.monthlySales||{})[costMonth]||[];   // 每个月只看「那个月」POS 导入的销量（含税），没导入就是 0，不借别的月或旧资料
  return ms.reduce((q,s)=>{const dc=(b.dishCosts||[]).find(x=>x.id===s.dishId);return q+(dc?(+dc.price||0)*(+s.qty||0):0);},0);}
function revenueSrc(){return monthSales(costMonth).length?'pos':'none';}
function calcRevenue(){ // 含税营业额：当月 POS 导入的销量 × 菜价（和月度核算同一个数）；当月没导入＝0
  return monthSales(costMonth).length?monthlyPnL(costMonth).rev:0;
}
/* ===== 成本核算方式（明记：主力单点/煮炒做BOM + 杂饭小菜月度核算）=====
   rate   ①成本率法：COGS = 净营业额 × 成本率%（当天/平时快速估算）
   period ②进销存实耗法：COGS = 月初库存 + 本月进货 − 月末库存（月底结真账，最准）
   bom    ③配方法：COGS = Σ(配方成本 × 销量)（招牌菜单品毛利）*/
function costCfg(){
  const c=(d().costConfig)||{};
  return {mode:'period', rate:(c.rate!=null?c.rate:35), openStock:+c.openStock||0, closeStock:+c.closeStock||0, purOverride:(c.purOverride===''||c.purOverride==null)?null:+c.purOverride};
}

function canEditTarget(){const R=['owner','hrmgr','area'];return R.includes(curRole)&&(!curUser||R.includes(curUser.role))&&!isAgg();}
function foodStatus(pct,t){if(!(pct>0))return 'none';return pct<=t?'ok':pct<=t+2?'warn':'bad';}

function monthPurchases(){ // 本月进货金额（自动：采购进货 type=in，按当前核算月）
  const m=costMonth||TODAY.slice(0,7);
  let sum=0;
  (d().moves||[]).forEach(r=>{if(r.type==='in'&&String(r.date||'').slice(0,7)===m)sum+=(+r.amt||0);});
  (d().purchases||[]).forEach(r=>{if(String(r.date||'').slice(0,7)===m)sum+=(+r.price||0);});
  return sum;
}
function calcCOGS(){ // 依成本核算方式返回（整期金额，calcFin 再按日/周/月缩放）
  const cfg=costCfg();
  if(cfg.mode==='rate'){ return (calcRevenue()/1.06)*(cfg.rate/100); }
  if(cfg.mode==='period'){ const pur=cfg.purOverride!=null?cfg.purOverride:monthPurchases(); return Math.max(0, cfg.openStock + pur - cfg.closeStock); }
  const s=salesData(); // bom
  return s.reduce((sum,row)=>{const r=(d().recipes||[]).find(x=>x.id===row.recipeId);return sum+(r?recipeCost(r)*row.qty:0);},0);
}

/* ============ 成本差异（mk100）：理论成本 vs 实际成本（参照 SUPY Theoretical / Actual / Variance）============
   理论成本 ＝ 这个月每道菜卖了几份 × 配方成本（「应该用掉」的食材钱，来自月度核算的 monthlyPnL）
   实际成本 ＝ 月初库存 ＋ 本月进货 － 月末库存（「真的用掉」的食材钱；库存取自「月末盘点」）
   差异 ＝ 实际 － 理论；正数 ＝ 实际用得比理论多（浪费/多给/漏记/被偷/涨价），负数 ＝ 比理论省。
   资料不齐时只说缺什么，绝不编数字。 */
let varMonth=null;
function prevMonthOf(m){const a=m.split('-').map(Number),dt=new Date(a[0],a[1]-2,1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function monthEndRecs(m){ // 该月每家供应商「最后一次」月末盘点的记录
  const recs=(d().monthEnd||[]).filter(r=>(r.date||'').slice(0,7)===m);if(!recs.length)return null;
  const last={};recs.forEach(r=>{if(!last[r.supplier]||r.date>last[r.supplier])last[r.supplier]=r.date;});
  return recs.filter(r=>r.date===last[r.supplier]);
}
function monthEndValue(m){const r=monthEndRecs(m);return r?r.reduce((q,x)=>q+(+x.price||0),0):null;}
function purchasesOf(m){let sum=0;(d().moves||[]).forEach(r=>{if(r.type==='in'&&String(r.date||'').slice(0,7)===m)sum+=(+r.amt||0);});(d().purchases||[]).forEach(r=>{if(String(r.date||'').slice(0,7)===m)sum+=(+r.price||0);});return sum;}
function varianceFor(m){
  const sales=monthSales(m),pnl=monthlyPnL(m),cfg=costCfg();
  let close=monthEndValue(m),open=monthEndValue(prevMonthOf(m)),srcO='盘点',srcC='盘点';
  if(m===costMonth){if(close==null&&cfg.closeStock>0){close=cfg.closeStock;srcC='手填';}if(open==null&&cfg.openStock>0){open=cfg.openStock;srcO='手填';}}
  const pur=(m===costMonth&&cfg.purOverride!=null)?cfg.purOverride:purchasesOf(m);
  const theo=sales.length?pnl.cogs:null;
  const actual=(open!=null&&close!=null)?Math.max(0,open+pur-close):null;
  const net=pnl.rev/1.06;
  const waste=(d().wasteLog||[]).filter(r=>(r.date||'').slice(0,7)===m).reduce((q,r)=>q+(+r.cost||0)*(+r.qty||0),0);
  const offer=(d().offers||[]).filter(r=>(r.date||'').slice(0,7)===m).reduce((q,r)=>q+(+r.total||0),0);
  const diff=(theo!=null&&actual!=null)?actual-theo:null;
  return {m,sales:sales.length,theo,actual,open,close,srcO,srcC,pur,net,waste,offer,diff,diffPct:(diff!=null&&theo>0)?diff/theo*100:null};
}
function itemVarianceRows(m){
  const dishes=d().dishCosts||[],th={};
  monthSales(m).forEach(s=>{const dc=dishes.find(x=>x.id===s.dishId);if(!dc)return;(dc.ing||[]).forEach(ig=>{if(ig.link)th[ig.link]=(th[ig.link]||0)+(+s.qty||0)*(+ig.qty||0);});});
  const cnt=mm=>{const r=monthEndRecs(mm);if(!r)return null;const o={};r.forEach(x=>{o[x.item]=(o[x.item]||0)+(+x.qty||0);});return o;};
  const co=cnt(prevMonthOf(m)),cc=cnt(m);
  const buy={};(d().purchases||[]).forEach(r=>{if(String(r.date||'').slice(0,7)===m){const q=FISH_SUPPLIERS.includes(r.supplier)?(+r.weight||0):(+r.qty||0);buy[r.item]=(buy[r.item]||0)+q;}});
  return Object.keys(th).map(item=>{const theoQ=th[item];const ok=co&&cc&&(item in co||item in cc);const actQ=ok?((co[item]||0)+(buy[item]||0)-(cc[item]||0)):null;const pr=monthAvgPrice(m,item)||0;
    return {item,theoQ,actQ,diffQ:actQ==null?null:actQ-theoQ,pr,diffV:actQ==null?null:(actQ-theoQ)*pr};}).sort((a,b)=>Math.abs(b.diffV||0)-Math.abs(a.diffV||0)||b.theoQ-a.theoQ);
}

/* ============ 运营健康总览（mk101，参照 SUPY Ops Tower / Action Queue）============
   一页看完这间店「哪些事该做还没做」：进货有没有天天录、价格涨跌待核对、月末盘点、销量导入、成本差异、库存、订单、调拨、应付、报废、请假。

/* ============ AI 助手（mk109，参照 SUPY 的 Ask Bruce）============
   点右上角「AI」→ 问问题（例：上个月食材成本为什么变了？哪些东西涨价最多？今天先做什么？）。

   执行董事/运营经理还会带上「各分店对比」。摘要在 aiContext() 里组出来，限制长度。 */
const AI_ROLES=['owner','hrmgr','area','outletmgr','manager','ckmgr'];  // 明记小助手：经理（含店长、中央经理）以上才能用

let _aiMsgs=[],_aiBusy=false;
function aiMonthLine(m){
  const v=varianceFor(m),pnl=monthlyPnL(m);const net=pnl.rev/1.06;const pc=x=>(x!=null&&net>0)?(x/net*100).toFixed(1)+'%':'—';
  const parts=[`${m}：销量 ${num(pnl.orders)} 份`,`营业额(含税) ${money(pnl.rev)}`,`理论成本 ${v.theo==null?'—':money(v.theo)}（${pc(v.theo)}）`];
  parts.push(v.actual==null?'实际成本：算不出（缺'+(v.close==null?'月底盘点 ':'')+(v.open==null?'上月底盘点':'')+'）':`实际成本 ${money(v.actual)}（${pc(v.actual)}）= 月初库存 ${money(v.open)} + 进货 ${money(v.pur)} − 月底库存 ${money(v.close)}`);
  if(v.diff!=null)parts.push(`差异 ${v.diff>0?'+':''}${money(v.diff)}（${v.diffPct==null?'':(v.diffPct>0?'+':'')+v.diffPct.toFixed(1)+'%'}）；其中已记录报废 ${money(v.waste)}、招待赠送 ${money(v.offer)}`);

function aiBrief(oid){   // 一间店的简要体检（用来做「各分店对比」）

      pc:priceChanges().filter(c=>c.st==='new').length,lowNeg:sc.low+sc.neg,od:ss.od.length};

const PAGE_HELP={"stockled": {"t": "库存流水", "s": "每样食材的进、出、盘点记录，一条一条列出来，库存对不上时用来查原因。\n绿色＋＝入库（进货单、中央厨房生产、调拨入）；红色－＝出库（报废、退货、调拨出）。\n灰色的「盘点」只是实盘记录，不会改库存。\n点某一行的品名，只看那一样；上面可以切换本月、上月、近 90 天、全部，也可以只看入库或出库。\n招待赠送不动库存，所以不在这里。\n这里是把各处记录合在一起看，系统没有另外一本总账，所以不显示「每一笔之后剩多少」。"}, "budget": {"t": "预算对比", "s": "每个开销类别设一个「每月预算」，对比实际花了多少。\n运营经理以上在每一项右边填「预算 RM」，每个月都用同一个数；店长只能看。\n实际数字来自「运营开销」（租金、水电、营销、维修、杂费等）。\n绿色＝没超；黄色＝超过 10% 以内；红色＝超过很多。\n执行董事、运营经理在最下面可以看到全部分店的预算和实际合计。\n预算没设的项目只显示实际，不会算超支。"}, "notif": {"t": "通知中心", "s": "把所有「该做的事」集中在一张清单里，不用一页一页去找。\n执行董事、运营经理看得到全部分店的待办；店长看自己店的。\n红色＝要处理（已经拖了），黄色＝要留意（快出问题）。\n点「去处理」会直接跳到那一页（会自动切到那间店）。\n点「今天先不管」会先收起来，只记在你这台手机，明天会自己回来。\n右上角的图标显示还有几项没处理。"}, "rank": {"t": "各分店排行", "s": "11 间分店放在一起比，最后有「全部分店合计」。\n每张卡：食材成本率（实际）、和目标差多少、净营业额、进货、报废。\n默认按「比目标」排：低于目标最多的排第一，超标最多的排最后。\n也可以改按成本率、营业额、报废率排。\n要有「销量」和「月末盘点」才算得出成本率，缺的店会写「资料不齐」，排在最后。\n只有执行董事、人事经理、运营经理看得到。"}, "dash": {"t": "利润大盘", "s": "看这间店这个月赚不赚钱的总览。\n成本率半圆表：食材成本占营业额的比例。黑色小线是这间店的「目标成本率」（每间店各自设，运营经理以上可在表下面点「修改」）；不超过目标算达标，超过 2% 以内变黄，更高变红。\n食材成本＝月初库存＋本月进货－月末库存，也就是真的用掉多少食材。\n下面是近 6 个月营业额对食材成本，还有各分店营业额的比较。\n这些数字来自「月度核算」「进货单」「月末盘点」，那几处没填，这里就会空，或不准。"}, "health": {"t": "运营健康", "s": "一页看这间店有哪些事该做、哪些快出问题。\n上面有两个标签：「通知中心」是待办清单（执行董事、运营经理看得到全部分店），「健康检查」是每一项检查的详细状况。\n通知中心：红色＝要处理，黄色＝要留意；按「去处理」直接跳到那一页（会自动切到那间店）；按「今天先不管」先收起来，明天会回来。\n健康检查：进货、价格变动、盘点、销量导入、成本差异、库存、订货单、调拨、应付、报废、请假、开销预算；选「全部分店」时要先选一间店才看得到。\n右上角的红圈数字，就是通知中心还没处理的数量。"}, "sales": {"t": "销售数据", "s": "记录每道菜卖了多少份，系统用「配方成本」算出营业额、食材成本和毛利。\n点右上「录入销量」，填每道菜的份数。\n每张卡显示：售价×份数、单份成本、成本率（绿＝好，黄＝偏高，红＝太高）。\n可以搜索菜名，或按营业额、销量、毛利排序。\n新 POS 没有接口，月底也可以在「月度核算」用「导入 POS 销售报表」一次导进来。"}, "inv": {"t": "库存", "s": "看每样食材现在还剩多少、值多少钱，按供应商分组。\n上面有两个标签：「库存」和「库存流水」。库存流水是每样食材的进、出、盘点记录，库存对不上时用来查原因。\n进货会自动加库存，卖出、报废、调拨会自动减。\n库存低于「最低库存」会标「低库存」；负数表示记录有问题，要查。\n「操作 ▾」里可以批量设定最低/标准库存。"}, "inv:sup": {"t": "库存 · 供应商品项", "s": "这家供应商的所有品项。\n每张卡显示：现有库存、单位成本、库存值，还有状态标签（低于最低、负库存、高于标准）。\n点品项可以改名称、成本，设最低/标准库存。\n库存数字平时由进货单自动更新，一般不用手改。"}, "proc": {"t": "采购进销", "s": "进销存的作业中心，进货、订货、损耗这些工作的入口都在这里。\n订货单：向供应商或中央厨房下单。订单进度：看订单走到哪一步。\n进货单：每天记收了什么货、多少钱。\n退货补货、报废损耗、招待赠送、跨店调拨、运营开销记录，各自一张卡。\n价格变动：进货价涨跌的提醒。点任何一张卡进去，卡片上的数字是这个月的进度。"}, "purchase": {"t": "进货单", "s": "每天记「收了什么货、什么价钱」，是算成本最重要的原始资料。\n点一家供应商 → 选月份 → 选日期 → 在品项旁填「数量」和「单价」（鱼类填「重量」和单价）。\n按中间的相机可以拍发票，系统读出来，你核对过才写入。\n单价比上次涨跌超过 5% 会标红或绿，提醒你看一下。\n收货当天就录，别等到月底。"}, "purchase:sup": {"t": "进货单 · 供应商", "s": "这家供应商的进货记录。\n上面选月份，再选日期，每个品项填「数量」和「单价」；鱼类供应商填「重量」。\n「Invoice No.」填发票单号，以后对账用。\n右上「拍照识别」可以拍发票自动填；「操作 ▾」有新增品项、复制上一次进货、价格变动。\n运营经理以上可以长按月份，编辑或删除空的月份。"}, "grn": {"t": "退货补货", "s": "记录退货（退回给供应商）和补货（供应商补给你）。\n先选供应商 → 月份 → 新增一笔。\n每笔记：日期、品项、数量、金额、原因。\n可以按「退货 / 补货」筛选，按日期分组查看。"}, "waste2": {"t": "报废损耗", "s": "记录报废损耗：坏掉、过期、做错、掉在地上等被丢掉的东西。\n按月分开，每笔记：日期、物品、成本价、数量、原因、备注，总额＝成本价×数量。\n上面可以按原因筛选，看哪种原因损耗最多。\n记下来，「成本差异」才能解释钱去了哪里。"}, "offer": {"t": "招待赠送", "s": "记录招待和赠送：请客人吃、送客人、不收钱的东西。\n按月分开，每笔记：日期、收据号码、类别（ENT 招待 / Offer 赠送）、品项、当事人、金额。\n记下来，「成本差异」才能解释「为什么用了食材却没有收入」。"}, "transfer": {"t": "跨店调拨", "s": "店和店之间调货，或借人。\n要先「送出申请」，对方店批准后，双方的库存和记录才会真的变动。\n对方还没处理显示「待批准」；被拒绝显示「被拒绝」。\n要批准的话，要先切换到「被申请的那间店」才按得到。\n借调人力只是记录，不会移动员工档案。"}, "ordersheet": {"t": "订货单", "s": "向供应商下订货单。\n选一家供应商，在品项上填「数量」，填完按底部「下单」。\n下单会通知执行董事和运营经理确认。\n下单之后的进度（待确认 → 已确认 → 已发货 → 已收货）在「订单进度」看。\n中央厨房 (TCY OKR) 用的是带图片的订货表。"}, "orderinv": {"t": "订单发票", "s": "订货单被确认后会生成 Invoice，都集中在这里。\n点供应商 → 选月份 → 看 Invoice，可以打开查看或打印。\n只有运营经理以上才能删除 Invoice。\n这些 Invoice 也会带进「应付账款」去对账。"}, "ck": {"t": "中央厨房", "s": "中央厨房的生产成本和订货。\n填「大锅成本」和「分装包数」，系统自动算「单包成本」。\n订货表里填各分店要的数量，按「下单」提交。\n品项有图片，点图片可以放大。"}, "bom": {"t": "配方成本", "s": "设定每道菜的成本（配方成本），看每道菜赚多少。\n可以只填一个成本价，也可以列出用到的食材，让系统自动算。\n成本率颜色：蓝＝偏低，绿＝28–35% 达标，红＝偏高。\n红色的菜优先检查：是不是食材涨价了，或份量放太多。\n配方成本也会用在「成本差异」的理论成本。"}, "stock": {"t": "盘点", "s": "平时抽查盘点（每日或每周）：数实际库存，对照账面库存。\n每个品项填「实盘数量」，系统算出账面和实物差多少（隐性损耗）。\n差异大的会标红，优先找原因。\n页面上面的「盘点排程」可以设定每周或每月要盘点的提醒。\n月底算成本用的是上面切换到「月末盘点」。"}, "monthend": {"t": "月末盘点", "s": "盘点分两种，在页面上面切换：\n「月末盘点」：每月底盘点，把剩余库存填进来，用来算本月真正用掉的食材成本。选供应商 → 选日期（月底）→ 每个品项填剩余数量；单价自动用本月进货单价的中位数。\n「每日 / 每周盘点」：平时抽查，数实际库存对照账面，找出隐性损耗，还可以设每日、每周的盘点提醒。\n实耗成本＝月初库存＋本月进货－月末库存，月末盘点没填，成本就不准。每个月都要做。"}, "opexm": {"t": "运营开销录入", "s": "逐月录入运营开销（租金、水电、营销、维修、杂费等）。\n点一个月份进去，直接填金额，按底部「保存本月」。\n只影响当月，不会串到别的月。\n带 🔗 的项目是从「运营开销记录」自动算的，不用手填。\n填好的数字会带进「运营开销」和「月度核算」算净利。"}, "opexlog": {"t": "运营开销记录", "s": "逐笔记零散开销的流水账（买小东西、维修、Wi-Fi 等）。\n按月分开，每笔记：类别、日期、Invoice No.、金额、备注。\n营销、维修、Wi-Fi 等类别会自动汇总进「运营开销」。\n它和「运营开销录入」不同：这里是一笔一笔的流水账，那边是整个月的表。"}, "ap": {"t": "应付账款&发票", "s": "应付账款：你欠供应商多少钱、付了没有。\n订货单确认后生成的 Invoice 会出现在这里。\n逐项核对：对照实际收到的货和发票，对的按 ✔，不对按 ✗。\n全部对完按「订单正确」；付款后，把「未付款」改成已付款。\n可以按供应商、月份看，对账用。\n上面有两个标签：「对账付款」和「订单发票」（订货单确认后生成的 Invoice）。"}, "opex": {"t": "运营开销", "s": "按月看和填运营开销（租金、水电、营销、维修、杂费等）。\n点一个月份进去，直接填金额。\n填好的数字会自动带进「损益表」和「月度核算」算净利。\n人工成本目前是手动填，系统不会自动从薪资算。\n上面有三个标签：「本月开销」、「逐月录入」（逐月填金额）和「预算对比」。"}, "monthly": {"t": "月度核算", "s": "把一个月的营业额、食材成本、开销放在一起，算出净利。\n先选月份，填当月销售；「操作 ▾ → 导入 POS 销售报表」可以一次导入。\n食材成本用实耗法：月初库存＋本月进货－月末盘点。\n看成本率、毛利、净利。杂饭、小菜没做配方的，靠这页兜底。\n上面有四个标签：「月度核算」、「成本差异」、「各分店排行」、「报表」，月底看成绩时常常一起看。"}, "variance": {"t": "成本差异", "s": "理论上该用多少食材钱，实际用了多少，差在哪。\n理论成本＝每道菜卖了几份×配方成本。\n实际成本＝月初库存＋本月进货－月末库存。\n差异＝实际－理论：正数表示用得比应该多，要查原因；接近 0 表示控制得好。\n3% 以内正常，3–8% 要留意，超过 8% 要处理（只是参考线）。\n资料不齐（没盘点、没配方）时，这页只会告诉你缺什么，不会乱编数字。"}, "report": {"t": "报表", "s": "用图和表看成本占比、盘点差异、损耗、呆滞货。\n概览：营业额和食材成本的趋势。\n成本占比：钱花在哪些食材上。\n盘点差异、损耗：哪里在漏钱。\n呆滞货：放太久没用掉的货，早点处理。"}, "pricechg": {"t": "价格变动", "s": "进货单价和上一次比，涨跌超过设定幅度（默认 5%）就会出现在这里。\n「多付」＝（新价－旧价）×这次数量。\n核对后可以：确认新价（接受涨价）、已追差价（已向供应商要回差额）、忽略。\n右上「操作 ▾」可以改提醒的幅度。"}, "hr": {"t": "员工档案", "s": "每位员工的基本资料。\n可以搜索、按职位筛选、排序。\n卡片上有年假使用进度条。\n只有运营经理以上才能新增、修改、删除。\n「登入邮箱」要填对，员工才能用自己的账号看自己的资料。"}, "attend": {"t": "打卡考勤", "s": "员工上下班打卡。\n大按钮会按状态变成「上班」或「下班」；打卡会检查手机的位置是不是在店里。\n上面显示在岗人数、本月时数；下面按日期看每个人的打卡记录。"}, "schedule": {"t": "排班", "s": "按周安排每位员工的班次。\n可以切换上周、本周、下周。\n手机一天一张卡，电脑一周七列。"}, "leave": {"t": "请假", "s": "员工提交请假，上级批准。\n员工：新增申请，等上级批准。\n店长、经理：在卡片上直接按「批准」或「拒绝」。\n可以按「待批准、已批、已拒」筛选。"}, "settings": {"t": "系统设置", "s": "账号、权限、界面和系统工具。\n账号权限：谁能用系统、是什么职位（运营经理以上才能管）。\n岗位权限编辑：每个职位能进哪些页面。\n界面风格：Default、机械风、中式风，还有音效开关。\n员工操作监察：看谁改了什么。\n版本更新：看当前版本、手动检查更新。"}};
function helpKey(){
  const p=curPage;
  if(p==='purchase'&&selSupplier)return 'purchase:sup';
  if(p==='inv'&&typeof invSupplier!=='undefined'&&invSupplier)return 'inv:sup';
  return PAGE_HELP[p]?p:'';
}
// 每页的「说明」：平时折叠，按一下才展开，白话讲这页做什么；还是看不懂可以直接问明记小助手
function helpBody(key){
  const H=PAGE_HELP[key];if(!H)return '';
  const lines=H.s.split('\n');
  let h=`<div class="hp-line">${oEsc(lines[0])}</div>`+lines.slice(1).map(l=>`<div class="hp-line">• ${oEsc(l)}</div>`).join('');
  h+=`<div class="hp-ask">${(aiAllowed()&&AUTH()&&AI_FN_URL)?`<button class="btn ghost sm" onclick="aiAskHelp('${key}')">还是看不懂？问明记小助手</button>`:`<span class="mini">还是看不懂？请问你的店长或运营经理。</span>`}</div>`;
  return h;
}
PAGE_HELP.temp={t:"温度检查",s:"冷藏柜、冷冻柜每天检查 4 次：10am、2pm、5pm、9pm，把温度登记在这里。\n点上面的时间，逐台填温度，按保存。不用一次填完，没填的回来再填。\n标准：冷藏柜 0–5°C，冷冻柜 −18°C 或更低。超出范围一定要写处理方法才能保存。\n页面最上面会显示今天已完成几次。「记录表」就是纸本那种表格，每次看 5 天。\n超标，或者该做的检查过了时间还没做，会出现在「运营健康 → 通知中心」。\n店长、厨师长可以按「设置设备」增减这间店的冷柜。"};
PAGE_HELP.expiry={t:"(有效期)管理",s:"每一批有保质期的货登记到期日，快到期会提醒，先到期的先用。\n收到肉、海鲜、酱料、半成品这类货，按「登记批次」：填品项、数量、到期日（或填保质天数，系统自动算到期日）。\n列表按到期日从早到晚排，最上面的要先用。\n用完了按「用完」；坏了、过期了按「丢弃」，会打开报废表单并填好，按保存才扣库存。\n快到期（3 天内）和已过期的，会出现在「运营健康 → 通知中心」。"};
PAGE_HELP.menueng={t:"菜单分析",s:"把每道菜分成四类，看哪些该推、哪些该改、哪些该下架。\n明星菜＝卖得多又赚钱；跑量菜＝卖得多但每份赚得少；潜力菜＝每份赚得多但卖得少；拖累菜＝卖得少也赚得少。\n用当月 POS 销量 × 菜品配方成本，只算食材成本，不含人工租金。\n要先导入当月销量，并且菜品要设好成本，才分析得出来。"};
function helpInject(){
  const key=helpKey();if(!key)return;
  const pg=document.querySelector('#pageHost .page.active');if(!pg||pg.querySelector('[data-help]'))return;

  // 这一页本来就有一条「说明」：把白话说明放在前面，原来的那句留作「补充」，不重复出现两条

function dashDays(){   // 折算用的天数：当月＝到今天为止的天数；以前的月份＝那个月的实际天数
  const m=String(costMonth||'').match(/^(\d{4})-(\d{2})$/);if(!m)return 30;
  if(costMonth===TODAY.slice(0,7))return Math.max(1,+TODAY.slice(8,10));
  return new Date(+m[1],+m[2],0).getDate();
}
function calcFin(){
  const x=d();const dd=dashDays();const mult=dashRange==="day"?1/dd:dashRange==="week"?7/dd:1;   // 日均/每周＝当月数字按「实际天数」折算（当月＝已过天数；以前固定按 30 天）
  const gross=calcRevenue()*mult;            // ← 由销量×菜价（未来=POS）
  const net=gross/1.06, sst=gross-net;       // 剥离 6% SST
  const cogs=calcCOGS()*mult;                // ← 真实食材成本（销量×BOM）
  const grossProfit=net-cogs;
  // 报废/招待：用「报废损耗」「招待赠送」当月记录，只显示；已经包含在「实耗法」食材成本里（月初库存＋进货－月末库存），不再另外扣，免得重复扣
  const wm=(x.wasteLog||[]).filter(r=>(r.date||'').slice(0,7)===costMonth).reduce((s,r)=>s+(+r.cost||0)*(+r.qty||0),0)*mult;
  const waste=wm;const ent=(x.offers||[]).filter(r=>(r.date||'').slice(0,7)===costMonth).reduce((s,r)=>s+(+r.total||0),0)*mult;
  // 运营开销：用「当月」那份（运营开销页选的月份，和「运营开销」「月度核算」同一个数）；以前误用「默认模板」，清掉当月数字后这里还是旧数
  const mc=(x.monthClose||{})[costMonth];const opex=((mc&&mc.locked&&mc.opex!=null)?mc.opex:opexTotal(costMonth))*mult;
  const netProfit=grossProfit-opex;
  return {gross,net,sst,cogs,grossProfit,waste,ent,opex,netProfit,foodPct:net?cogs/net*100:0,netPct:net?netProfit/net*100:0};
}

/* ============ 最低 / 标准库存（mk103，参照 SUPY Minimum / Par）============
   最低库存 min：降到这个数或以下 ＝「低于最低」，要订货了。
   标准库存 par：平时备到这个数最理想；订货就订到标准（订货量＝标准−现有）；超过标准＝「高于标准」（备太多）。
   旧品项只设过 par（以前叫安全库存，等于「降到它就要订」）：没设 min 的品项沿用旧算法，不会突然变样，也不判「高于标准」。
   完全没设定（min、par 都没有）的品项，库存是 0 不再被当成「低于最低」（以前会）。库存为负永远是问题。 */
function stockMin(i){return (i.min!=null&&i.min!=='')?(+i.min||0):null;}
function stockLevel(i){const q=+i.qty||0,mn=stockMin(i),par=+i.par||0,thr=mn!=null?mn:par;
  if(q<0)return 'neg';if(thr>0&&q<=thr)return 'low';if(mn!=null&&par>mn&&q>par)return 'high';if(!(thr>0))return 'unset';return 'ok';}
function stockOrderQty(i){const q=+i.qty||0,mn=stockMin(i),par=+i.par||0;return (mn!=null&&par>0)?Math.max(0,Math.ceil(par-q)):Math.max(0,Math.round(par*1.5-q));}
const STOCK_LV={neg:['p-r','库存为负','Negative'],low:['p-r','低于最低','Below min'],high:['p-b','高于标准','Above par'],ok:['p-g','正常','OK'],unset:['','未设定','Not set']};
let invLvl='all';
function invLvlSet(v){invLvl=v;render();}
function stockCounts(items){const o={neg:0,low:0,high:0,ok:0,unset:0};items.forEach(i=>{o[stockLevel(i)]++;});return o;}
function weeklyUse(name){const from=new Date(Date.now()-56*864e5).toISOString().slice(0,10);let q=0;(d().purchases||[]).forEach(r=>{if(r.item===name&&(r.date||'')>=from)q+=FISH_SUPPLIERS.includes(r.supplier)?(+r.weight||0):(+r.qty||0);});return q/8;}

    <div class="odc-f"><label>${zh?'最低库存':'Minimum'}<input class="odnum" id="lv_min_${k}" inputmode="decimal" value="${stockMin(i)==null?'':stockMin(i)}"></label><label>${zh?'标准库存':'Par'}<input class="odnum" id="lv_par_${k}" inputmode="decimal" value="${(+i.par||'')}"></label></div></div>`).join('')||`<div class="empty">${zh?'没有品项':'No items'}</div>`;

/* ================= M7 配方成本（可编辑菜品成本表 + 单独算）================= */
let dcSel=null, dcSearch='';
function dcTotal(dc){return (dc.ing||[]).reduce((s,i)=>s+(+i.cost||0),0);}
function dcCostPctColor(pct){return pct<28?'#0891B2':(pct<=35?'var(--green)':'var(--red)');}

/* ================= 月度核算引擎（按自然月独立联动，9月对9月）================= */
let costMonth = TODAY.slice(0,7);
function setCostMonth(m){costMonth=m;render();window.scrollTo(0,0);}
function monthLabel2(m){if(!m)return '';const[y,mm]=m.split('-');return LANG==="zh"?(y+"年"+(+mm)+"月"):m;}
function availMonths(){const s=new Set([costMonth,TODAY.slice(0,7)]);(d().purchases||[]).forEach(r=>{if(r.date)s.add(r.date.slice(0,7));});Object.keys(d().monthlySales||{}).forEach(m=>s.add(m));Object.keys(d().monthClose||{}).forEach(m=>s.add(m));Object.keys(d().opexByMonth||{}).forEach(m=>s.add(m));return [...s].filter(Boolean).sort().reverse();}
function monthLocked(m){const mc=(d().monthClose||{})[m];return !!(mc&&mc.locked);}
function monthAvgPrice(month,item){ // 原料当月加权平均进价（锁定后取归档值）
  const mc=(d().monthClose||{})[month];
  if(mc&&mc.locked&&mc.avgPrices&&(item in mc.avgPrices))return mc.avgPrices[item];
  let amt=0,qty=0;(d().purchases||[]).forEach(r=>{if((r.date||'').slice(0,7)===month&&r.item===item){amt+=(+r.price||0);qty+=(+r.qty||0);}});
  return qty?amt/qty:0;
}
/* 修复工具：把每个品项的加权成本，改成用某个月份的实际进货记录重算出来的月均价。
   monthAvgPrice 是直接从 d().purchases 原始记录算的，不受库存那边加权成本被污染影响，
   用来「重置」被污染的加权成本很干净。只会改有当月进货记录的品项，没有记录的不动。 */
function recalcCostForm(){
  const zh=LANG==="zh";
  openForm(`<h3>🔧 ${zh?"用月均价重算加权成本":"Recalc weighted cost from month avg"} <span class="x" onclick="closeM()">×</span></h3>
    <div class="mini" style="margin-bottom:10px;">${zh?"只会改「这个月有进货记录」的品项：把它的加权成本改成这个月的实际采购总额 ÷ 总数量。没有进货记录的品项不会被改动。适合用来修正之前因为操作/系统问题被弄错的成本。":"Only affects items purchased in this month: cost is reset to (total amount ÷ total qty) for that month."}</div>
    <div class="fr"><label>${zh?"月份 (YYYY-MM)":"Month"}</label><input id="rc_month" value="${TODAY.slice(0,7)}"></div>
    <button class="btn block brand" onclick="recalcCostRun()">✅ ${zh?"确认重算":"Recalculate"}</button>`);
}
async function recalcCostRun(){
  const zh=LANG==="zh";const month=(document.getElementById('rc_month')?.value||'').trim();
  if(!/^\d{4}-\d{2}$/.test(month)){alert(zh?"月份格式要 YYYY-MM":"Format must be YYYY-MM");return;}
  if(!confirm(zh?`确定用 ${month} 的月均价重算所有有进货记录的品项成本？这会覆盖它们目前的加权成本。`:`Recalculate cost for items purchased in ${month}? This overwrites their current weighted cost.`))return;
  const items=d().items||[];let n=0;
  items.forEach(it=>{const avg=monthAvgPrice(month,it.name);if(avg>0){it.cost=+avg.toFixed(4);n++;}});
  await save();closeM();render();
  alert((zh?`已用 ${month} 的月均价重算了 ${n} 个品项的加权成本。`:`Recalculated ${n} items using ${month} average.`));
}
/* 把供应商目录(SUPPLIER_CATALOG)里所有食材品项一次性建到库存品项库，
   方便配方成本「+材料 → 关联原料」下拉可以直接选，不用等实际进货过才会出现。
   成本先给 RM0(反正关联原料的成本是抓当月实际进货均价，不看这里的初始值)；
   单位先抓 SUPPLIER_META 的默认值，鱼头这类「按个不按重量」的要自己去库存页改单位。 */
async function importSupplierItems(){
  const zh=LANG==="zh";
  if(typeof SUPPLIER_CATALOG==='undefined')return;
  if(!confirm(zh?"把供应商目录里的食材品项全部加进库存品项库(饮料/清洁/包装类供应商除外)？已存在的品项不会重复加。":"Import all supplier catalog items into inventory (excluding drinks/cleaning/packaging)?"))return;
  const items=d().items=d().items||[];let n=0;
  Object.keys(SUPPLIER_CATALOG).forEach(sup=>{
    if(BOM_EXCLUDE_SUPPLIERS.includes(sup))return;
    (SUPPLIER_CATALOG[sup]||[]).forEach(name=>{
      if(name==='Daily Total Amount （RM)')return; // 表尾合计行，不是真品项
      if(items.find(i=>i.name===name))return; // 已存在就跳过，不重复加
      const meta=(typeof SUPPLIER_META!=='undefined'&&SUPPLIER_META[sup]&&SUPPLIER_META[sup][name])||{};
      const nid=Math.max(0,...items.map(i=>i.id),0)+1;
      items.push({id:nid,name,unit:meta.uom||'',buyUnit:'',conv:1,qty:0,cost:0,cat:'其他',par:0,yield:100,batches:[]});
      n++;
    });
  });
  await save();render();
  alert(zh?`已导入 ${n} 个新品项到库存（成本先是 RM0，等实际进货后自动更新）。单位是照默认设定抓的，麻烦您去库存页逐一检查一下，像鱼头这种是「按个」计价的，要把单位从 KG 改成「个」。`:`Imported ${n} new items (cost starts at RM0, updates once purchased). Please check units — some items may need adjusting.`);
}
function monthMaterials(month){ // 当月采购原料汇总
  const m={};(d().purchases||[]).forEach(r=>{if((r.date||'').slice(0,7)!==month)return;const k=r.item||'—';if(!m[k])m[k]={item:k,qty:0,amt:0};m[k].qty+=(+r.qty||0);m[k].amt+=(+r.price||0);});
  return Object.values(m).map(x=>({...x,avg:x.qty?x.amt/x.qty:0})).sort((a,b)=>b.amt-a.amt);
}
function dishCostForMonth(dc,month){ // 菜品当月成本=Σ(关联原料 当月均价×用量)+Σ(未关联=固定配料)
  const mc=(d().monthClose||{})[month];
  if(mc&&mc.locked&&mc.dishCost&&(dc.id in mc.dishCost))return mc.dishCost[dc.id];
  return (dc.ing||[]).reduce((s,ig)=>{if(ig.link)return s+monthAvgPrice(month,ig.link)*(+ig.qty||0);return s+(+ig.cost||0);},0);

/* ============ 导入 POS 销售报表（mk96）============
   POS 没有 API 时：每月（或每周）从 POS 导出「按菜品」的销售报表（CSV / Excel）→ 这里导入 → 对上 ERP 菜品 → 核对 → 写入当月销量。

let _pos=null;
function posParseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=(text.split(/\r?\n/,1)[0]||'');const cnt=c=>first.split(c).length-1;
  const sep=cnt('\t')>cnt(',')&&cnt('\t')>cnt(';')?'\t':(cnt(';')>cnt(',')?';':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[];}
    else cur+=ch;}
  row.push(cur);if(row.some(x=>String(x).trim()!==''))rows.push(row);
  return rows;
}
function posNum(v){if(v==null)return 0;const t=String(v).replace(/[^0-9.\-]/g,'');const n=parseFloat(t);return isNaN(n)?0:n;}
function loadScriptOnce(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]'))return res();const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc);});}
async function posReadFile(file){
  const name=(file.name||'').toLowerCase();
  if(/\.(xlsx|xls|xlsm)$/.test(name)){
    if(!window.XLSX)await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}).filter(r=>r.some(x=>String(x).trim()!==''));
  }
  return posParseCSV(await file.text());
}
function posGuessCols(rows){
  // 表头行：前 15 行里「非空文字格最多」的那一行

  const head=rows[hi].map(x=>String(x).trim().toLowerCase());
  const find=re=>head.findIndex(h=>re.test(h));
  return {hi,name:find(/item|product|dish|menu|description|name|菜|品名|商品|名称|项目/),qty:find(/qty|quantity|sold|count|份|数量|销量|件/),amt:find(/amount|sales|total|revenue|value|金额|销售额|营业额|合计|小计/)};
}
function posNorm(t){return String(t||'').toLowerCase().replace(/[^a-z0-9一-鿿]+/g,'');}
function posBigrams(t){const n=posNorm(t),o=new Set();for(let i=0;i<n.length-1;i++)o.add(n.slice(i,i+2));if(n.length===1)o.add(n);return o;}
function posMatchDish(name){
  const dishes=d().dishCosts||[];const key=posNorm(name);if(!key)return null;
  const al=(d().posAlias||{})[key];if(al&&dishes.find(x=>x.id===al))return {id:al,how:'alias'};
  for(const dc of dishes){if([dc.cn,dc.en,dc.code,((dc.code||'')+' '+(dc.cn||''))].some(v=>v&&posNorm(v)===key))return {id:dc.id,how:'exact'};}
  const a=posBigrams(name);if(!a.size)return null;let best=null,bs=0;
  for(const dc of dishes){for(const v of [dc.cn,dc.en]){const b=posBigrams(v);if(!b.size)continue;let x=0;a.forEach(g=>{if(b.has(g))x++;});const sc=x/Math.min(a.size,b.size)*0.6+x/(a.size+b.size-x)*0.4;if(sc>bs){bs=sc;best=dc.id;}}}

function posImport(month){

    try{_pos.file=f.name;_pos.rows=await posReadFile(f);}catch(e){return alert(zh?'读不了这个文件。Excel 读取需要联网；也可以在 Excel 里「另存为 CSV」再导入。':'Cannot read file');}

function posBuild(){

  const prev=Object.fromEntries((_pos.lines||[]).map(l=>[posNorm(l.name),l]));
  _pos.lines=Object.values(agg).map(l=>{const old=prev[posNorm(l.name)];const m=old?{id:old.dishId,how:old.how}:posMatchDish(l.name);

/* 「运营开销记录」(采购进销里那份零散流水账) 按类别加总，直接填进「运营开销录入」对应欄位
   (marketing/maintenance/wifi/rubbish/possaas/accounting/repair 两边 key 完全对得上)。
   只覆盖这几个欄位，租金/水电/商场抽成等不受影响；填完还没存档，按『保存本月』才真正写入。 */
function opexLogMonthTotals(month){
  const t={};(d().opexLog||[]).forEach(r=>{if((r.date||'').slice(0,7)!==month)return;t[r.cat]=(t[r.cat]||0)+(+r.amount||0);});
  return t;
}
/* 「运营开销记录」里的 7 个类别(营销/维修/Wi-Fi/垃圾清理/POS月租/会计费/维修杂项)是直接实时读取的，
   不用同步按钮、不写死进 o[k]——加一笔记录，运营开销/运营开销录入立刻反映最新数字。
   租金/水电/商场抽成不受影响，仍是手动填在 o[k] 里的。 */
function opexEffective(o,month,k){
  if(typeof OPEXLOG_CATS!=='undefined'&&OPEXLOG_CATS.some(c=>c[0]===k))return opexLogMonthTotals(month)[k]||0;
  return +o[k]||0;
}
async function saveOpexM(){

  alert(LANG==="zh"?("已保存 "+monthLabel2(m)+" 的运营开销：小计 "+money(opexMSubtotal(o,m))):("Saved "+monthLabel2(m)));

}

/* ================= 人事薪资 Payroll（个人明细）================= */
function empGross(e){return e.basic+e.allowance+e.ot;}
function empNet(e){return empGross(e)-e.epf-e.socso-e.eis;}
/* 人工成本从人事薪资汇总（供 OpEx 联动）*/
/* 人工成本 = 用『薪资发放 Payroll』同一套马来西亚法定引擎(computeRow)算，
   使运营开销的人工成本 与 Payroll 的雇主总成本 完全一致。
   salaries=底薪+津贴+奖励；ot=加班额；epf/socso/eis=雇主承担；levy=人头税。 */
function payrollLabour(month){
  month=month||(typeof costMonth!=='undefined'?costMonth:TODAY.slice(0,7));
  const prev=(typeof payrunMonth!=='undefined')?payrunMonth:null;
  if(typeof payrunMonth!=='undefined')payrunMonth=month;
  let salaries=0,ot=0,epf=0,socso=0,eis=0,levy=0;
  (d().staff||[]).forEach(e=>{const c=computeRow(e);salaries+=c.basic+c.allowance+c.incentive;ot+=c.otAmt;epf+=c.epf.er;socso+=c.soc.er;eis+=c.eis.er;levy+=c.levy;});
  if(prev!=null)payrunMonth=prev;
  const r2=n=>+(+n).toFixed(2);
  return {salaries:r2(salaries),ot:r2(ot),epf:r2(epf),socso:r2(socso),eis:r2(eis),levy:r2(levy)};
}
/* ---- 按自然月独立的运营开销 ----
   d().opex 作为「默认模板」（新月份的初始值、大盘/ALL 聚合回退）；
   d().opexByMonth[YYYY-MM] 为该月专属副本，一旦编辑/同步某月即建立，互不串月。 */
function opexTemplate(){if(!d().opex)d().opex={};return d().opex;}
function curOpex(month){month=month||costMonth;const bm=d().opexByMonth;if(bm&&bm[month])return bm[month];return opexTemplate();}
function materializeOpex(month){ // 首次编辑某月→从"≤当月的最近已建月"或默认模板复制一份
  month=month||costMonth;
  if(!d().opexByMonth)d().opexByMonth={};
  if(!d().opexByMonth[month]){
    const prev=Object.keys(d().opexByMonth).filter(m=>m<month).sort();
    const src=prev.length?d().opexByMonth[prev[prev.length-1]]:opexTemplate();
    d().opexByMonth[month]=JSON.parse(JSON.stringify(src));
  }
  return d().opexByMonth[month];
}
function opexTotal(month){const o=curOpex(month)||{};return Object.keys(o).reduce((s,k)=>s+opexEffective(o,month,k),0);}
const LABOUR_KEYS=["salaries","ot","epf","socso","eis","levy"];
function applyLabour(o,pl){o.salaries=pl.salaries;o.ot=pl.ot;o.epf=pl.epf;o.socso=pl.socso;o.eis=pl.eis;o.levy=pl.levy;}
function autoSyncLabour(){ if(!PAYROLL_ON||!PAY_LOADED.has(curOutlet))return; // 没有薪资数据(或没权限)时绝不能同步，否则会把人工成本写成 0
  // 员工薪资变动→自动更新「默认模板 + 当前未锁定月」的人工成本（其他手动项与其它月不动）
  const pl=payrollLabour();
  applyLabour(opexTemplate(),pl);
  const bm=d().opexByMonth;
  if(bm&&bm[costMonth]&&!monthLocked(costMonth))applyLabour(bm[costMonth],pl);
}
async function syncOpexFromPayroll(){
  if(!PAY_LOADED.has(curOutlet))return alert(LANG==="zh"?"薪资数据未载入（没有权限或网络出错），不能同步人工成本。":"Payroll data not loaded.");
  if(monthLocked(costMonth))return alert(LANG==="zh"?"本月已月末锁定，请先解锁再同步。":"Month is locked.");
  if(!confirm(LANG==="zh"?("用人事薪资的实际数据填入【"+monthLabel2(costMonth)+"】运营开销的人工成本（薪资/EPF/SOCSO/EIS/人头税/OT）？之后仍可手动微调。"):"Fill labour OpEx from payroll?"))return;
  const pl=payrollLabour();const o=materializeOpex(costMonth);applyLabour(o,pl);applyLabour(opexTemplate(),pl);
  auditLog("同步人工成本","人事薪资→OpEx "+monthLabel2(costMonth),"",money(pl.salaries+pl.ot+pl.epf+pl.socso+pl.eis+pl.levy));await save();render();}

/* ---- 可视化图表（营业额趋势线 + 成本结构 + 各店对比）---- */
/* 近 6 个月：营业额 vs 食材成本（真实：月度核算里录的月销量×当月成本；没数据的月份留空，不再用示范数字） */
function trendChartHTML(){
  const zh=LANG==="zh";
  const ms=[];{let y=+TODAY.slice(0,4),m=+TODAY.slice(5,7);for(let i=0;i<6;i++){ms.unshift(y+'-'+String(m).padStart(2,'0'));m--;if(m<1){m=12;y--;}}}
  const data=ms.map(m=>{const p=monthlyPnL(m);return {m,rev:p.rev,cogs:p.cogs,pct:p.foodPct};});
  const has=data.some(x=>x.rev>0||x.cogs>0);
  const head=`<div class="fb" style="margin-top:6px;"><h2 class="h" style="margin:0;">${zh?"营业额与食材成本":"Sales vs Food cost"} <span class="tag">${zh?'近 6 个月':'6 months'}</span></h2></div>`;
  if(!has)return head+`<div class="card" style="padding:22px 16px;text-align:center;margin:8px 0 12px;"><div style="font-weight:700;margin-bottom:4px;">${zh?'还没有月度销售数据':'No monthly sales yet'}</div><div class="mini">${zh?'到「月度核算」录入每月菜品销量后，这里会自动画出趋势。':'Enter monthly sales in Monthly Costing.'}</div></div>`;

function haversine(la1,lo1,la2,lo2){const R=6371;const dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
let attQuery='';
const ATT_LATE_MIN=10; // 超过标准时间几分钟才算迟到
function attLate(a){const sc=attSched(a.date);const r=[];
  if(a.in){const m=toMin(a.in)-toMin(sc.in);if(m>ATT_LATE_MIN)r.push({k:'上班',m});}
  let backLate=false;
  if(a.back){const m=toMin(a.back)-toMin(sc.back);if(m>ATT_LATE_MIN){r.push({k:'下午上班',m});backLate=true;}}
  // 休息超时：休息实际时长比标准时长多超过 10 分钟（如果「下午上班」已经标了迟到，就不重复标）
  if(a.brk&&a.back&&!backLate){const over=(toMin(a.back)-toMin(a.brk))-(toMin(sc.back)-toMin(sc.brk));if(over>ATT_LATE_MIN)r.push({k:'休息超时',m:over,t:'over'});}
  // 早退：晚上下班比标准时间早超过 10 分钟
  if(a.out){const m=toMin(sc.out)-toMin(a.out);if(m>ATT_LATE_MIN)r.push({k:'早退',m,t:'early'});}
  return r;}
function attLateHTML(a,zh){return attLate(a).map(x=>`<span class="pill p-r" style="margin-left:4px;">${zh?(x.t?`${x.k} ${x.m} 分钟`:`${x.k}迟到 ${x.m} 分钟`):(x.t==='over'?`Break over ${x.m} min`:x.t==='early'?`Left early ${x.m} min`:`Late ${x.m} min`)}</span>`).join('');}
function attRowText(a,zh){
  if(!a.brk&&!a.back)return a.in+' → '+(a.out||(zh?'上班中':'on duty'));
  return a.in+' → '+a.brk+(zh?' ｜ 下午 ':' | PM ')+(a.back?a.back+' → '+(a.out||(zh?'上班中':'on duty')):(zh?'（休息中）':'(on break)'));
}

// 打卡范围：以「本店打卡位置」(d().geo，由店长/店面经理/运营经理在店里按一下设定) 为中心，默认 5 米（可改）
function geoRadius(){const r=+(d().geoRadius);return r>=2&&r<=200?r:5;}
function canSetGeo(){const R=['owner','hrmgr','area','outletmgr','manager'];return R.includes(curRole)&&(!curUser||R.includes(curUser.role))&&!isAgg();}
// 取「最准的一次」定位：最多等 maxMs 毫秒，精度达到 goodAcc(米) 就提前收工
function getBestPosition(maxMs,goodAcc,onProg){
  return new Promise((res,rej)=>{
    let best=null,done=false,id=null;
    const fin=()=>{if(done)return;done=true;try{navigator.geolocation.clearWatch(id);}catch(e){}best?res(best):rej(new Error('nopos'));};
    id=navigator.geolocation.watchPosition(p=>{if(!best||p.coords.accuracy<best.coords.accuracy)best=p;try{onProg&&onProg(best);}catch(e){}if(best.coords.accuracy<=goodAcc)fin();},
      e=>{if(!best&&!done){done=true;try{navigator.geolocation.clearWatch(id);}catch(x){}rej(e);}},{enableHighAccuracy:true,maximumAge:0,timeout:maxMs});
    setTimeout(fin,maxMs);
  });
}
async function setGeoHere(){
  if(!canSetGeo())return;const zh=LANG==="zh";
  if(!navigator.geolocation)return alert(zh?'此设备不支持定位':'No geolocation');
  if(!confirm(zh?`请确认你现在人在「${nm(outletObj())}」店里，站在大家打卡的位置（例如收银台附近）。\n按确定后会把你现在的位置记成这间店的打卡位置。`:'Stand inside the outlet, then confirm.'))return;
  const st=document.getElementById('gpsStatus');if(st)st.innerHTML=zh?'定位中…':'Locating…';
  try{
    const p=await getBestPosition(15000,5,q=>{if(st)st.innerHTML=(zh?'定位中… 精度 ±':'Locating… ±')+Math.round(q.coords.accuracy)+(zh?' 米':' m');});
    const acc=Math.round(p.coords.accuracy);
    if(acc>20){alert(zh?`定位只有 ±${acc} 米的精度，太差了。请走到空旷处或靠窗，再按一次。`:`Accuracy ±${acc} m is too poor. Try near a window / outdoors.`);if(st)st.innerHTML='';return;}
    d().geo={lat:p.coords.latitude,lng:p.coords.longitude,acc,by:(curUser?curUser.name:ROLES[curRole].name),ts:TODAY+' '+new Date().toTimeString().slice(0,5)};
    try{auditLog('设定打卡位置',nm(outletObj())+' 精度±'+acc+'米');}catch(e){}
    await save();alert(zh?`已设定本店打卡位置（精度 ±${acc} 米）。`:'Location saved.');render();
  }catch(e){alert(zh?'无法取得定位（请允许定位权限）':'Location denied');if(st)st.innerHTML='';}
}
async function setGeoRadius(){
  if(!canSetGeo())return;const zh=LANG==="zh";
  const v=prompt(zh?`打卡范围（米，2–200），现在是 ${geoRadius()}：`:'Radius (m)',String(geoRadius()));if(v==null)return;
  const n=Math.round(+v);if(!(n>=2&&n<=200))return alert(zh?'请填 2 到 200 之间的数字':'Enter 2–200');
  const old=geoRadius();d().geoRadius=n;try{auditLog('改打卡范围',old+'米 → '+n+'米');}catch(e){}await save();render();
}
// 标准打卡时间（四次）：平日(周一~五) 与 周末(周六日) 不同
const ATT_SCHED={wd:{in:'10:00',brk:'15:00',back:'17:00',out:'22:00'},we:{in:'10:00',brk:'14:30',back:'16:30',out:'22:00'}};
function attSched(dt){const w=new Date((dt||TODAY)+'T00:00:00').getDay();return (w===0||w===6)?ATT_SCHED.we:ATT_SCHED.wd;}
function attIsWeekend(dt){const w=new Date((dt||TODAY)+'T00:00:00').getDay();return w===0||w===6;}
// 这一天下一步该打哪一下：in 上班 / brk 中午休息 / back 下午上班 / out 晚上下班 / done 已完成
function attNext(a){if(!a)return 'in';if(a.out)return 'done';if(!a.brk&&!a.back)return 'brk';if(a.brk&&!a.back)return 'back';return 'out';}
function attHours(a){const m=toMin;let h=0;
  if(a.brk){h+=Math.max(0,m(a.brk)-m(a.in));if(a.back&&a.out)h+=Math.max(0,m(a.out)-m(a.back));}
  else if(a.out)h=Math.max(0,m(a.out)-m(a.in));
  return +(h/60).toFixed(1);}
function toMin(hhmm){const a=String(hhmm||'0:0').split(':');return (+a[0]||0)*60+(+a[1]||0);}
async function doClockIn(mode){
  const st=document.getElementById('gpsStatus');const zh=LANG==="zh";const o=outletObj();
  if(!currentEmpId()){st.innerHTML="⚠️ "+(zh?"你的账号尚未绑定员工档案，无法打卡。请联系管理员在「员工档案」里填入你的登入邮箱。":"Account not linked to an employee record. Ask an admin to set your login email in Employee Profile.");return;}
  if(!navigator.geolocation){st.innerHTML="⚠️ "+(zh?"此设备不支持定位":"No geolocation");return;}
  const g=d().geo;
  if(!g||!(g.lat&&g.lng)){st.innerHTML="⚠️ "+(zh?"本店还没设定打卡位置。请店长或店面经理先到店里，在「打卡考勤」页最下面按「设定本店打卡位置」。":"The outlet clock-in location is not set yet.");return;}
  st.innerHTML=(zh?"定位中…":"Locating…");
  let pos;
  try{pos=await getBestPosition(12000,4,q=>{st.innerHTML=(zh?"定位中… 精度 ±":"Locating… ±")+Math.round(q.coords.accuracy)+(zh?" 米":" m");});}
  catch(e){st.innerHTML="⚠️ "+(zh?"无法取得定位（请允许定位权限）":"Location denied");return;}
  const acc=Math.round(pos.coords.accuracy),R=geoRadius();
  const dist=haversine(pos.coords.latitude,pos.coords.longitude,g.lat,g.lng)*1000;
  const who=(curUser&&curUser.name)||currentEmpId();
  if(acc>20){
    st.innerHTML="❌ "+(zh?`定位不够准（±${acc} 米）。请走到空旷处或靠窗，再试一次。`:`Location not accurate (±${acc} m). Try again near a window.`);
    try{auditLog('GPS打卡失败(定位不准)',who+' '+nm(o)+' 精度±'+acc+'米 距离'+dist.toFixed(1)+'米');await save();}catch(e){}
    return;
  }
  if(dist<=R){
    const hhmm=myNowHHMM();
    if(!d().attendance)d().attendance=[];
    const today=attCurrent(currentEmpId());
    const nx=attNext(today);const dm=` (${dist.toFixed(1)}m)`;let label='';
    if(nx==='done'){st.innerHTML="ℹ️ "+(zh?"今天已经打完卡了":"Already done today");return;}
    if(nx==='in'){d().attendance.unshift({empId:currentEmpId(),date:TODAY,in:hhmm,out:"",hours:0,inDist:+dist.toFixed(1),inAcc:acc});label=zh?'上班':'Clock-in';}
    else if(nx==='brk'&&mode==='out'){today.out=hhmm;today.hours=attHours(today);today.outDist=+dist.toFixed(1);today.outAcc=acc;label=zh?'下班(没休息)':'Clock-out';}
    else if(nx==='brk'){today.brk=hhmm;today.hours=attHours(today);today.brkDist=+dist.toFixed(1);today.brkAcc=acc;label=zh?'中午休息':'Break';}
    else if(nx==='back'){today.back=hhmm;today.backDist=+dist.toFixed(1);today.backAcc=acc;label=zh?'下午上班':'Back';}
    else{today.out=hhmm;today.hours=attHours(today);today.outDist=+dist.toFixed(1);today.outAcc=acc;label=zh?'下班':'Clock-out';}
    st.innerHTML="✅ "+label+(zh?"打卡成功":" OK")+dm;
    auditLog("GPS打卡 "+label,nm(o)+" 距离"+dist.toFixed(1)+"米 精度±"+acc+"米","","");await save();setTimeout(render,900);
  }else{
    st.innerHTML="❌ "+(zh?`你距离打卡位置约 ${Math.round(dist)} 米，要在 ${R} 米内才能打卡（定位精度 ±${acc} 米）`:`${Math.round(dist)} m away; must be within ${R} m (±${acc} m)`);
    try{auditLog('GPS打卡失败(太远)',who+' '+nm(o)+' 距离'+dist.toFixed(1)+'米 精度±'+acc+'米 范围'+R+'米');await save();}catch(e){}
  }
}

/* 这个分店如果已经存过自己的订货单(填过数量/改过品项)，系统会一直用那份存档，
   不会再看程式码里最新版的 ORDER_SEED——所以后来在 ORDER_SEED 补上的照片，
   这些已经存档过的分店看不到。
   这个工具只把「缺照片」的那些行，从 ORDER_SEED 把照片补进来，不会动到已经填
   的数量。品项文字很多分店存的是供应商目录格式(比如"DRYC - P003 · Peanut 花生")
   跟 ORDER_SEED 的品牌名格式("BEER / Cooking Rice Wine\n兴兴发花雕酒...")不一样，
   完全对不上，所以改用「拆字比对」：把两边文字拆成英文单字/中文词，重叠越多分越
   高，只有唯一一个分数最高、且分数够高(≥2)才会自动配对，分数不够或有并列最高分
   (代表可能配错)一律跳过不补，交给人工处理，避免乱放。 */
function _ordTokens(s){
  s=(s||'').replace(/[（）()【】\[\]\/,.\-·@]/g,' ');
  const m=s.match(/[A-Za-z]{3,}|[一-鿿]{2,}/g)||[];
  return m.map(x=>x.toLowerCase());
}
function _ordBestMatch(text,seedArr){
  const t=new Set(_ordTokens(text));if(!t.size)return null;
  let best=null,bestScore=0,tie=false;
  seedArr.forEach(si=>{
    if(!si.d||!si.imgs||!si.imgs.length)return; // 没图的候选没意义
    const st=_ordTokens(si.d);
    let score=0;st.forEach(w=>{if(t.has(w))score++;});
    if(score>bestScore){bestScore=score;best=si;tie=false;}
    else if(score===bestScore&&score>0&&si!==best){tie=true;}
  });
  return (bestScore>=2&&!tie)?best:null;
}

/* ============ 定期盘点排程（mk107，参照 SUPY Schedule Counts）============
   设定「几时要盘点」：每天 / 每周某天 / 每两周某天 / 每月某号（或月底）；类型＝实物盘点（逐品项）或月末盘点；范围＝全部或某家供应商。
   系统按「上次盘点日」算「下次到期日」，到期/逾期会在「盘点」页、运营健康、提醒里催你。
   上次盘点日＝手动按「标记已盘点」和系统自动认得的（月末盘点记录 / 实物盘点记录的日期）里最晚的那个。 */
function schedFmt(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function schedAdd(ds,n){const a=ds.split('-').map(Number),dt=new Date(a[0],a[1]-1,a[2]+n);return schedFmt(dt);}
function schedDiff(a,b){const f=x=>{const q=x.split('-').map(Number);return Date.UTC(q[0],q[1]-1,q[2]);};return Math.round((f(a)-f(b))/864e5);}
function schedLastDone(s){
  let last=s.lastDone||'';
  if(s.kind==='monthend'){(d().monthEnd||[]).forEach(r=>{if(r.date&&(!s.supplier||r.supplier===s.supplier)&&r.date>last)last=r.date;});}
  else{(d().stocktakes||[]).forEach(r=>{if(r.date&&(!s.supplier||itemSupplier(r.item)===s.supplier)&&r.date>last)last=r.date;});}
  return last;
}
function schedNext(s){
  const last=schedLastDone(s),start=s.created||TODAY;
  const dowAfter=(base,dow)=>{let k=schedAdd(base,1);for(let i=0;i<7;i++){const a=k.split('-').map(Number);if(new Date(a[0],a[1]-1,a[2]).getDay()===dow)return k;k=schedAdd(k,1);}return k;};
  const base=last||schedAdd(start,-1);
  if(s.freq==='daily')return schedAdd(base,1);
  if(s.freq==='weekly')return dowAfter(base,+s.dow||0);
  if(s.freq==='biweekly')return dowAfter(last?schedAdd(last,13):base,+s.dow||0);
  // monthly：dom=0 表示月底
  let a=base.split('-').map(Number),y=a[0],m=a[1];
  for(let i=0;i<14;i++){const ld=new Date(y,m,0).getDate(),day=(+s.dom===0)?ld:Math.min(+s.dom||1,ld);const c=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');if(c>base)return c;m++;if(m>12){m=1;y++;}}
  return schedAdd(base,30);
}
function schedStatus(s){
  const next=schedNext(s);if(s.active===false)return {next,st:'paused',n:0};
  const n=schedDiff(next,TODAY);   // 负数＝逾期天数
  return {next,n,st:n<0?'overdue':n===0?'today':n<=2?'soon':'ok'};
}
function schedFreqText(s){const z=LANG==="zh",w=z?['日','一','二','三','四','五','六']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  if(s.freq==='daily')return z?'每天':'Daily';if(s.freq==='weekly')return z?'每周'+w[+s.dow||0]:'Weekly '+w[+s.dow||0];if(s.freq==='biweekly')return z?'每两周'+w[+s.dow||0]:'Biweekly '+w[+s.dow||0];
  return +s.dom===0?(z?'每月月底':'Month-end'):(z?`每月 ${s.dom} 号`:`Monthly day ${s.dom}`);}

function schedSummary(){const z=LANG==="zh";const L=schedList().filter(s=>s.active!==false).map(s=>({s,x:schedStatus(s)}));return {all:L,od:L.filter(o=>o.x.st==='overdue'),td:L.filter(o=>o.x.st==='today')};}

/* 手机双指放大/缩小页面时，iOS 的「固定」元素会跑到屏幕中间。这里让底部导航条永远贴在「看得到的画面」最底下，大小也不变 */
(function(){
  const vv=window.visualViewport;if(!vv)return;let raf=0;
  function apply(){
    raf=0;const tb=document.getElementById('tabbar');if(!tb)return;
    const s=vv.scale;
    if(Math.abs(s-1)<0.02){if(tb.style.transform){tb.style.transform='';tb.style.transformOrigin='';}return;}   // 没缩放：不动它（键盘弹出也不影响）
    const lh=document.documentElement.clientHeight;

  }
  const q=()=>{if(!raf)raf=requestAnimationFrame(apply);};
  vv.addEventListener('resize',q);vv.addEventListener('scroll',q);window.addEventListener('scroll',q,{passive:true});window.addEventListener('orientationchange',q);
  // iPhone：键盘收起后，底部导航条有时卡在原本键盘上沿（屏幕中间），要滚一下才回去。
  // 键盘收起时（输入框失焦 / 可视区域变回全高）强制浏览器重新排一次固定元素。
  let kick=0;

    const tb=document.getElementById('tabbar');
    const y=window.scrollY,x=window.scrollX;window.scrollTo(x,y+1);window.scrollTo(x,y);
    if(tb){const pv=tb.style.display;tb.style.display='none';void tb.offsetHeight;tb.style.display=pv;}
    q();
  }

  document.addEventListener('focusout',e=>{const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))later();},true);
  let lastH=vv.height;vv.addEventListener('resize',()=>{if(vv.height>lastH+80)later();lastH=vv.height;});
})();

    for(let n=t;n&&n!==document.body;n=n.parentElement){const s=getComputedStyle(n);if(/(auto|scroll)/.test(s.overflowY)&&n.scrollHeight>n.clientHeight&&n.scrollTop>0)return true;}
