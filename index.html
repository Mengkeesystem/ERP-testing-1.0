<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --ink:#12203A;--ink2:#3A4A66;--paper:#F5F6F4;--card:#FFFFFF;--line:#E1E5EC;
    --brand:#0F5C4E;--brand2:#14876F;--gold:#B8894B;--red:#B23A3A;--amber:#C08A2E;--green:#2E7D46;
    --blue:#2A5FA0;--purple:#6B4E9E;--grey:#6A7688;--soft:#F0F2F5;
  }
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:13.5px;line-height:1.45;padding-bottom:70px;}
  /* top */
  .top{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:60;flex-wrap:wrap;}
  .top .l{display:flex;align-items:center;gap:9px;}
  .logo{background:var(--gold);color:var(--ink);font-weight:800;font-size:12px;padding:3px 8px;border-radius:5px;letter-spacing:.02em;}
  .brand-logo{display:inline-flex;align-items:center;line-height:0;}
  .brand-logo svg{display:block;border-radius:8px;}
  .bh-logo{display:inline-block;background-image:url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22100%22%20height%3D%22100%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2292%22%20height%3D%2292%22%20rx%3D%2216%22%20fill%3D%22%237C1619%22/%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2292%22%20height%3D%2292%22%20rx%3D%2216%22%20fill%3D%22none%22%20stroke%3D%22%23F2B417%22%20stroke-width%3D%227%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2233%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%20font-family%3D%22Microsoft%20YaHei%2C%20PingFang%20SC%2C%20sans-serif%22%20font-weight%3D%22800%22%20font-size%3D%2240%22%20fill%3D%22%23F2B417%22%3E%E6%98%8E%3C/text%3E%3Ctext%20x%3D%2250%22%20y%3D%2270%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%20font-family%3D%22Microsoft%20YaHei%2C%20PingFang%20SC%2C%20sans-serif%22%20font-weight%3D%22800%22%20font-size%3D%2240%22%20fill%3D%22%23F2B417%22%3E%E8%AE%B0%3C/text%3E%3C/svg%3E');background-size:contain;background-repeat:no-repeat;background-position:center;}
  .top h1{font-size:15px;font-weight:700;}
  /* ===== 采购网格 Excel 风格 ===== */
  .gwrap{max-height:72vh;overflow:auto;border:1px solid #333;border-radius:6px;}
  .gtbl{border-collapse:separate;border-spacing:0;font-size:12px;background:#fff;}
  .gtbl th,.gtbl td{border-right:1px solid #333;border-bottom:1px solid #333;padding:0;white-space:nowrap;background:#fff;}
  .gtbl thead th{position:sticky;top:0;z-index:3;background:#E8EDF3;color:#12203A;font-weight:700;padding:5px 6px;border-bottom:2px solid #333;text-align:center;}
  .gtbl input{width:100%;box-sizing:border-box;border:0;padding:7px 6px;font-size:12px;background:transparent;text-align:center;font-family:inherit;}
  .gtbl input:focus{outline:2px solid var(--gold);outline-offset:-2px;background:#FFFBEB;}
  /* 去掉数字输入框的上下箭头，让价钱和 kg/规格 完全居中对齐 */
  .gtbl input[type=number]{-moz-appearance:textfield;}
  .gtbl input[type=number]::-webkit-outer-spin-button,.gtbl input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  /* ≤10 表头：品名输入 + 删除键并排，删除键始终可见 */
  .gtbl th .gih{display:flex;align-items:center;gap:4px;justify-content:center;}
  .gtbl th .gih input{width:auto;flex:1;min-width:70px;}
  .gtbl th .gih .gidel{flex:none;color:#B42318;border-color:#B42318;padding:2px 6px;}
  .gtbl td.gname .growctl{display:flex;gap:3px;margin-top:4px;justify-content:flex-start;}
  .gtbl .growctl .ib{flex:none;font-size:13px;padding:2px 6px;line-height:1.1;cursor:pointer;border:1px solid var(--line);border-radius:5px;background:#fff;}
  .gtbl .growctl .gidel{color:#B42318;border-color:#f0c4c4;}
  .gtbl th .gih .growctl{display:flex;gap:3px;margin-left:2px;}
  .gtbl .growctl .gdrag{cursor:grab;background:#EAF0F6;border-color:#c3d2e2;color:#2A5FA0;font-weight:800;touch-action:none;}
  .gtbl .growctl .gdrag:active{cursor:grabbing;}
  .gtbl .growctl .gdrag.gdragover{background:#FDECC8;border-color:#C9A227;box-shadow:0 0 0 2px #C9A227 inset;}
  .gtbl .gcell{min-width:74px;}
  /* 进货单专用：每格自己填数量/当天价钱(/重量)，不再共用一整月的单价 */
  .gtbl .gcell.gcellp{min-width:78px;padding:2px;}
  .gtbl .gcellp .gcw{display:flex;flex-direction:column;gap:2px;}
  .gtbl .gcellp input{padding:3px 3px;font-size:11px;border:1px solid #d7dce3;border-radius:3px;margin:0;}
  .gtbl .gcellp .gcamt{font-size:11px;font-weight:700;color:#12203A;padding:1px 0;}
  .ptbl td,.ptbl th{border-right:1px solid #ddd;border-bottom:1px solid #ddd;padding:4px 6px;}
  .ptbl td.pstick,.ptbl th.pstick{position:sticky;left:0;z-index:2;background:#F3F6FB;box-shadow:1px 0 0 #ccc;}
  .ptbl thead th.pstick{z-index:4;background:#E8EDF3;}
  .ptbl td.pstickR{position:sticky;right:0;z-index:2;background:#FAFBFC;box-shadow:-1px 0 0 #ccc;}
  .gtbl td.gcode,.gtbl th.gcode{position:sticky;left:0;z-index:2;min-width:74px;max-width:74px;}
  .gtbl td.gname,.gtbl th.gname{position:sticky;left:74px;z-index:2;text-align:left;font-weight:700;padding:7px 8px;min-width:180px;max-width:180px;box-shadow:1px 0 0 #333;}
  .gtbl td.gunit,.gtbl th.gunit{position:sticky;left:254px;z-index:2;min-width:56px;max-width:56px;}
  .gtbl td.gpack,.gtbl th.gpack{position:sticky;left:310px;z-index:2;min-width:120px;max-width:120px;}
  .gtbl td.gprice,.gtbl th.gprice{position:sticky;left:430px;z-index:2;min-width:76px;max-width:76px;box-shadow:1px 0 0 #333;}
  .gtbl thead th.gcode{z-index:4;background:#E8EDF3;}
  .gtbl thead th.gname,.gtbl thead th.gunit,.gtbl thead th.gpack,.gtbl thead th.gprice{z-index:4;background:#E8EDF3;}
  /* 识别列/表头行：Code·品名·单位·规格·单价 用统一浅蓝底，一眼区分录入区 */
  .gtbl td.gcode,.gtbl td.gunit,.gtbl td.gpack,.gtbl td.gprice{background:#F3F6FB;}
  .gtbl td.gname{background:#EDF2F9;}
  /* ≤10 布局上方四行(Code/单价RM/单位/规格) */
  .gtbl tr.ghdr td{background:#EDF2F9;}
  .gtbl tr.ghdr input{font-weight:600;color:#12203A;text-align:center;}
  .gtbl tr.ghdr td.ghlab{background:#DCE5F1;font-weight:800;color:#12203A;text-align:center;padding:7px 6px;}
  .gtbl tr.ghdr-end td{border-bottom:2px solid #333;}
  /* 中央厨房 · 订货表 Order List */
  .obanner{font-weight:800;color:#fff;background:#c0202a;padding:8px 14px;border-radius:8px;font-size:15px;}
  .owrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;margin-top:10px;}
  @media(max-width:920px){.owrap{grid-template-columns:1fr;}}
  .ocol{min-width:0;}
  .otbl{width:100%;border-collapse:collapse;font-size:12px;background:#fff;table-layout:fixed;}
  .otbl th,.otbl td{border:1px solid #333;padding:3px 5px;vertical-align:middle;overflow:hidden;}
  .otbl thead th{background:#E8EDF3;color:#12203A;text-align:center;font-weight:800;}
  .otbl th.oimg,.otbl td.oimg{text-align:center;padding:8px 6px;line-height:0;}
  .otbl td.oimg img{object-fit:contain;display:block;margin:6px auto;image-rendering:auto;}   /* 每张照片各占一行 */
  .ouniimg{text-align:center;padding:10px;}
  .ouniimg img{max-width:250px;width:100%;height:auto;border-radius:6px;}
  /* DESCRIPTION：中英文整段直接显示、自动换行、不需拉动 */
  .otbl td.odesc{white-space:normal;word-break:break-word;vertical-align:middle;}
  .otbl .odesc-view{line-height:1.4;padding:3px 2px;color:var(--ink);}
  .otbl .odesc-edit{line-height:1.4;padding:4px;min-height:34px;white-space:pre-wrap;word-break:break-word;border:1px dashed transparent;border-radius:4px;}
  .otbl .odesc-edit:hover{border-color:#cbd5e1;}
  .otbl .odesc-edit:focus{outline:none;border:1px solid var(--gold);background:#FFFBEB;}
  /* 大小档位：小 / 中 / 大（图片+文字整体缩放，电脑/手机都能调清楚）*/
  .orderroot .otbl td.oqty input{width:100%;border:0;text-align:center;font-family:inherit;font-weight:700;background:transparent;padding:6px 2px;box-sizing:border-box;}
  .orderroot.size-s .otbl td.oimg{width:78px;} .orderroot.size-s .otbl td.oimg img{width:70px;height:70px;}
  .orderroot.size-s .otbl .odesc-view,.orderroot.size-s .otbl .odesc-edit{font-size:11px;} .orderroot.size-s .otbl td.oqty input{font-size:12px;} .orderroot.size-s .otbl th.oqty,.orderroot.size-s .otbl td.oqty{width:44px;}
  .orderroot.size-m .otbl td.oimg{width:112px;} .orderroot.size-m .otbl td.oimg img{width:104px;height:104px;}
  .orderroot.size-m .otbl .odesc-view,.orderroot.size-m .otbl .odesc-edit{font-size:13px;} .orderroot.size-m .otbl td.oqty input{font-size:14px;} .orderroot.size-m .otbl th.oqty,.orderroot.size-m .otbl td.oqty{width:54px;}
  .orderroot.size-l .otbl td.oimg{width:156px;} .orderroot.size-l .otbl td.oimg img{width:148px;height:148px;}
  .orderroot.size-l .otbl .odesc-view,.orderroot.size-l .otbl .odesc-edit{font-size:15px;} .orderroot.size-l .otbl td.oqty input{font-size:16px;} .orderroot.size-l .otbl th.oqty,.orderroot.size-l .otbl td.oqty{width:62px;}
  .orderroot.size-l .owrap{grid-template-columns:repeat(2,1fr);}   /* 大号：电脑改两栏，图片更大更清楚 */
  @media(max-width:920px){.orderroot.size-l .owrap,.orderroot.size-m .owrap{grid-template-columns:1fr;}}
  .otbl td.oqty input{width:100%;border:0;text-align:center;font-family:inherit;font-size:13px;font-weight:700;background:transparent;padding:6px 2px;box-sizing:border-box;}
  .otbl th.odel,.otbl td.odel{width:30px;text-align:center;padding:2px;}
  .otbl input:focus,.otbl textarea:focus{outline:2px solid var(--gold);outline-offset:-2px;background:#FFFBEB;}
  .otbl tr.odiv td{color:#fff;text-align:center;font-weight:800;letter-spacing:1px;padding:5px;}
  .otbl .odivdel{border-color:rgba(255,255,255,.6);color:#fff;padding:0 5px;margin-left:6px;}
  .opre{font-size:10px;font-weight:700;color:#b45309;background:#fef3c7;border-radius:4px;padding:1px 5px;margin-left:4px;}
  .oadd{margin-top:6px;}
  @media print{.top,.sidebar,#sidebar,.seg,.hint,.obanner ~ div,.oadd,.odel,.odivdel{display:none !important;}.owrap{grid-template-columns:repeat(3,1fr);}}
  /* 中央厨房 · 生产成本格子 */
  .pctbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff;min-width:640px;}
  .pctbl th,.pctbl td{border:1px solid #333;padding:6px 8px;white-space:nowrap;}
  .pctbl thead th{position:sticky;top:0;background:#E8EDF3;color:#12203A;font-weight:800;text-align:center;z-index:2;}
  .pctbl td.pcid{background:#F3F6FB;text-align:center;}
  .pctbl td.pcname{background:#EDF2F9;text-align:left;font-weight:700;min-width:190px;white-space:normal;}
  .pctbl td.pcnum{padding:0;}
  .pctbl td.pcnum input{width:100%;border:0;text-align:center;font:inherit;font-weight:700;background:transparent;padding:8px 4px;box-sizing:border-box;}
  .pctbl td.pcnum input:focus{outline:2px solid var(--gold);outline-offset:-2px;background:#FFFBEB;}
  .pctbl td.pcresult{font-weight:800;text-align:right;background:#FAFBFC;color:#0f766e;}
  .pctbl td.pcedit{padding:0;}
  .pctbl td.pcedit input{width:100%;border:0;text-align:center;font:inherit;background:transparent;padding:6px 6px;box-sizing:border-box;}
  .pctbl td.pcname.pcedit input{text-align:left;font-weight:700;}
  .pctbl td.pcedit input:focus{outline:2px solid var(--gold);outline-offset:-2px;background:#FFFBEB;}
  .pctbl td.pcdel{text-align:center;width:36px;background:#fff;}
  /* 订单详情编辑表 */
  .odtbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .odtbl th,.odtbl td{border:1px solid var(--line);padding:5px 7px;}
  .odtbl thead th{background:#EDF2F9;color:#12203A;font-weight:800;}
  .odtbl td.c,.odtbl th.c{text-align:center;}
  .odtbl td.odnum,.odtbl input.odnum{}
  .odtbl input.odnum{width:100%;border:1px solid var(--line);border-radius:5px;text-align:center;font:inherit;padding:5px 4px;box-sizing:border-box;}
  .odtbl input.odnum:focus{outline:2px solid var(--gold);outline-offset:-2px;background:#FFFBEB;}
  .odtbl tfoot td{background:#F2F4F7;}
  /* Invoice 单据 */
  #invoiceDoc{background:#fff;color:#111;padding:18px;font-size:13px;border:1px solid #e2e8f0;border-radius:8px;}
  #invoiceDoc .inv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px;}
  #invoiceDoc .inv-co{font-size:18px;font-weight:800;}
  #invoiceDoc .inv-sub{font-size:12px;color:#555;letter-spacing:1px;}
  #invoiceDoc .inv-meta{text-align:right;font-size:12px;white-space:nowrap;}
  #invoiceDoc .inv-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;margin-bottom:10px;}
  #invoiceDoc .inv-tbl{width:100%;border-collapse:collapse;font-size:12px;}
  #invoiceDoc .inv-tbl th,#invoiceDoc .inv-tbl td{border:1px solid #333;padding:6px 8px;vertical-align:top;}
  #invoiceDoc .inv-tbl th{background:#eef2f7;}
  #invoiceDoc .inv-tbl td.c,#invoiceDoc .inv-tbl th.c{text-align:center;}
  #invoiceDoc .inv-foot{margin-top:12px;font-size:12px;}
  #invoiceDoc .inv-sign{display:flex;justify-content:space-between;gap:20px;margin-top:40px;text-align:center;}
  @media print{
    body.inv-print>*{display:none !important;}
    body.inv-print #mbg{display:block !important;position:static !important;background:#fff !important;padding:0 !important;}
    body.inv-print #mbg .m{position:static !important;transform:none !important;box-shadow:none !important;max-width:100% !important;width:100% !important;max-height:none !important;margin:0 !important;border:0 !important;padding:0 !important;overflow:visible !important;}
    body.inv-print #mbg .m>div{max-height:none !important;overflow:visible !important;}
    body.inv-print .noprint{display:none !important;}
    body.inv-print #invoiceDoc{border:0 !important;}
  }
  .gtbl td.gtot{background:#FAFBFC;font-weight:700;text-align:right;padding:6px 8px;}
  .gtbl tr.gsum td{background:#F2F4F7;font-weight:800;padding:6px 8px;}
  .gtbl td.gdate,.gtbl th.gdate{position:sticky;left:0;z-index:2;min-width:64px;max-width:64px;text-align:center;box-shadow:1px 0 0 #333;background:#fff;}
  .gtbl thead th.gdate{z-index:4;background:#E8EDF3;}
  .top .r{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  .sel{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:6px 8px;font-size:12px;font-weight:600;}
  .sel option{color:#000;}
  .role-chip{font-size:10.5px;padding:3px 8px;border-radius:20px;background:var(--brand2);font-weight:700;}
  .lang{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer;}
  /* layout */
  .wrap{max-width:1060px;margin:0 auto;padding:14px;}
  .page{display:none;} .page.active{display:block;animation:f .2s;}
  @keyframes f{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
  @keyframes su{from{transform:translateY(100%);}to{transform:none;}}
  .h{font-size:13.5px;font-weight:800;color:var(--ink);margin:16px 0 9px;display:flex;align-items:center;gap:7px;letter-spacing:.01em;}
  .h:first-child{margin-top:2px;}
  .h .tag{font-size:10px;font-weight:700;color:var(--grey);background:var(--soft);padding:2px 7px;border-radius:5px;margin-left:auto;}
  .sub{font-size:11.5px;color:var(--grey);font-weight:400;margin-left:4px;}
  /* kpi */
  .grid{display:grid;gap:10px;}
  .g2{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(3,1fr);}.g4{grid-template-columns:repeat(2,1fr);}
  @media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr);}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;}
  .kpi .k{font-size:11px;color:var(--grey);font-weight:600;margin-bottom:5px;}
  .kpi .v{font-size:19px;font-weight:800;letter-spacing:-.01em;}
  .kpi .v.sm{font-size:15px;}
  .kpi .s{font-size:10.5px;margin-top:3px;font-weight:600;}
  .pos{color:var(--green);}.neg{color:var(--red);}.warnc{color:var(--amber);}
  /* pl */
  .pl{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 15px;}
  .pl .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--soft);font-size:13px;}
  .pl .row:last-child{border-bottom:none;}
  .pl .row.tot{font-weight:800;font-size:15px;border-top:2px solid var(--ink);border-bottom:none;padding-top:10px;margin-top:2px;}
  .pl .row.ind span:first-child{padding-left:12px;color:var(--ink2);}
  .pl .r-neg{color:var(--red);}
  /* card list */
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  .tbl{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
  th{background:#FAFBFC;color:var(--grey);font-weight:700;text-align:left;padding:9px 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);position:sticky;top:0;}
  td{padding:9px 11px;border-bottom:1px solid var(--soft);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .mini{font-size:10.5px;color:var(--grey);font-weight:400;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
  .p-g{background:#E4F2E8;color:var(--green);}.p-a{background:#FaF0DA;color:var(--amber);}
  .p-r{background:#F7E4E4;color:var(--red);}.p-n{background:#ECEFF3;color:var(--grey);}
  .p-b{background:#E4EDF7;color:var(--blue);}.p-p{background:#EDE7F5;color:var(--purple);}
  /* alert */
  .al{border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid;font-size:12px;}
  .al .t{font-weight:800;margin-bottom:2px;}
  .al-r{background:#FBEEEE;border-color:#Ecc;color:#7a2020;}
  .al-a{background:#FBF4E3;border-color:#EdC;color:#7a5810;}
  .al-b{background:#EAF1F9;border-color:#cDE;color:#1c3d63;}
  /* btn */
  .btn{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn.brand{background:var(--brand);}.btn.gold{background:var(--gold);color:#fff;}

const _cloudWrites={};
function queueCloudWrite(key,val){
  const q=_cloudWrites[key]||(_cloudWrites[key]={pending:null,running:false});
  q.pending=val;            // 连续修改只保留最新值（自动合并）
  flushCloudWrite(key);
}
function flushCloudWrite(key){
  const q=_cloudWrites[key];
  if(!q||q.running||q.pending==null||!CLOUD||!_sb)return;
  const val=q.pending; q.pending=null; q.running=true;
  Promise.resolve(_sb.from(CLOUD_TABLE).upsert({key,value:JSON.parse(val),updated_at:new Date().toISOString()},{onConflict:'key'}))
    .catch(()=>{})
    .finally(()=>{q.running=false; if(q.pending!=null)flushCloudWrite(key);}); // 期间又有新改动就接着写
}

/* ---------- cost helpers ---------- */
function findItem(name){return d().items.find(i=>i.name===name);}
function findSub(name){return d().subRecipes.find(s=>s.name===name);}
function netCost(it){return it.cost/((it.yield||100)/100);} // 得率后净料成本
function subCost(sub){ // 半成品单位成本
  const total=sub.ing.reduce((s,ig)=>{const it=findItem(ig.n);return s+(it?netCost(it)*ig.q:0);},0);
  return sub.yieldQty?total/sub.yieldQty:0;
}

  return r.ing.reduce((s,ig)=>{
    if(ig.sub){const sub=findSub(ig.n);return s+(sub?subCost(sub)*ig.q:0);}
    const it=findItem(ig.n);return s+(it?netCost(it)*ig.q:0);
  },0);
}

/* ================= 库存联动引擎 =================
   进货 → 加库存(加权平均成本+批次)；报废/调出/销售(BOM) → 扣库存。
   全部经由这里改动 items.qty，采购/报废/调拨/销售任何增删改都会实时反映。 */
function invItem(name){return (d().items||[]).find(i=>i.name===name);}
function invReceive(name,qty,amount,unit,exp,date){ // 进货入库
  qty=+qty||0;if(!qty)return;
  let it=invItem(name);
  if(!it){it={id:Math.max(0,...(d().items||[]).map(i=>i.id),0)+1,name,unit:unit||'pcs',buyUnit:'',conv:1,qty:0,cost:0,cat:'其他',par:0,yield:100,batches:[]};(d().items=d().items||[]).push(it);}
  const nq=it.qty+qty;
  if(amount!=null&&qty>0)it.cost=+(((it.qty*it.cost)+(+amount||0))/(nq||1)).toFixed(4);
  it.qty=+nq.toFixed(3);
  if(exp){it.batches=it.batches||[];it.batches.push({qty,exp,in:date||TODAY});}
}
function invReduce(name,qty){ // 出库/扣减（FIFO 扣批次）
  qty=+qty||0;if(!qty)return;
  const it=invItem(name);if(!it)return;
  it.qty=+(it.qty-qty).toFixed(3);
  let rem=qty;(it.batches||[]).sort((a,b)=>new Date(a.exp)-new Date(b.exp));
  for(const b of (it.batches||[])){if(rem<=0)break;const dd=Math.min(b.qty,rem);b.qty-=dd;rem-=dd;}
  it.batches=(it.batches||[]).filter(b=>b.qty>0.0001);
}
// 反做一笔进货（编辑/删除时用）：扣回数量（成本不追溯还原）
function invUnreceive(name,qty){invReduce(name,qty);}
// 一份销量对应的「食材消耗表」（展开多级 BOM）
function salesConsumption(salesArr){
  const map={};const b=d();
  (salesArr||[]).forEach(s=>{const rp=(b.recipes||[]).find(x=>x.id===s.recipeId);if(!rp)return;const q=+s.qty||0;
    rp.ing.forEach(ig=>{
      if(ig.sub){const sub=(b.subRecipes||[]).find(x=>x.name===ig.n);if(sub&&sub.yieldQty){const per=ig.q/sub.yieldQty;sub.ing.forEach(si=>{map[si.n]=(map[si.n]||0)+si.q*per*q;});}}
      else{map[ig.n]=(map[ig.n]||0)+ig.q*q;}
    });
  });
  return map;
}
// 应用销量变化对库存的差量（新-旧）：POS/手动录销量共用
function applySalesDelta(oldArr,newArr){
  const o=salesConsumption(oldArr),n=salesConsumption(newArr);
  new Set([...Object.keys(o),...Object.keys(n)]).forEach(nm=>{const delta=(n[nm]||0)-(o[nm]||0);if(delta>0)invReduce(nm,delta);else if(delta<0)invReceive(nm,-delta,null);});
}

/* ===== 销售驱动的营收与成本（★ 联动核心 ★）=====
   营业额 = Σ(菜价 × 销量)；COGS = Σ(配方成本 × 销量)。
   改进货成本→加权单价变→recipeCost变→COGS变→净利变。全链联动。
   未来接 POS：只需让 salesData() 回传 POS 推送的销量。 */
function salesData(){return d().sales||[];}
function outletRevenue(id){const b=DB[id];if(!b)return 0;const s=b.sales||[];if(s.length){return s.reduce((sum,row)=>{const r=(b.recipes||[]).find(x=>x.id===row.recipeId);return sum+(r?r.price*row.qty:0);},0);}return 0;}
function calcRevenue(){ // 含税营业额（由销量×菜价，回退到 posGross）
  const s=salesData();
  if(s.length){return s.reduce((sum,row)=>{const r=(d().recipes||[]).find(x=>x.id===row.recipeId);return sum+(r?r.price*row.qty:0);},0);}
  return 0;
}
/* ===== 成本核算方式（明记：主力单点/煮炒做BOM + 杂饭小菜月度核算）=====
   rate   ①成本率法：COGS = 净营业额 × 成本率%（当天/平时快速估算）
   period ②进销存实耗法：COGS = 月初库存 + 本月进货 − 月末库存（月底结真账，最准）
   bom    ③配方法：COGS = Σ(配方成本 × 销量)（招牌菜单品毛利）*/
function costCfg(){
  const c=(d().costConfig)||{};
  return {mode:c.mode||'rate', rate:(c.rate!=null?c.rate:35), openStock:+c.openStock||0, closeStock:+c.closeStock||0, purOverride:(c.purOverride===''||c.purOverride==null)?null:+c.purOverride};
}
function monthPurchases(){ // 本月进货金额（自动：采购进货 type=in，按当前核算月）
  const m=costMonth||TODAY.slice(0,7);
  let sum=0;
  (d().moves||[]).forEach(r=>{if(r.type==='in'&&String(r.date||'').slice(0,7)===m)sum+=(+r.amt||0);});
  (d().purchases||[]).forEach(r=>{if(String(r.date||'').slice(0,7)===m)sum+=(+r.price||0);});
  return sum;
}
function calcCOGS(){ // 依成本核算方式返回（整期金额，calcFin 再按日/周/月缩放）
  const cfg=costCfg();
  if(cfg.mode==='rate'){ return (calcRevenue()/1.06)*(cfg.rate/100); }
  if(cfg.mode==='period'){ const pur=cfg.purOverride!=null?cfg.purOverride:monthPurchases(); return Math.max(0, cfg.openStock + pur - cfg.closeStock); }
  const s=salesData(); // bom
  return s.reduce((sum,row)=>{const r=(d().recipes||[]).find(x=>x.id===row.recipeId);return sum+(r?recipeCost(r)*row.qty:0);},0);
}
async function setCostMode(m){const x=d();x.costConfig=x.costConfig||{};x.costConfig.mode=m;await save();render();}
async function setCostParam(f,v){const x=d();x.costConfig=x.costConfig||{};x.costConfig[f]=v;await save();render();}
function calcFin(){
  const x=d();const mult=dashRange==="day"?1/30:dashRange==="week"?7/30:1;
  const gross=calcRevenue()*mult;            // ← 由销量×菜价（未来=POS）
  const net=gross/1.06, sst=gross-net;       // 剥离 6% SST
  const cogs=calcCOGS()*mult;                // ← 真实食材成本（销量×BOM）
  const grossProfit=net-cogs;
  const waste=x.moves.filter(m=>m.type==='waste').reduce((s,m)=>s+m.amt,0)*mult;
  const ent=x.moves.filter(m=>m.type==='ent').reduce((s,m)=>s+m.amt,0)*mult;
  const op=x.opex;const opex=Object.values(op||{}).reduce((s,v)=>s+(+v||0),0)*mult;
  const netProfit=grossProfit-waste-ent-opex;
  return {gross,net,sst,cogs,grossProfit,waste,ent,opex,netProfit,foodPct:net?cogs/net*100:0,netPct:net?netProfit/net*100:0};
}

/* ================= 月度核算引擎（按自然月独立联动，9月对9月）================= */
let costMonth = TODAY.slice(0,7);
function setCostMonth(m){costMonth=m;render();window.scrollTo(0,0);}
function monthLabel2(m){if(!m)return '';const[y,mm]=m.split('-');return LANG==="zh"?(y+"年"+(+mm)+"月"):m;}
function availMonths(){const s=new Set([costMonth,TODAY.slice(0,7)]);(d().purchases||[]).forEach(r=>{if(r.date)s.add(r.date.slice(0,7));});Object.keys(d().monthlySales||{}).forEach(m=>s.add(m));Object.keys(d().monthClose||{}).forEach(m=>s.add(m));Object.keys(d().opexByMonth||{}).forEach(m=>s.add(m));return [...s].filter(Boolean).sort().reverse();}
function monthLocked(m){const mc=(d().monthClose||{})[m];return !!(mc&&mc.locked);}
function monthAvgPrice(month,item){ // 原料当月加权平均进价（锁定后取归档值）
  const mc=(d().monthClose||{})[month];
  if(mc&&mc.locked&&mc.avgPrices&&(item in mc.avgPrices))return mc.avgPrices[item];
  let amt=0,qty=0;(d().purchases||[]).forEach(r=>{if((r.date||'').slice(0,7)===month&&r.item===item){amt+=(+r.price||0);qty+=(+r.qty||0);}});
  return qty?amt/qty:0;
}
/* 修复工具：把每个品项的加权成本，改成用某个月份的实际进货记录重算出来的月均价。
   monthAvgPrice 是直接从 d().purchases 原始记录算的，不受库存那边加权成本被污染影响，
   用来「重置」被污染的加权成本很干净。只会改有当月进货记录的品项，没有记录的不动。 */
function recalcCostForm(){
  const zh=LANG==="zh";
  openForm(`<h3>🔧 ${zh?"用月均价重算加权成本":"Recalc weighted cost from month avg"} <span class="x" onclick="closeM()">×</span></h3>
    <div class="mini" style="margin-bottom:10px;">${zh?"只会改「这个月有进货记录」的品项：把它的加权成本改成这个月的实际采购总额 ÷ 总数量。没有进货记录的品项不会被改动。适合用来修正之前因为操作/系统问题被弄错的成本。":"Only affects items purchased in this month: cost is reset to (total amount ÷ total qty) for that month."}</div>
    <div class="fr"><label>${zh?"月份 (YYYY-MM)":"Month"}</label><input id="rc_month" value="${TODAY.slice(0,7)}"></div>
    <button class="btn block brand" onclick="recalcCostRun()">✅ ${zh?"确认重算":"Recalculate"}</button>`);

async function recalcCostRun(){
  const zh=LANG==="zh";const month=(document.getElementById('rc_month')?.value||'').trim();
  if(!/^\d{4}-\d{2}$/.test(month)){alert(zh?"月份格式要 YYYY-MM":"Format must be YYYY-MM");return;}
  if(!confirm(zh?`确定用 ${month} 的月均价重算所有有进货记录的品项成本？这会覆盖它们目前的加权成本。`:`Recalculate cost for items purchased in ${month}? This overwrites their current weighted cost.`))return;
  const items=d().items||[];let n=0;
  items.forEach(it=>{const avg=monthAvgPrice(month,it.name);if(avg>0){it.cost=+avg.toFixed(4);n++;}});
  await save();closeM();render();
  alert((zh?`已用 ${month} 的月均价重算了 ${n} 个品项的加权成本。`:`Recalculated ${n} items using ${month} average.`));
}
function monthMaterials(month){ // 当月采购原料汇总
  const m={};(d().purchases||[]).forEach(r=>{if((r.date||'').slice(0,7)!==month)return;const k=r.item||'—';if(!m[k])m[k]={item:k,qty:0,amt:0};m[k].qty+=(+r.qty||0);m[k].amt+=(+r.price||0);});
  return Object.values(m).map(x=>({...x,avg:x.qty?x.amt/x.qty:0})).sort((a,b)=>b.amt-a.amt);
}
function dishCostForMonth(dc,month){ // 菜品当月成本=Σ(关联原料 当月均价×用量)+Σ(未关联=固定配料)
  const mc=(d().monthClose||{})[month];
  if(mc&&mc.locked&&mc.dishCost&&(dc.id in mc.dishCost))return mc.dishCost[dc.id];
  return (dc.ing||[]).reduce((s,ig)=>{if(ig.link)return s+monthAvgPrice(month,ig.link)*(+ig.qty||0);return s+(+ig.cost||0);},0);
}
function monthSales(month){return (d().monthlySales||{})[month]||[];}
function monthlyPnL(month){ // 月度损益（当月菜品成本×当月销量）
  const dishes=d().dishCosts||[];const ms=monthSales(month);let rev=0,cogs=0;
  ms.forEach(s=>{const dc=dishes.find(x=>x.id===s.dishId);if(!dc)return;const q=+s.qty||0;rev+=(+dc.price||0)*q;cogs+=dishCostForMonth(dc,month)*q;});
  const gp=rev-cogs;const mc=(d().monthClose||{})[month];const opex=(mc&&mc.locked&&mc.opex!=null)?mc.opex:opexTotal(month);const net=gp-opex;
  return {rev,cogs,gp,opex,net,margin:rev?gp/rev*100:0,foodPct:rev?cogs/rev*100:0,netPct:rev?net/rev*100:0,orders:ms.reduce((a,s)=>a+(+s.qty||0),0)};
}
async function lockMonth(month){
  if(!confirm(LANG==="zh"?`锁定 ${monthLabel2(month)} 的月度成本？锁定后该月原料均价与菜品成本归档固定，历史查询恒用此值，绝不串月。`:`Lock ${month}?`))return;
  const avgPrices={};monthMaterials(month).forEach(x=>{avgPrices[x.item]=+x.avg.toFixed(4);});
  const dishCost={};(d().dishCosts||[]).forEach(dc=>{dishCost[dc.id]=+dishCostForMonth(dc,month).toFixed(4);});
  if(!d().monthClose)d().monthClose={};
  d().monthClose[month]={locked:true,date:TODAY,avgPrices,dishCost,opex:opexTotal(month),pnl:monthlyPnL(month)};
  auditLog("月度锁定",monthLabel2(month),"","");await save();render();
}
async function unlockMonth(month){if(!confirm(LANG==="zh"?`解锁 ${monthLabel2(month)}？改回按实时采购数据计算。`:`Unlock ${month}?`))return;if(d().monthClose&&d().monthClose[month]){delete d().monthClose[month];auditLog("解锁月度",monthLabel2(month),"","");await save();render();}}

/* ================= 人事薪资 Payroll（个人明细）================= */
function empGross(e){return e.basic+e.allowance+e.ot;}
function empNet(e){return empGross(e)-e.epf-e.socso-e.eis;}
/* 人工成本从人事薪资汇总（供 OpEx 联动）*/
/* 人工成本 = 用『薪资发放 Payroll』同一套马来西亚法定引擎(computeRow)算，
   使运营开销的人工成本 与 Payroll 的雇主总成本 完全一致。
   salaries=底薪+津贴+奖励；ot=加班额；epf/socso/eis=雇主承担；levy=人头税。 */
function payrollLabour(month){
  month=month||(typeof costMonth!=='undefined'?costMonth:TODAY.slice(0,7));
  const prev=(typeof payrunMonth!=='undefined')?payrunMonth:null;
  if(typeof payrunMonth!=='undefined')payrunMonth=month;
  let salaries=0,ot=0,epf=0,socso=0,eis=0,levy=0;
  (d().staff||[]).forEach(e=>{const c=computeRow(e);salaries+=c.basic+c.allowance+c.incentive;ot+=c.otAmt;epf+=c.epf.er;socso+=c.soc.er;eis+=c.eis.er;levy+=c.levy;});
  if(prev!=null)payrunMonth=prev;
  const r2=n=>+(+n).toFixed(2);
  return {salaries:r2(salaries),ot:r2(ot),epf:r2(epf),socso:r2(socso),eis:r2(eis),levy:r2(levy)};
}
/* ---- 按自然月独立的运营开销 ----
   d().opex 作为「默认模板」（新月份的初始值、大盘/ALL 聚合回退）；
   d().opexByMonth[YYYY-MM] 为该月专属副本，一旦编辑/同步某月即建立，互不串月。 */
function opexTemplate(){if(!d().opex)d().opex={};return d().opex;}
function curOpex(month){month=month||costMonth;const bm=d().opexByMonth;if(bm&&bm[month])return bm[month];return opexTemplate();}
function materializeOpex(month){ // 首次编辑某月→从"≤当月的最近已建月"或默认模板复制一份
  month=month||costMonth;
  if(!d().opexByMonth)d().opexByMonth={};
  if(!d().opexByMonth[month]){
    const prev=Object.keys(d().opexByMonth).filter(m=>m<month).sort();
    const src=prev.length?d().opexByMonth[prev[prev.length-1]]:opexTemplate();
    d().opexByMonth[month]=JSON.parse(JSON.stringify(src));
  }
  return d().opexByMonth[month];
}
function opexTotal(month){const o=curOpex(month)||{};return Object.values(o).reduce((s,v)=>s+(+v||0),0);}
const LABOUR_KEYS=["salaries","ot","epf","socso","eis","levy"];
function applyLabour(o,pl){o.salaries=pl.salaries;o.ot=pl.ot;o.epf=pl.epf;o.socso=pl.socso;o.eis=pl.eis;o.levy=pl.levy;}
function autoSyncLabour(){ // 员工薪资变动→自动更新「默认模板 + 当前未锁定月」的人工成本（其他手动项与其它月不动）
  const pl=payrollLabour();
  applyLabour(opexTemplate(),pl);
  const bm=d().opexByMonth;
  if(bm&&bm[costMonth]&&!monthLocked(costMonth))applyLabour(bm[costMonth],pl);
}
async function syncOpexFromPayroll(){
  if(monthLocked(costMonth))return alert(LANG==="zh"?"本月已月末锁定，请先解锁再同步。":"Month is locked.");
  if(!confirm(LANG==="zh"?("用人事薪资的实际数据填入【"+monthLabel2(costMonth)+"】运营开销的人工成本（薪资/EPF/SOCSO/EIS/人头税/OT）？之后仍可手动微调。"):"Fill labour OpEx from payroll?"))return;
  const pl=payrollLabour();const o=materializeOpex(costMonth);applyLabour(o,pl);applyLabour(opexTemplate(),pl);
  auditLog("同步人工成本","人事薪资→OpEx "+monthLabel2(costMonth),"",money(pl.salaries+pl.ot+pl.epf+pl.socso+pl.eis+pl.levy));await save();render();}

  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');

/* 打卡考勤（GPS 3km 范围内才能打卡）*/
function haversine(la1,lo1,la2,lo2){const R=6371;const dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function pgAttend(){

  <div class="hint">📍 ${LANG==="zh"?"只有在门市 3 公里范围内才能打卡（GPS 定位验证）。":"Clock-in only within 3km of the outlet (GPS verified)."}</div>
  <div class="card" style="padding:16px;text-align:center;margin-bottom:12px;">
    <div class="mini" style="margin-bottom:10px;">${LANG==="zh"?"门市位置":"Outlet"}: ${nm(o)} (${(o.lat||0).toFixed(4)}, ${(o.lng||0).toFixed(4)})</div>
    <div id="gpsStatus" class="mini" style="margin-bottom:12px;color:var(--grey);">${LANG==="zh"?"点下方按钮定位并打卡":"Tap to locate & clock in"}</div>
    <button class="btn brand block" onclick="doClockIn()">📍 ${LANG==="zh"?"定位打卡":"GPS Clock In/Out"}</button>
  </div>
  <h2 class="h">📋 ${LANG==="zh"?"考勤记录":"Records"}</h2>
  <div class="card tbl"><table><thead><tr><th>${LANG==="zh"?"员工":"Staff"}</th><th>${LANG==="zh"?"日期":"Date"}</th><th>${LANG==="zh"?"上班":"In"}</th><th>${LANG==="zh"?"下班":"Out"}</th><th>${LANG==="zh"?"时数":"Hrs"}</th></tr></thead><tbody>
  ${att.map(a=>{const e=empById(a.empId);return `<tr><td>${e?e.name:a.empId}</td><td class="mini">${a.date.slice(5)}</td><td>${a.in}</td><td>${a.out||'—'}</td><td>${a.hours?a.hours.toFixed(1):'—'}</td></tr>`;}).join('')||`<tr><td colspan="5" class="empty">${LANG==="zh"?"暂无记录":"No records"}</td></tr>`}

function doClockIn(){
  const st=document.getElementById('gpsStatus');
  const o=outletObj();
  if(!navigator.geolocation){st.innerHTML="⚠️ "+(LANG==="zh"?"此设备不支持定位":"No geolocation");return;}
  st.innerHTML=(LANG==="zh"?"定位中…":"Locating…");
  navigator.geolocation.getCurrentPosition(async pos=>{
    const dist=haversine(pos.coords.latitude,pos.coords.longitude,o.lat,o.lng);
    if(dist<=3){
      const now=new Date();const hhmm=now.toTimeString().slice(0,5);
      if(!d().attendance)d().attendance=[];
      const today=d().attendance.find(a=>a.empId===currentEmpId()&&a.date===TODAY);
      if(today&&!today.out){today.out=hhmm;today.hours=+( (parseInt(hhmm)-parseInt(today.in)) ).toFixed(1);st.innerHTML="✅ "+(LANG==="zh"?"下班打卡成功":"Clock-out OK")+` (${dist.toFixed(2)}km)`;}
      else{d().attendance.unshift({empId:currentEmpId(),date:TODAY,in:hhmm,out:"",hours:0});st.innerHTML="✅ "+(LANG==="zh"?"上班打卡成功":"Clock-in OK")+` (${dist.toFixed(2)}km)`;}
      auditLog("GPS打卡",nm(o)+" "+dist.toFixed(2)+"km","","");await save();setTimeout(render,900);
    }else{
      st.innerHTML="❌ "+(LANG==="zh"?`距门市 ${dist.toFixed(1)}km，超出 3km 范围，无法打卡`:`${dist.toFixed(1)}km away, outside 3km`);
    }
  },err=>{st.innerHTML="⚠️ "+(LANG==="zh"?"无法取得定位（请允许定位权限）":"Location denied");});
}

/* 提示音：一声“叮”，响亮 + 约2秒余音（像手机信息提示，WebAudio，无需音频文件）*/
function primeAudio(){try{_audioCtx=_audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(_audioCtx.state==='suspended')_audioCtx.resume();}catch(e){}}
function playBeep(){
  try{primeAudio();if(!_audioCtx)return;const ctx=_audioCtx,now=ctx.currentTime;
    const master=ctx.createGain();master.connect(ctx.destination);
    master.gain.setValueAtTime(0.0001,now);
    master.gain.exponentialRampToValueAtTime(0.85,now+0.015);   // 响亮起音
    master.gain.exponentialRampToValueAtTime(0.0001,now+2.0);   // 约2秒余音
    [[988,1],[1319,0.55],[1976,0.28]].forEach(([f,v])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(master);o.start(now);o.stop(now+2.05);});
    try{if(navigator.vibrate)navigator.vibrate([300,120,300]);}catch(e){}
  }catch(e){}
}
async function reqNotify(){

  let p=Notification.permission;
  if(p!=='granted'){try{p=await Notification.requestPermission();}catch(e){}}
  if(p!=='granted'){alert(LANG==="zh"?"未开启通知。请到手机/浏览器设置里，允许本网站发送通知后再试。":"Not granted.");updateBell();return;}
  playBeep();

  else{const why={perm:'通知权限未允许',db:'写入订阅失败：'+(r&&r.msg||''),err:'出错：'+(r&&r.msg||''),unsupported:'此浏览器不支持推送',nocloud:'未连接云端',role:'此角色不接收（仅老板/区域副经理）'}[r&&r.reason]||'未知';
    alert((LANG==="zh"?"⚠️ 通知已开，但后台推送登记未成功：":"Push register failed: ")+why+(LANG==="zh"?"\n\n（App开着仍会响铃提醒；后台推送需在手机上、且已『加到主画面』再试）":""));}
  updateBell();
}
let _swReg=null;
function fireNotify(order,extra){

/* 按订单ID逐单去重：每一张新单都会响铃+弹通知（不再只弹第一次）*/
function notifyNewOrders(silent){
  updateBell();

  const done=getNotified();
  const fresh=ORDERS.filter(o=>o&&o.id&&!done[o.id]);
  if(!fresh.length)return;
  fresh.forEach(o=>done[o.id]=1);setNotified(done);
  if(silent)return; // 登录首次：只标记已有订单为已通知，不弹（避免刷屏）
  fresh.sort((a,b)=>a.ts-b.ts);const latest=fresh[fresh.length-1];

  bn.innerHTML=`<div class="t">🔔 ${LANG==="zh"?"新订单":"New order"}${fresh.length>1?` ×${fresh.length}`:''}</div>${(latest.by&&latest.by.name||'')} · ${latest.supplier?oEsc(latest.supplier)+' · ':''}${latest.outletName}`;

function urlB64ToUint8Array(b64){const pad='='.repeat((4-b64.length%4)%4);const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(s);const arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return arr;}
async function enablePushSub(){
  try{
    if(!('serviceWorker'in navigator)||!('PushManager'in window))return{ok:false,reason:'unsupported'};
    if(!VAPID_PUBLIC||!AUTH())return{ok:false,reason:'nocloud'};
    if(!['owner','area','hrmgr'].includes(curRole))return{ok:false,reason:'role'};
    if(!('Notification'in window)||Notification.permission!=='granted')return{ok:false,reason:'perm'};
    const reg=_swReg||await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8Array(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const {error}=await _sb.from('erp_push_subs').upsert({endpoint:j.endpoint,sub:j,email:(curUser&&curUser.email)||'',role:curRole,updated_at:new Date().toISOString()},{onConflict:'endpoint'});
    if(error)return{ok:false,reason:'db',msg:error.message};
    return{ok:true};
  }catch(e){return{ok:false,reason:'err',msg:String(e&&e.message||e)};}
}
async function sendOrderPush(order){

    const title=(LANG==="zh"?'🔔 新订单 New Order':'🔔 New Order');
    const body=(order.by&&order.by.name||'')+' · '+(order.supplier?order.supplier+' · ':'')+order.outletName+' · '+((order.lines||[]).length+(order.uniform||[]).length)+(LANG==="zh"?' 项':' items');
    await fetch(PUSH_FN_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({title,body,icon:BH_ICON})});
  }catch(e){}
}

  const day=new Date().toLocaleDateString('en-CA').replace(/-/g,'');
  const n=ORDERS.filter(o=>o.invoiceNo&&o.invoiceNo.indexOf('INV-'+day)===0).length+1;
  return 'INV-'+day+'-'+String(n).padStart(3,'0');
}
async function confirmOrder(id){
  if(!canConfirmOrder()){alert(LANG==="zh"?"只有区域副经理及以上可确认。":"Only Area Manager & above.");return;}
  if(!confirm(LANG==="zh"?"确定此订单？确认后可创建 Invoice。":"Confirm this order?"))return;
  await orderEditFlush();const o=orderById(id);if(!o){openOrdersPanel();return;}
  o.status='confirmed';if(!o.invoiceNo)o.invoiceNo=nextInvoiceNo();
  o.confirmedBy=curUser?curUser.name:ROLES[curRole].name;o.confirmedAt=Date.now();
  await saveOrders();
  try{if(typeof auditLog==='function')auditLog(LANG==="zh"?"订单确认":"Order confirmed",(o.supplier||o.outletName||'')+" · "+o.invoiceNo,"","");}catch(e){}
  openOrderDetail(id);
}

function isCkOrderSup(s){return (s||'').toUpperCase().includes('TCY OKR');}
function osData(sup){
  d().orderSheets=d().orderSheets||{};

    const cat=ensureGridCat(sup);
    d().orderSheets[sup]=cat.map(c=>({d:(c.code?c.code+' · ':'')+c.name+(c.spec?('\n'+c.spec):''),q:'',code:c.code||''}));
  }
  return d().orderSheets[sup];
}

function setOsDesc(sup,i,v){osData(sup)[i].d=v;osSave();}

async function submitSheetOrder(sup){
  const a=osData(sup);

  if(!lines.length){alert(LANG==="zh"?"请先填数量再下单。":"Enter quantities first.");return;}
  if(!confirm((LANG==="zh"?("确定向 "+sup+" 下单？共 "+lines.length+" 项。"):("Order to "+sup+"? "+lines.length+" items."))))return;
  if(!confirm((LANG==="zh"?"再次确认：提交后会通知老板与区域副经理。确定提交？":"Confirm again: owner & area manager notified. Submit?")))return;

/* ---------- 中央厨房 · 生产成本（格子式：大锅成本 ÷ 包数 = 单包成本）---------- */
function prodCentralSup(){return (supplierList().map(v=>v.name).find(isCkOrderSup))||'(中央)TCY OKR SB';}
function prodStore(){return DB['ck']||d();}
function prodCostMap(){const s=prodStore();s.prodCost=s.prodCost||{};return s.prodCost;}
let _pcT=null;
function prodSave(){if(_pcT)clearTimeout(_pcT);_pcT=setTimeout(()=>{_pcT=null;save('ck');},400);}
function prodRow(name){const m=prodCostMap();m[name]=m[name]||{batch:'',packs:''};return m[name];}
function prodPer(name){const r=prodRow(name);const b=+r.batch||0,p=+r.packs||0;return p>0?b/p:0;}
function prodRecalc(name,i){const el=document.getElementById('pcr-'+i);if(el)el.textContent=money(prodPer(name));}
function setProdBatch(name,i,v){prodRow(name).batch=v;prodRecalc(name,i);prodSave();}
function setProdPacks(name,i,v){prodRow(name).packs=v;prodRecalc(name,i);prodSave();}

function setPcUom(name,v){const c=ensureGridCat(prodCentralSup()).find(x=>x.name===name);if(c)c.uom=v;prodSave();}
function setPcSpec(name,v){const c=ensureGridCat(prodCentralSup()).find(x=>x.name===name);if(c)c.spec=v;prodSave();}

function permLabel(m){const x=PERM_MODULES.find(p=>p[0]===m);return x?(LANG==="zh"?x[1]:x[2]):m;}
async function togglePerm(role,mod,checked){
  if(!canEditPerms()){alert(LANG==="zh"?"你没有权限修改岗位权限。":"No permission to edit roles.");render();return;}
  const r=ROLES[role];if(!r)return;
  if(!checked){
    if(mod==='settings'&&r.canEditPerms){alert(LANG==="zh"?"为避免锁死系统，不能移除管理角色的『系统设置』权限。":"Cannot remove Settings from an admin role.");render();return;}
    r.can=r.can.filter(x=>x!==mod);
  }else if(!r.can.includes(mod)){r.can.push(mod);}
  auditLog("修改岗位权限",(LANG==="zh"?r.name:r.en)+" · "+permLabel(mod)+" "+(checked?(LANG==="zh"?"授予":"grant"):(LANG==="zh"?"移除":"revoke")),"","");
  await saveRolePerms();render();
}
async function resetPerms(){
  if(!canEditPerms())return;
  if(!confirm(LANG==="zh"?"恢复所有岗位为默认权限？":"Reset all roles to defaults?"))return;
  Object.keys(ROLE_DEFAULTS).forEach(k=>{if(ROLES[k])ROLES[k].can=ROLE_DEFAULTS[k].slice();});
  auditLog("重置岗位权限",LANG==="zh"?"恢复默认":"reset to defaults","","");await saveRolePerms();render();
}

let auditBranch='all', auditRole='all';

async function refreshAudit(){if(CLOUD){try{for(const o of OUTLETS)await reloadOutlet(o.id);}catch(e){}}render();}
function inferRole(user){user=user||'';
  if(/店长|Manager/i.test(user))return 'manager';
  if(/厨师长|Head Chef|Chef/i.test(user))return 'headchef';
  if(/区域|Area/i.test(user))return 'area';
  if(/员工|Staff|Siti|Helper|Steward|Server/i.test(user))return 'staff';
  if(/老板|Owner|HR|人事/i.test(user))return 'owner';
  return 'staff';
}
function auditKind(act){act=act||'';
  if(/修改|编辑|更新|调整|edit|update/i.test(act))return {t:LANG==="zh"?"修改":"Edit",c:'p-a'};
  if(/删除|作废|移除|delete|remove/i.test(act))return {t:LANG==="zh"?"删除":"Delete",c:'p-r'};
  if(/新增|添加|导入|入库|申请|排班|进货|生产|借调|调拨|add|new|apply|import/i.test(act))return {t:LANG==="zh"?"新增":"Add",c:'p-g'};
  return {t:LANG==="zh"?"修改":"Edit",c:'p-a'};
}
function buildCrossAudit(){
  const rows=[];
  OUTLETS.forEach(o=>{const b=DB[o.id];if(!b||!b.audit)return;
    b.audit.forEach(a=>{rows.push({...a,_outlet:o.id,_outletName:nm(o),_role:a.roleKey||inferRole(a.user)});});
  });
  rows.sort((x,y)=>String(y.date).localeCompare(String(x.date)));
  return rows;
}

async function saveUser(orig){
  const email=(fv('u_email')||orig||'').toLowerCase();const name=fv('u_name');const role=fv('u_role');const outlet=fv('u_outlet');
  const active=document.getElementById('u_active').checked;
  if(!email){alert(LANG==="zh"?"邮箱必填":"Email required");return;}
  if(orig&&curUser&&orig===curUser.email&&(role!=='owner'&&role!=='area')&&!active){alert(LANG==="zh"?"不能停用或降低自己的管理权限。":"Can't disable/demote yourself.");return;}
  try{const {error}=await _sb.from('erp_users').upsert({email,name,role,outlet,active},{onConflict:'email'});if(error)throw error;
    auditLog("白名单变更",email+" · "+role+" · "+(active?"启用":"停用"),"","");await loadUsers();closeM();render();
  }catch(e){alert((LANG==="zh"?"保存失败：":"Save failed: ")+(e.message||e));}
}
async function delUser(email){
  if(curUser&&email===curUser.email){alert(LANG==="zh"?"不能删除当前登录账号。":"Can't delete yourself.");return;}
  if(!confirm(LANG==="zh"?`确定从白名单移除 ${email}？该账号将无法再登录。`:`Remove ${email}?`))return;
  try{const {error}=await _sb.from('erp_users').delete().eq('email',email);if(error)throw error;
    auditLog("白名单删除",email,"","");await loadUsers();render();
  }catch(e){alert((LANG==="zh"?"删除失败：":"Delete failed: ")+(e.message||e));}
}

function prefill(type,id){
  if(type==='item'){const it=d().items.find(i=>i.id===id);if(!it)return;
    setV('i_name',it.name);setV('i_cat',it.cat);setV('i_unit',it.unit);setV('i_buy',it.buyUnit);setV('i_conv',it.conv);setV('i_yield',it.yield);setV('i_qty',it.qty);setV('i_cost',it.cost);setV('i_par',it.par);setV('i_exp',(it.batches&&it.batches[0])?it.batches[0].exp:'');
    setTitle(LANG==="zh"?"编辑品项":"Edit Item");}
  if(type==='recipe'){const r=d().recipes.find(x=>x.id===id);if(!r)return;
    setV('r_name',r.name);setV('r_price',r.price);if(r.ing&&r.ing[0]){setV('r_ing',r.ing[0].n);setV('r_q',r.ing[0].q);}
    setTitle(LANG==="zh"?"编辑配方":"Edit Recipe");}
  if(type==='emp'){const e=(d().staff||[]).find(x=>x.id===id);if(!e)return;
    const injOpt=(selId,val)=>{const s=document.getElementById(selId);if(s&&val&&![...s.options].some(o=>o.value===val)){const o=document.createElement('option');o.value=val;o.textContent=val;s.appendChild(o);}};
    injOpt('em_role',e.role);injOpt('em_nat',e.nationality||(e.local===false?'缅甸':'马来西亚'));
    setV('em_no',e.empNo||'');setV('em_name',e.name);setV('em_role',e.role);setV('em_nat',e.nationality||(e.local===false?'缅甸':'马来西亚'));setV('em_ic',e.ic||'');setV('em_phone',e.phone||'');setV('em_addr',e.address||'');setV('em_emerg',e.emergency||'');setV('em_joined',e.joined||'');setV('em_marital',e.marital||(e.married?'married':'single'));setV('em_basic',e.basic);setV('em_allow',e.allowance);setV('em_children',+e.children||0);
    setTitle(LANG==="zh"?"编辑员工":"Edit Employee");}
  if(type==='vendor'){const v=d().vendors.find(x=>x.id===id);if(!v)return;
    setV('v_name',v.name);setV('v_terms',v.terms);setTitle(LANG==="zh"?"编辑供应商":"Edit Vendor");}
}
function setV(id,val){const el=document.getElementById(id);if(el)el.value=val;}
function setTitle(txt){const h=document.querySelector('#mbox h3');if(h)h.childNodes[0].textContent=txt+" ";}
function closeM(){document.getElementById('mbg').classList.remove('show');_orderEditing=false;}
document.getElementById('mbg').addEventListener('click',e=>{if(e.target.id==='mbg')closeM();});
function poHint(){const s=document.getElementById('p_item');if(!s)return;const it=findItem(s.value);document.getElementById('poHint').innerHTML=it?`1 ${it.buyUnit} = ${it.conv} ${it.unit} · ${LANG==="zh"?"现价":"now"} ${money(it.cost)}/${it.unit}`:'';}
function stTheory(){const s=document.getElementById('st_item');if(!s)return;const it=findItem(s.value);document.getElementById('st_theory').value=it?it.qty+' '+it.unit:'';}
function sugList(){const list=d().items.filter(i=>i.qty<=i.par).map(i=>{const need=Math.max(0,Math.round(i.par*1.5-i.qty));return `<div class="pl"><div class="row"><span><b>${i.name}</b><br><span class="mini">${LANG==="zh"?"现有":"On-hand"} ${i.qty} · Par ${i.par}</span></span><b class="pos">${LANG==="zh"?"订":"Order"} ${need} ${i.unit}</b></div></div>`;}).join('');document.getElementById('sugList').innerHTML=list||`<div class="empty">✅ ${LANG==="zh"?"库存充足":"All stocked"}</div>`;}

/* ---------- 保存动作 ---------- */
async function saveItem(){
  const n=document.getElementById('i_name').value.trim();if(!n)return alert(LANG==="zh"?"请输入品名":"Name required");
  const qty=+document.getElementById('i_qty').value||0;
  const obj={name:n,cat:document.getElementById('i_cat').value,unit:document.getElementById('i_unit').value,buyUnit:document.getElementById('i_buy').value||'unit',conv:+document.getElementById('i_conv').value||1,qty,cost:+document.getElementById('i_cost').value||0,par:+document.getElementById('i_par').value||0,yield:+document.getElementById('i_yield').value||100};
  if(_editId){const it=d().items.find(i=>i.id===_editId);if(it){Object.assign(it,obj);if(it.batches&&it.batches[0])it.batches[0].exp=document.getElementById('i_exp').value||it.batches[0].exp;auditLog("编辑品项",n,"","");}}
  else{d().items.push({id:Date.now(),...obj,batches:[{qty,exp:document.getElementById('i_exp').value||"2027-01-01",in:TODAY}]});auditLog("新增品项",n,"","+"+qty);}
  await save();closeM();render();
}
async function savePO(){
  const s=document.getElementById('p_item'),name=s.value,unit=s.selectedOptions[0].dataset.unit;
  const qty=+document.getElementById('p_qty').value||0,amt=+document.getElementById('p_amt').value||0;
  const exp=document.getElementById('p_exp').value||"2027-01-01",date=document.getElementById('p_date').value;
  const vendor=document.getElementById('p_vendor').value,terms=+document.getElementById('p_vendor').selectedOptions[0].dataset.terms||30;
  const it=findItem(name);
  if(it&&qty>0){const old=it.cost;const nc=(it.qty*it.cost+amt)/(it.qty+qty);it.cost=+nc.toFixed(2);it.qty+=qty;it.batches.push({qty,exp,in:date});auditLog("进货入库",`${name} +${qty}${unit}`,money(old),money(it.cost));}
  d().moves.unshift({date,type:'in',item:name,qty,unit,amt,note:vendor});
  // 生成应付账款
  const due=new Date(date);due.setDate(due.getDate()+terms);
  d().payables.unshift({id:Date.now(),vendor,po:"PO-"+date.slice(2,4)+date.slice(5,7)+"-"+String(Math.floor(Math.random()*900)+100),amt,date,due:due.toISOString().slice(0,10),status:"未付"});
  await save();closeM();render();
}
async function saveGRN(){
  const name=document.getElementById('g_item').value,qty=+document.getElementById('g_qty').value||0,amt=+document.getElementById('g_amt').value||0,reason=document.getElementById('g_reason').value;
  const it=findItem(name);if(it)it.qty=Math.max(0,it.qty-qty);
  d().moves.unshift({date:TODAY,type:'grn',item:name,qty,unit:it?it.unit:'',amt:-amt,note:reason+" 折让"});
  // 冲减最近一笔应付
  const p=d().payables.find(p=>p.status!=="已付");if(p)p.amt=Math.max(0,p.amt-amt);
  auditLog("退货/补货",`${name} -${qty} (${reason})`,"",money(amt));
  await save();closeM();render();
}
async function saveTransfer(){
  const s=document.getElementById('tr_item'),name=s.value,unit=s.selectedOptions[0].dataset.unit,cost=+s.selectedOptions[0].dataset.cost;
  const qty=+document.getElementById('tr_qty').value||0,toId=document.getElementById('tr_to').value,date=document.getElementById('tr_date').value;
  const it=findItem(name);if(it)it.qty=Math.max(0,it.qty-qty);
  d().moves.unshift({date,type:'transfer',item:name,qty,unit,amt:qty*cost,note:"→"+nm(outletObj(toId))});
  const dest=DB[toId];const di=dest.items.find(i=>i.name===name);
  if(di)di.qty+=qty;else dest.items.push({id:Date.now(),name,cat:it?it.cat:'其他',unit,buyUnit:it?it.buyUnit:'unit',conv:it?it.conv:1,qty,cost,par:0,yield:it?it.yield:100,batches:[{qty,exp:"2027-01-01",in:date}]});
  dest.moves.unshift({date,type:'in',item:name,qty,unit,amt:qty*cost,note:LANG==="zh"?"调入":"Transfer in"});
  auditLog("跨店调拨",`${name} ${qty}${unit} →${nm(outletObj(toId))}`,"","");
  await save();await save(toId);closeM();render();
}
async function saveWaste(){
  const s=document.getElementById('w_item'),name=s.value,unit=s.selectedOptions[0].dataset.unit,cost=+s.selectedOptions[0].dataset.cost;
  const qty=+document.getElementById('w_qty').value||0,reason=document.getElementById('w_reason').value,date=document.getElementById('w_date').value;
  const it=findItem(name);if(it)it.qty=Math.max(0,it.qty-qty);
  d().moves.unshift({date,type:'waste',item:name,qty,unit,amt:qty*cost,note:reason});
  auditLog("报废登记",`${name} ${reason} -${qty}${unit}`,"",money(qty*cost));
  await save();closeM();render();
}
async function saveEnt(){
  const name=document.getElementById('e_item').value,qty=+document.getElementById('e_qty').value||0,reason=document.getElementById('e_reason').value,date=document.getElementById('e_date')?.value||TODAY;

async function saveProduction(){
  const name=document.getElementById('pr_name').value.trim();if(!name)return alert(LANG==="zh"?"请输入成品名称":"Name required");
  const qty=+document.getElementById('pr_qty').value||0,unit=document.getElementById('pr_unit').value,cost=+document.getElementById('pr_cost').value||0,date=document.getElementById('pr_date').value;
  const uc=qty?+(cost/qty).toFixed(2):0;
  const ex=findItem(name);
  if(ex){ex.qty+=qty;ex.cost=uc;ex.batches.push({qty,exp:"2027-01-01",in:date});}
  else d().items.push({id:Date.now(),name,cat:'半成品',unit,buyUnit:unit,conv:1,qty,cost:uc,par:0,yield:100,batches:[{qty,exp:"2027-01-01",in:date}]});
  d().moves.unshift({date,type:'production',item:name,qty,unit,amt:cost,note:LANG==="zh"?"中央厨房产出 单位成本"+money(uc):"CK output"});
  auditLog("中厨生产",`${name} +${qty}${unit}`,"",money(uc)+"/"+unit);
  await save();closeM();render();
}
async function saveStock(){
  const name=document.getElementById('st_item').value,count=+document.getElementById('st_count').value||0;
  const st=d().stocktakes.find(s=>s.item===name);const it=findItem(name);
  if(st){st.theory=it?it.qty:st.theory;st.count=count;}else d().stocktakes.push({item:name,theory:it?it.qty:0,count});
  auditLog("实物盘点",name,it?it.qty+"":"",count+"");
  await save();closeM();nav('report');
}

async function saveSales(){
  if(!d().sales)d().sales=[];
  const oldSales=JSON.parse(JSON.stringify(d().sales)); // 记录旧销量，算库存差量
  (d().recipes||[]).forEach(r=>{const el=document.getElementById('sl_'+r.id);if(!el)return;const qty=+el.value||0;const ex=d().sales.find(s=>s.recipeId===r.id);if(ex)ex.qty=qty;else d().sales.push({recipeId:r.id,qty});});
  applySalesDelta(oldSales,d().sales); // 销量变化 → 按配方(BOM)自动扣/补食材库存
  auditLog("录入销量","POS数据层更新（已按配方扣库存）","","");await save();closeM();render();
}

async function doBulkAdd(kind){
  const zh=LANG==="zh";
  const raw=(document.getElementById('bulk_txt')||{}).value||'';
  const names=[...new Set(raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))];
  if(!names.length){alert(zh?"请先粘贴至少一个名称。":"Paste at least one name.");return;}
  const all=document.getElementById('bulk_all').checked || isAgg();
  const targets=all?OUTLETS.map(o=>o.id):[curOutlet];
  const who=curUser?(curUser.name+" ("+curUser.email+")"):ROLES[curRole].name;
  let total=0;
  for(const oid of targets){
    const db=DB[oid];if(!db)continue;let added=0;
    if(kind==='supplier'){db.vendors=db.vendors||[];names.forEach(n=>{if(!db.vendors.some(v=>v.name===n)){db.vendors.push({id:Math.max(0,...db.vendors.map(v=>v.id))+1,name:n,terms:30});added++;}});}
    else{db.items=db.items||[];names.forEach(n=>{if(!db.items.some(i=>i.name===n)){db.items.push({id:Math.max(0,...db.items.map(i=>i.id))+1,name:n,unit:'pcs',buyUnit:'',conv:1,qty:0,cost:0,cat:'其他',par:0,yield:100,batches:[]});added++;}});}
    if(added>0){db.audit=db.audit||[];db.audit.unshift({date:TODAY+" "+new Date().toTimeString().slice(0,5),user:who,roleKey:curRole,act:kind==='supplier'?"批量导入供应商":"批量导入品项",detail:added+(zh?" 项":" items"),old:"",new:""});await save(oid);total+=added;}
  }
  _aggCache=null;closeM();render();
  alert((zh?"已导入 ":"Added ")+total+(zh?" 项（重复已跳过）"+(all?"，已应用到全部分店。":"。"):" (duplicates skipped)."));
}

/* ---- 供应商→品项联动：选供应商后，品项下拉自动显示该供应商的品项 ---- */
function catalogItemOpts(supplier,sel){
  let list=(typeof SUPPLIER_CATALOG!=='undefined'&&SUPPLIER_CATALOG[supplier])?SUPPLIER_CATALOG[supplier].slice():[];
  if(!list.length)list=(d().items||[]).map(i=>i.name);
  if(sel&&!list.includes(sel))list.unshift(sel);
  return list.map(n=>`<option value="${n}" ${n===sel?'selected':''}>${n}</option>`).join('')||`<option value=""></option>`;
}

async function doImportCatalog(){
  const zh=LANG==="zh";
  const all=document.getElementById('cat_all').checked || isAgg();
  const targets=all?OUTLETS.map(o=>o.id):[curOutlet];
  const who=curUser?(curUser.name+" ("+curUser.email+")"):ROLES[curRole].name;
  const allItems=[...new Set(Object.values(SUPPLIER_CATALOG).flat())];
  let sTot=0,iTot=0;
  for(const oid of targets){
    const db=DB[oid];if(!db)continue;db.vendors=db.vendors||[];db.items=db.items||[];let sa=0,ia=0;
    Object.keys(SUPPLIER_CATALOG).forEach(n=>{if(!db.vendors.some(v=>v.name===n)){db.vendors.push({id:Math.max(0,...db.vendors.map(v=>v.id))+1,name:n,terms:30});sa++;}});
    allItems.forEach(n=>{if(!db.items.some(i=>i.name===n)){db.items.push({id:Math.max(0,...db.items.map(i=>i.id))+1,name:n,unit:'pcs',buyUnit:'',conv:1,qty:0,cost:0,cat:'其他',par:0,yield:100,batches:[]});ia++;}});
    db.audit=db.audit||[];db.audit.unshift({date:TODAY+" "+new Date().toTimeString().slice(0,5),user:who,roleKey:curRole,act:"导入档案目录",detail:(zh?"供应商+":"suppliers+")+sa+(zh?" 品项+":" items+")+ia,old:"",new:""});
    await save(oid);sTot+=sa;iTot+=ia;
  }
  _aggCache=null;closeM();render();
  alert(zh?`已导入：供应商 +${sTot}，品项 +${iTot}（重复已跳过）。`:`Imported ${sTot} suppliers, ${iTot} items.`);
}

  // 同步迁移按供应商名存的表：订货单自定义品项、进销存网格目录

  if(d().gridCat&&d().gridCat[old]!=null){d().gridCat[nm2]=d().gridCat[old];delete d().gridCat[old];}
  auditLog("重命名供应商",old+"→"+nm2,old,nm2);await save();render();}

function gridRecalc(mod,sup){
  const month=gridCurMonth||ledgerMonth;const cat=ensureGridCat(sup);const dates=gridDates(mod,sup,month);
  const isP=mod==='purchase';
  const q=(cid,dt)=>{const r=gridRec(mod,sup,cid,dt);return r?(+r.qty||0):0;};
  const amtOf=(cid,dt)=>{const r=gridRec(mod,sup,cid,dt);return r?(+r.price||0):0;}; // 进货单：每格已经存好自己的金额(数量×当天价钱)
  const dayTot=new Array(dates.length).fill(0);let grand=0;
  cat.forEach((c,i)=>{const pr=+c.price||0;let tq=0,ta=0;
    dates.forEach((dt,j)=>{const qq=q(c.cid,dt);tq+=qq;const a=isP?amtOf(c.cid,dt):qq*pr;ta+=a;dayTot[j]+=a;});
    grand+=ta;
    const eq=document.getElementById('gtq-'+i);if(eq)eq.textContent=num(tq,2);
    const ea=document.getElementById('gta-'+i);if(ea)ea.textContent=money(ta);});
  dates.forEach((dt,j)=>{const ed=document.getElementById('gtd-'+j);if(ed)ed.textContent=money(dayTot[j]);});

}

async function setGridQty(mod,sup,cid,date,val){
  const qty=+val||0;const cfg=ledgerCfg(mod);d()[cfg.arr]=d()[cfg.arr]||[];const arr=d()[cfg.arr];
  const cat=gridCatRow(sup,cid);const item=cat?cat.name:'';const unit=cat?+cat.price||0:0;
  let rec=arr.find(r=>r.supplier===sup&&r.cid===cid&&r.date===date);const oldQty=rec?+rec.qty||0:0;
  if(qty<=0){if(rec){if(mod==='purchase')invUnreceive(item,oldQty);arr.splice(arr.indexOf(rec),1);}}
  else{if(!rec){rec={supplier:sup,date,cid,item,code:cat?cat.code:'',qty:0,weight:0,unitPrice:unit,price:0,note:''};arr.push(rec);}
    rec.cid=cid;rec.item=item;rec.unitPrice=unit;rec.qty=qty;rec.price=+(qty*unit).toFixed(2);if(cat){rec.code=cat.code;rec.uom=cat.uom||'';}rec.invoice=gridInv(mod,sup,date);
    if(mod==='purchase'){const dq=qty-oldQty;if(dq>0)invReceive(item,dq,dq*unit,null,null,date);else if(dq<0)invUnreceive(item,-dq);}}
  gridRecalc(mod,sup);gridSave(mod,sup); // 即时算合计；存档延后防卡
}

/* 进货单专用：每一格自己填数量/当天价钱(/重量)，不再共用一整月的单价。
   价钱每天可能不同，所以每格都要重算一次加权成本：先把这一格旧的数量扣回(不追溯成本，
   跟原本 setGridQty 的做法一致)，再用新的数量 × 这天填的价钱重新入库。 */
async function setGridCell(mod,sup,cid,date,field,val){
  if(mod!=='purchase')return; // 目前只有「进货单」改成按日填价；退货/月末盘点维持原本共用单价的做法
  const cfg=ledgerCfg(mod);d()[cfg.arr]=d()[cfg.arr]||[];const arr=d()[cfg.arr];
  const cat=gridCatRow(sup,cid);const item=cat?cat.name:'';
  let rec=arr.find(r=>r.supplier===sup&&r.cid===cid&&r.date===date);
  const oldQty=rec?+rec.qty||0:0;
  // 只有「数量和价钱都已经填了」的那一笔，才算真的入过库——避免数量先填、价钱还没填时
  // 用金额=0 入库把加权成本冲淡；而 invUnreceive 又不会把成本追溯还原，冲淡了就回不来了。
  const hadValidOld=oldQty>0&&(rec?+rec.price||0:0)>0;
  if(!rec){rec={supplier:sup,date,cid,item,code:cat?cat.code:'',qty:0,weight:0,unitPrice:0,price:0,note:''};arr.push(rec);}
  if(field==='qty')rec.qty=+val||0;
  else if(field==='price')rec.unitPrice=+val||0;
  else if(field==='weight')rec.weight=+val||0;
  if(cat){rec.code=cat.code;rec.uom=cat.uom||'';}
  rec.item=item;rec.invoice=gridInv(mod,sup,date);
  const newQty=+rec.qty||0,newPrice=+rec.unitPrice||0;
  rec.price=+(newQty*newPrice).toFixed(2);
  const validNow=newQty>0&&newPrice>0;
  if(hadValidOld)invUnreceive(item,oldQty);
  if(validNow)invReceive(item,newQty,rec.price,null,null,date);
  if(newQty<=0){const i=arr.indexOf(rec);if(i>=0)arr.splice(i,1);}
  gridRecalc(mod,sup);gridSave(mod,sup);
}

async function saveLedger(mod,editIdx){
  const cfg=ledgerCfg(mod);const g=id=>document.getElementById(id);
  const sup=g('l_sup').value;
  const rec={supplier:sup,date:g('l_date').value||TODAY,invoice:g('l_inv').value.trim(),code:g('l_code').value.trim(),item:g('l_item').value,qty:+g('l_qty').value||0,weight:+g('l_wt').value||0,price:+g('l_price').value||0,note:g('l_note').value.trim()};
  if(cfg.hasSettle)rec.settle=g('l_settle').value;
  if(!d()[cfg.arr])d()[cfg.arr]=[];
  if(editIdx!=null&&d()[cfg.arr][editIdx]){
    const old=d()[cfg.arr][editIdx];
    if(mod==='purchase'){invUnreceive(old.item,old.qty);invReceive(rec.item,rec.qty,rec.price,null,null,rec.date);} // 采购编辑→库存差量
    auditLog("编辑单据",cfg.title+" "+sup+" "+rec.item, old.item+" "+money(old.price)+"×"+num(old.qty,2), rec.item+" "+money(rec.price)+"×"+num(rec.qty,2));
    d()[cfg.arr][editIdx]=rec;
  }else{
    d()[cfg.arr].push(rec);
    if(mod==='purchase')invReceive(rec.item,rec.qty,rec.price,null,null,rec.date); // 采购新增→自动入库+加权成本
    auditLog(cfg.title,sup+" "+rec.item+" "+money(rec.price),"",rec.invoice);
  }
  await save();selSupplier=sup;closeM();render();
}
async function delLedger(mod,gi){if(!confirm(LANG==="zh"?"删除此单据？":"Delete record?"))return;const cfg=ledgerCfg(mod);const old=d()[cfg.arr][gi]||{};if(mod==='purchase')invUnreceive(old.item,old.qty);d()[cfg.arr].splice(gi,1);auditLog("删除单据",cfg.title+" "+(old.item||'')+" "+(old.invoice||''),money(old.price),"");await save();render();}

/* ================= 薪资发放 Payroll Run + Payslip（马来西亚法定：EPF/SOCSO/EIS/SL24J/PCB）=================
   EPF 第三附表(band-upper 进位)、SOCSO/EIS 第二附表(费率×薪级中点，取整到5仙)、SL24J 员工承担(封顶RM6000)。
   PCB 为估算(按 MTD 年度投影，可手动改)，正式以 LHDN e-PCB 为准。 */
let payrunMonth = TODAY.slice(0,7);
let payslipMode = null;   // null=薪资表 | 'menu'=选择 | 'single'=勾选员工
let payslipPick = {};
function setPayrunMonth(m){payrunMonth=m;render();window.scrollTo(0,0);}
function payrunData(){const m=payrunMonth;d().payrollRuns=d().payrollRuns||{};if(!d().payrollRuns[m])d().payrollRuns[m]={finalized:false,ov:{}};if(!d().payrollRuns[m].ov)d().payrollRuns[m].ov={};return d().payrollRuns[m];}
function payCfg(){if(!d().payrollCfg)d().payrollCfg={sl24j:'f1'};return d().payrollCfg;}
const SL24J_RATE={f1:0.0075,f2:0.01,f3:0.0125};
function round5(n){return Math.round(n*20)/20;}          // 取整到 5 仙
function ceilRM(n){return Math.ceil(n-1e-9);}            // 进位到下一令吉
function payWageCap(w){return Math.min(w,6000);}         // SOCSO/EIS/SL24J 封顶 RM6000
function epfShares(wage,local){ // EPF 第三附表（近似：取薪级带上限后进位到令吉）
  if(local===false||wage<=0)return {ee:0,er:0};
  const erRate=wage>5000?0.12:0.13;
  if(wage>20000)return {ee:ceilRM(wage*0.11),er:ceilRM(wage*0.12)};
  const top=wage<=5000?Math.ceil(wage/20)*20:Math.ceil(wage/100)*100;
  return {ee:ceilRM(top*0.11),er:ceilRM(top*erRate)};
}
function socsoShares(wage){ // 第一类别（工伤+残疾），费率×薪级中点
  const w=payWageCap(wage);if(w<=0)return{ee:0,er:0};
  const top=Math.min(Math.ceil(w/100)*100,6000);const mid=top-50;
  return {er:round5(mid*0.0175),ee:round5(mid*0.005)};
}
function eisShares(wage){
  const w=payWageCap(wage);if(w<=0)return{ee:0,er:0};
  const top=Math.min(Math.ceil(w/100)*100,6000);const mid=top-50;
  return {er:round5(mid*0.002),ee:round5(mid*0.002)};
}
function sl24jAmt(wage,on,rate){if(on===false)return 0;const w=payWageCap(wage);if(w<=0)return 0;return round5(w*(rate||0.0075));}
function payNum(n){return money(n).replace('RM ','');}
function empPositions(){if(!d().positions)d().positions=["经理","主管","服务员","总厨","二厨","普通厨师","洗碗工"];return d().positions;}
function empNats(){if(!d().nationalities)d().nationalities=["马来西亚","缅甸"];return d().nationalities;}
function isLocalNat(nat){return (nat||'')==='马来西亚';} // 国籍→EPF本地判定
function empIsLocal(e){return e.nationality?isLocalNat(e.nationality):(e.local!==false);}
function yearsService(e){if(!e||!e.joined)return 0;const j=new Date(e.joined);if(isNaN(j.getTime()))return 0;const y=(new Date(TODAY)-j)/(365.25*864e5);return Math.max(0,y);}
function sl24jPhaseOf(e){const y=yearsService(e);if(y<2)return {k:'f1',r:0.0075,label:'0.75%'};if(y<5)return {k:'f2',r:0.01,label:'1.0%'};return {k:'f3',r:0.0125,label:'1.25%'};}
function nextEmpNo(){const nums=(d().staff||[]).map(e=>{const m=/(\d+)/.exec(e.empNo||'');return m?+m[1]:0;});const mx=nums.length?Math.max(...nums):0;return 'EMP'+String(mx+1).padStart(3,'0');}
function taxResident(ci){ // YA2025 居民累进税
  if(ci<=5000)return 0;
  const b=[[5000,0],[20000,.01],[35000,.03],[50000,.06],[70000,.11],[100000,.19],[400000,.25],[600000,.26],[2000000,.28],[Infinity,.30]];
  let tax=0,prev=0;
  for(const[cap,rate]of b){if(ci>cap){tax+=(cap-prev)*rate;prev=cap;}else{tax+=(ci-prev)*rate;break;}}
  return tax;
}
function otHourly(basic){return (+basic||0)/26/8;}       // 马来西亚标准：月薪/26天/8小时
function computeRow(e){
  const _r=(d().payrollRuns&&d().payrollRuns[payrunMonth]);const ov=(_r&&_r.ov&&_r.ov[e.id])||{};
  const basic=+e.basic||0;
  const allowance=ov.allowance!=null?(+ov.allowance||0):(+e.allowance||0);
  const incentive=+ov.incentive||0;
  const otHours=+ov.otHours||0; const otMult=ov.otMult!=null?+ov.otMult:1.5;
  const otAmt=round5(otHours*otHourly(basic)*otMult);
  const gross=basic+allowance+incentive+otAmt;
  const local=empIsLocal(e);
  const epf=epfShares(gross,local),soc=socsoShares(gross),eis=eisShares(gross);
  const ph=sl24jPhaseOf(e);
  const sl=sl24jAmt(gross,ov.sl24jOn!==false,ph.r);
  // PCB 估算（年度投影，等额月薪）
  const epfReliefAnnual=Math.min(epf.ee*12,4000);
  let ci=gross*12-9000-epfReliefAnnual-((e.married&&!e.spouseWorking)?4000:0)-(Math.max(0,+e.children||0)*2000);
  let tax=taxResident(ci); if(ci<=35000)tax=Math.max(0,tax-400);
  const pcbAuto=Math.max(0,round5(tax/12));
  const pcb=ov.pcb!=null?(+ov.pcb||0):pcbAuto;
  const levy=+ov.levy||0; // 人头税占位（暂 0，不计入实发）
  const empDed=epf.ee+soc.ee+eis.ee+sl+pcb;
  const net=gross-empDed;
  return {basic,allowance,incentive,otHours,otMult,otAmt,gross,epf,soc,eis,sl,slLabel:ph.label,pcb,pcbAuto,levy,empDed,net,erCost:gross+epf.er+soc.er+eis.er};
}

async function doAuthLogin(){
  const email=fv('au_email'),pw=fv('au_pw');const m=document.getElementById('au_msg');
  if(!email||!pw){if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"请输入邮箱和密码":"Enter email & password");return;}
  if(m)m.textContent=LANG==="zh"?"登录中…":"Signing in…";
  try{const {data,error}=await _sb.auth.signInWithPassword({email,password:pw});
    if(error){if(m)m.innerHTML='❌ '+error.message;return;}
    await afterAuth(data.user);
  }catch(e){if(m)m.innerHTML='❌ '+(e.message||e);}
}
async function doAuthSignup(){
  const email=fv('au_email');
  const pw=fv('au_pw');
  const code=(document.getElementById('au_code')?.value||'').trim(); // 获取邀请码
  const m=document.getElementById('au_msg');

  if(!email||!pw){
    if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"请输入邮箱和密码（至少6位）":"Enter email & password (≥6)");
    return;
  }
  // 首次注册必须填邀请码；唯独 NO_CODE_EMAIL 这个管理员救援账号不用填(方便系统出问题时还能进得去)
  if(!code && email.toLowerCase()!==NO_CODE_EMAIL){
    if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"请填写邀请码，向管理员索取。":"Invite code required — ask your admin.");
    return;
  }
  // 有填邀请码就检查：必须是列表内的有效邀请码
  if(code && !INVITE_CODES[code.toLowerCase()]){
    if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"邀请码不正确，请向管理员确认。":"Invalid invite code — check with your admin.");
    return;
  }

  if(m)m.textContent=LANG==="zh"?"注册中…":"Signing up…";
  try{
    const {data,error}=await _sb.auth.signUp({
      email,password:pw,
      options:{
        emailRedirectTo:(location.origin+location.pathname),
        data:{invite_code:code.toLowerCase()} // 将邀请码打包传给注册后处理逻辑（afterAuth）
      }
    });
    if(error){if(m)m.innerHTML='❌ '+error.message;return;}
    if(data.session&&data.user){await afterAuth(data.user);}
    else{if(m)m.innerHTML='✅ '+(LANG==="zh"?"注册成功。若开启了邮箱确认，请查收邮件确认后再登录。":"Signed up. Confirm email if required, then sign in.");}
  }catch(e){if(m)m.innerHTML='❌ '+(e.message||e);}
}
async function afterAuth(user){
  // 已通过 Supabase 验证 → 白名单检查
  const r=await loadUsers();
  if(!r.ok){
    showAuthLogin(LANG==="zh"?"白名单表 erp_users 尚未建立。请先在 Supabase SQL Editor 运行建表脚本（supabase-schema.sql），再登录。":"Whitelist table erp_users not found — run supabase-schema.sql first.");
    try{await _sb.auth.signOut();}catch(e){}return;
  }
  let wu=findUser(user.email);
  // 本人未在册：先试邀请码分配职位；没有邀请码/邀请码失败，才试「首位注册者自动成为老板」
  // （白名单是不是真的空的，交给数据库那边的 RLS 规则去判断，这里本地看到的 USERS 列表
  // 因为权限隔离，看不到别人的资料，不能用来判断"是不是空的"）
  if(!wu){
    const inviteCode=(user.user_metadata&&user.user_metadata.invite_code||'').toLowerCase();
    const inv=INVITE_CODES[inviteCode];
    if(inv){
      try{const {error}=await _sb.from('erp_users').upsert({email:(user.email||'').toLowerCase(),name:(user.email||'').split('@')[0],role:inv.role,outlet:inv.outlet,active:true},{onConflict:'email'});
        if(error)throw error;await loadUsers();wu=findUser(user.email);
      }catch(e){/* 邀请码本身没问题，但写入失败(可能是权限/网络) → 往下走，交给最后的白名单检查统一报错 */}
    }
    if(!wu){
      try{const {error}=await _sb.from('erp_users').upsert({email:(user.email||'').toLowerCase(),name:(user.email||'').split('@')[0],role:'owner',outlet:'b1',active:true},{onConflict:'email'});
        if(error)throw error;await loadUsers();wu=findUser(user.email);
      }catch(e){/* 白名单其实不是空的(数据库会拒绝) → 忽略，走到下面统一报错 */}
    }
  }
  if(!wu||wu.active===false){
    showAuthLogin((LANG==="zh"?`账号 ${user.email} 不在白名单或已停用，请联系管理员。`:`${user.email} is not whitelisted or is disabled. Contact your admin.`));
    try{await _sb.auth.signOut();}catch(e){}return;
  }
  curUser={email:(wu.email||user.email),name:wu.name||user.email,role:ROLES[wu.role]?wu.role:'staff',outlet:wu.outlet||'b1'};
  curRole=curUser.role;
  curOutlet=ROLES[curRole].ckOnly?'ck':(ROLES[curRole].allBranch?(curOutlet||'b1'):(curUser.outlet||'b1')); // 中央厨房专属锁定 ck；非全分店角色锁定本店
  await loadDB();await loadRolePerms();
  document.querySelector('.top').style.display='';
  const sb=document.getElementById('sidebar');if(sb)sb.style.display='';
  curPage=firstAllowedPage();render();
  try{startOrderPoll();notifyNewOrders(true);enablePushSub();}catch(e){}
}
async function authLogout(){try{if(AUTH())await _sb.auth.signOut();}catch(e){}curUser=null;showAuthLogin();}

/* ================= 演示登录（无云端时回退）================= */
function showLogin(){
  if(AUTH()){showAuthLogin();return;}   // 有云端 → 走真实登录
  document.querySelector('.top').style.display='none';
  const sb=document.getElementById('sidebar');if(sb)sb.style.display='none';
  document.getElementById('pageHost').innerHTML=`
  <div style="width:calc(100% - 32px);max-width:380px;position:fixed;left:50%;top:6vh;transform:translateX(-50%);max-height:88vh;overflow:auto;padding:28px 22px;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:center;">
    <div style="margin-bottom:10px;"><span class="bh-logo" style="width:118px;height:118px;border-radius:20px;"></span></div>
    <div style="font-weight:800;font-size:19px;color:var(--ink);">明记家乡小食店</div>
    <div class="mini" style="margin:4px 0 20px;">${LANG==="zh"?"多分店进销存系统 · 演示登录（未连云端）":"Demo login (no cloud)"}</div>
    <div class="fr" style="text-align:left;"><label>${LANG==="zh"?"选择登录角色（演示）":"Login as (demo)"}</label>
      <select id="loginRole">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${LANG==="zh"?v.name:v.en}</option>`).join('')}</select></div>
    <button class="btn block brand" style="margin-top:6px;" onclick="doLogin()">🔓 ${LANG==="zh"?"登录进入系统":"Sign In"}</button>
    <div class="mini" style="margin-top:16px;line-height:1.5;">🔒 ${LANG==="zh"?"填入 Supabase 后即启用真实邮箱登录 + 白名单。":"Configure Supabase to enable real login + whitelist."}</div>
  </div>`;
}
function doLogin(){
  const lr=document.getElementById('loginRole');if(lr)curRole=lr.value;
  curUser=null;
  document.querySelector('.top').style.display='';
  const sb=document.getElementById('sidebar');if(sb)sb.style.display='';
  curPage=firstAllowedPage();render();
  try{startOrderPoll();notifyNewOrders(true);}catch(e){}
}
function logout(){if(AUTH())authLogout();else showLogin();}
function confirmLogout(){
  if(!confirm(LANG==="zh"?"确定要登出吗？":"Log out?"))return;
  if(!confirm(LANG==="zh"?"再次确认：登出后需重新登录，确定登出？":"Confirm again: you'll need to sign in again. Log out?"))return;
  logout();
}

/* ---------- init ---------- */
let _deferredPrompt=null;
function installApp(){
  if(_deferredPrompt){_deferredPrompt.prompt();try{_deferredPrompt.userChoice.finally(()=>{_deferredPrompt=null;});}catch(e){_deferredPrompt=null;}return;}
  const iOS=/iP(hone|ad|od)/.test(navigator.userAgent);
  alert(LANG==="zh"
    ?(iOS?"📲 安装到 iPhone/iPad：\n点浏览器下方『分享』按钮 → 选『加入主画面 / Add to Home Screen』，就能像 App 一样从主画面打开。":"📲 安装到安卓：\n点浏览器右上菜单(⋮) → 『安装应用 / 添加到主屏幕』。装好后从主画面打开即可像 App 使用。")
    :(iOS?"iOS: Share → Add to Home Screen":"Android: Menu (⋮) → Install app / Add to Home Screen"));
}
(async()=>{
  if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(r=>{_swReg=r;}).catch(()=>{});}
  try{window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_deferredPrompt=e;});}catch(e){}
  try{window.addEventListener('click',function(){if(typeof primeAudio==='function')primeAudio();},{once:true});}catch(e){}
  initCloud();
  if(AUTH()){
    try{const {data}=await _sb.auth.getSession();
      if(data&&data.session&&data.session.user){await afterAuth(data.session.user);}
      else{showAuthLogin();}
    }catch(e){showAuthLogin();}
  }else{
    await loadDB();await loadRolePerms();showLogin();
  }
})();

</script>
