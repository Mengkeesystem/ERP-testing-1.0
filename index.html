async function doAuthSignup(){
  const email=fv('au_email');
  const pw=fv('au_pw');
  const code=(document.getElementById('au_code')?.value||'').trim(); // 获取邀请码
  const m=document.getElementById('au_msg');

  if(!email||!pw){
    if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"请输入邮箱和密码（至少6位）":"Enter email & password (≥6)");
    return;
  }
  // 首次注册必须填邀请码；唯独 NO_CODE_EMAIL 这个管理员救援账号不用填(方便系统出问题时还能进得去)
  if(!code && email.toLowerCase()!==NO_CODE_EMAIL){
    if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"请填写邀请码，向管理员索取。":"Invite code required — ask your admin.");
    return;
  }
  // 有填邀请码就检查：必须是列表内的有效邀请码
  if(code){
    const lk=await inviteLookup(code);
    if(lk.error){
      if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"暂时无法验证邀请码，请稍后再试或联系管理员。":"Cannot verify the invite code right now — try again or contact your admin.");
      return;
    }
    if(!lk.inv){
      if(m)m.innerHTML='⚠️ '+(LANG==="zh"?"邀请码不正确，请向管理员确认。":"Invalid invite code — check with your admin.");
      return;
    }
  }

  if(m)m.textContent=LANG==="zh"?"注册中…":"Signing up…";
  try{
    const {data,error}=await _sb.auth.signUp({
      email,password:pw,
      options:{
        emailRedirectTo:(location.origin+location.pathname),
        data:{invite_code:code.toLowerCase()} // 将邀请码打包传给注册后处理逻辑（afterAuth）
      }
    });
    if(error){if(m)m.innerHTML='❌ '+error.message;return;}
    if(data.session&&data.user){await afterAuth(data.user);}
    else{if(m)m.innerHTML='✅ '+(LANG==="zh"?"注册成功。若开启了邮箱确认，请查收邮件确认后再登录。":"Signed up. Confirm email if required, then sign in.");}
  }catch(e){if(m)m.innerHTML='❌ '+(e.message||e);}
}
async function afterAuth(user){
  if(_pwRecoveryActive)return; // 正在走"设置新密码"流程，不能被登录检查抢回主系统画面
  // 已通过 Supabase 验证 → 白名单检查
  const r=await loadUsers();
  if(!r.ok){
    showAuthLogin(LANG==="zh"?"白名单表 erp_users 尚未建立。请先在 Supabase SQL Editor 运行建表脚本（supabase-schema.sql），再登录。":"Whitelist table erp_users not found — run supabase-schema.sql first.");
    try{await _sb.auth.signOut();}catch(e){}return;
  }
  let wu=findUser(user.email);
  // 本人未在册：先试邀请码分配职位；没有邀请码/邀请码失败，才试「首位注册者自动成为老板」
  // （白名单是不是真的空的，交给数据库那边的 RLS 规则去判断，这里本地看到的 USERS 列表
  // 因为权限隔离，看不到别人的资料，不能用来判断"是不是空的"）
  if(!wu){
    const inviteCode=(user.user_metadata&&user.user_metadata.invite_code||'').toLowerCase();
    const inv=inviteCode?(await inviteLookup(inviteCode)).inv:null;
    if(inv){
      try{const {error}=await _sb.from('erp_users').upsert({email:(user.email||'').toLowerCase(),name:(user.email||'').split('@')[0],role:inv.role,outlet:inv.outlet,active:true},{onConflict:'email'});
        if(error)throw error;await loadUsers();wu=findUser(user.email);
      }catch(e){/* 邀请码本身没问题，但写入失败(可能是权限/网络) → 往下走，交给最后的白名单检查统一报错 */}
    }
    if(!wu){
      try{const {error}=await _sb.from('erp_users').upsert({email:(user.email||'').toLowerCase(),name:(user.email||'').split('@')[0],role:'owner',outlet:'b1',active:true},{onConflict:'email'});
        if(error)throw error;await loadUsers();wu=findUser(user.email);
      }catch(e){/* 白名单其实不是空的(数据库会拒绝) → 忽略，走到下面统一报错 */}
    }
  }
  if(!wu||wu.active===false){
    showAuthLogin((LANG==="zh"?`账号 ${user.email} 不在白名单或已停用，请联系管理员。`:`${user.email} is not whitelisted or is disabled. Contact your admin.`));
    try{await _sb.auth.signOut();}catch(e){}return;
  }
  curUser={email:(wu.email||user.email),name:wu.name||user.email,role:ROLES[wu.role]?wu.role:'staff',outlet:wu.outlet||'b1'};
  curRole=curUser.role;
  curOutlet=ROLES[curRole].ckOnly?'ck':(ROLES[curRole].allBranch?(curOutlet||'b1'):(curUser.outlet||'b1')); // 中央厨房专属锁定 ck；非全分店角色锁定本店
  await loadDB();await loadRolePerms();
  document.querySelector('.top').style.display='';
  const sb=document.getElementById('sidebar');if(sb)sb.style.display='';
  curPage=firstAllowedPage();render();
  try{startOrderPoll();notifyNewOrders(true);enablePushSub();startXferPoll();updateXferBell();}catch(e){}
  markActivity(); // 登录当下重新起算闲置时间，避免登入前累积的闲置时间被算进去
}
async function authLogout(idleReason){if(typeof dismissIdleWarn==='function')dismissIdleWarn();try{if(AUTH())await _sb.auth.signOut();}catch(e){}curUser=null;clearSession();showAuthLogin(idleReason?`<b>${LANG==="zh"?"⏱️ 长时间未操作，已自动登出，请重新登录。":"Logged out due to inactivity. Please sign in again."}</b>`:undefined);}
/* ================= 闲置自动登出(仅限 店长/厨师长/员工/中央经理/中央员工) =================
   老板/区域副经理/人事经理/店面经理常常需要长时间开着看大盘、不方便被强制踢出，
   所以不受影响；店长/厨师长/员工/中央经理/中央员工 这五个比较基层、共用设备
   机会较高的角色，闲置满29分钟会先跳出「闲置超时提醒」卡片、倒数60秒，
   这60秒内只要有任何操作(按继续、或单纯滑动/打字)提示就会取消、正常
   继续用；倒数真的归零都没反应，才在满30分钟那一刻强制登出，要求
   重新输入密码。正在填表单(弹窗开着)时一律当作有在用，不计闲置、
   也不会跳提醒，避免资料还没保存就被强制登出弄丢。 */
const IDLE_LIMIT_MS=30*60*1000;
const IDLE_WARN_MS=60*1000; // 最后60秒先提醒
const IDLE_ROLES=['manager','headchef','staff','ckmgr','ckstaff'];
let _lastActivity=Date.now();
let _idleWarnShown=false,_idleWarnEl=null,_idleWarnTick=null;
function dismissIdleWarn(){
  _idleWarnShown=false;
  if(_idleWarnTick){clearInterval(_idleWarnTick);_idleWarnTick=null;}
  if(_idleWarnEl){_idleWarnEl.remove();_idleWarnEl=null;}
}
function markActivity(){_lastActivity=Date.now();if(_idleWarnShown)dismissIdleWarn();}
function showIdleWarn(){
  if(_idleWarnShown)return;_idleWarnShown=true;
  const zh=LANG==="zh";let remain=60;
  const el=document.createElement('div');
  el.style.cssText='position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99998;background:#12203A;color:#fff;padding:14px 18px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:320px;width:calc(100% - 32px);text-align:center;';
  el.innerHTML=`<div style="font-weight:800;margin-bottom:6px;">⏰ ${zh?"闲置超时提醒":"Idle Timeout Warning"}</div>
    <div class="mini" style="margin-bottom:10px;color:#C7D0DE;">${zh?"即将自动登出，剩余":"Auto logout in"} <b id="idleWarnSec">60</b> ${zh?"秒":"s"}</div>
    <button class="btn block brand" id="idleWarnBtn">✅ ${zh?"继续使用":"Keep me logged in"}</button>`;
  document.body.appendChild(el);_idleWarnEl=el;
  document.getElementById('idleWarnBtn').onclick=()=>markActivity();
  _idleWarnTick=setInterval(()=>{
    remain--;
    const s=document.getElementById('idleWarnSec');if(s)s.textContent=remain;
    if(remain<=0){clearInterval(_idleWarnTick);_idleWarnTick=null;authLogout(true);}
  },1000);
}
function startIdleWatch(){
  ['click','keydown','touchstart','mousemove','scroll','wheel'].forEach(ev=>document.addEventListener(ev,markActivity,{passive:true}));
  setInterval(()=>{
    if(!curUser||!AUTH())return; // 未登录/demo模式不管
    if(!IDLE_ROLES.includes(curRole))return; // 只对这五个角色生效
    const mbg=document.getElementById('mbg');
    if(mbg&&mbg.classList.contains('show')){markActivity();return;} // 表单开着算作有在用，不计闲置
    const elapsed=Date.now()-_lastActivity;
    if(elapsed>=IDLE_LIMIT_MS-IDLE_WARN_MS&&elapsed<IDLE_LIMIT_MS)showIdleWarn();
  },5*1000);
}

/* ================= 演示登录（无云端时回退）================= */
function showLogin(){
  if(AUTH()){showAuthLogin();return;}   // 有云端 → 走真实登录
  {const tb=document.getElementById('tabbar');if(tb){tb.style.display='none';tb.innerHTML='';}}
  document.querySelector('.top').style.display='none';
  const sb=document.getElementById('sidebar');if(sb)sb.style.display='none';
  document.getElementById('pageHost').innerHTML=`
  <div style="width:calc(100% - 32px);max-width:380px;position:fixed;left:50%;top:6vh;transform:translateX(-50%);max-height:88vh;overflow:auto;padding:28px 22px;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:center;">
    <div style="margin-bottom:10px;"><span class="bh-logo" style="width:118px;height:118px;border-radius:20px;"></span></div>
    <div style="font-weight:800;font-size:19px;color:var(--ink);">明记家乡小食店</div>
    <div class="mini" style="margin:4px 0 20px;">${LANG==="zh"?"多分店进销存系统 · 演示登录（未连云端）":"Demo login (no cloud)"}</div>
    <div class="fr" style="text-align:left;"><label>${LANG==="zh"?"选择登录角色（演示）":"Login as (demo)"}</label>
      <select id="loginRole">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${LANG==="zh"?v.name:v.en}</option>`).join('')}</select></div>
    <button class="btn block brand" style="margin-top:6px;" onclick="doLogin()">🔓 ${LANG==="zh"?"登录进入系统":"Sign In"}</button>
    <div class="mini" style="margin-top:16px;line-height:1.5;">🔒 ${LANG==="zh"?"填入 Supabase 后即启用真实邮箱登录 + 白名单。":"Configure Supabase to enable real login + whitelist."}</div>
  </div>`;
}
function doLogin(){
  const lr=document.getElementById('loginRole');if(lr)curRole=lr.value;
  curUser=null;
  document.querySelector('.top').style.display='';
  const sb=document.getElementById('sidebar');if(sb)sb.style.display='';
  curPage=firstAllowedPage();render();
  try{startOrderPoll();notifyNewOrders(true);}catch(e){}
}
function logout(){if(AUTH())authLogout();else showLogin();}
function confirmLogout(){
  if(!confirm(LANG==="zh"?"确定要登出吗？":"Log out?"))return;
  if(!confirm(LANG==="zh"?"再次确认：登出后需重新登录，确定登出？":"Confirm again: you'll need to sign in again. Log out?"))return;
  logout();
}

/* ---------- init ---------- */
let _deferredPrompt=null;
function installApp(){
  if(_deferredPrompt){_deferredPrompt.prompt();try{_deferredPrompt.userChoice.finally(()=>{_deferredPrompt=null;});}catch(e){_deferredPrompt=null;}return;}
  const iOS=/iP(hone|ad|od)/.test(navigator.userAgent);
  alert(LANG==="zh"
    ?(iOS?"📲 安装到 iPhone/iPad：\n点浏览器下方『分享』按钮 → 选『加入主画面 / Add to Home Screen』，就能像 App 一样从主画面打开。":"📲 安装到安卓：\n点浏览器右上菜单(⋮) → 『安装应用 / 添加到主屏幕』。装好后从主画面打开即可像 App 使用。")
    :(iOS?"iOS: Share → Add to Home Screen":"Android: Menu (⋮) → Install app / Add to Home Screen"));
}
(async()=>{
  if('serviceWorker'in navigator){
    navigator.serviceWorker.register('sw.js').then(r=>{
      _swReg=r;
      // 有新版本的 sw.js 装好待命时(装好=网络已经拿到新版本)，立刻查一次版本号跳强制更新窗，
      // 不用等5分钟那个定时检查，网络够快的话几乎是开App当下就会侦测到。
      r.addEventListener('updatefound',()=>{
        const nw=r.installing;if(!nw)return;
        nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)checkForUpdate();});
      });
    }).catch(()=>{});
  }
  setTimeout(()=>{try{startUpdateCheck();}catch(e){}},0); // 不等登录/载入数据：那一步万一卡住，也照样能发现新版本（等整个脚本载入完再启动，否则会碰到还没定义的变量）
  try{window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_deferredPrompt=e;});}catch(e){}
  try{window.addEventListener('click',function(){if(typeof primeAudio==='function')primeAudio();},{once:true});}catch(e){}
  initCloud();
  // 点了"忘记密码"邮件连结回来时，网址会带 type=recovery；这时不能走正常登录流程直接放人进系统，
  // 要先逼他设好新密码——用网址判断比等 onAuthStateChange 的事件更快，避免被 getSession() 抢先跳进系统。
  const _pwRecovery=/type=recovery/.test(location.hash)||/type=recovery/.test(location.search);
  if(AUTH()&&_pwRecovery){
    showResetPassword();
  }else if(AUTH()){
    try{const {data}=await _sb.auth.getSession();
      if(data&&data.session&&data.session.user){await afterAuth(data.session.user);}
      else{showAuthLogin();}
    }catch(e){showAuthLogin();}
  }else{
    await loadDB();await loadRolePerms();showLogin();
  }
  startIdleWatch();
})();
/* ================= 自动检查新版本（不用删除重装 App）=================
   PWA 装到手机主屏幕后，网页本身没有做任何离线缓存(sw.js 没拦截 fetch)，
   所以内容更新其实早就是"打开就是最新的"，不用重装——唯独图标变更是
   手机系统自己缓存的，那个没办法用网页技术解决，只有那种情况才需要重装。
   这里加一个小提示条：每隔几分钟、或从背景切回前台时，去服务器抓一次最新
   HTML 的 BUILD 版本号，发现比手上这份新，就跳一个"有新版本"的小条，
   点一下才刷新(不会没提示就自己重刷，打字打到一半不会被打断)。 */
let _updChecking=false,_updShown=false,_updPending=false,_updPendingVer='';
let _updCheckStart=0;
async function checkForUpdate(manual){
  // 上一次检查如果卡住超过 30 秒（手机网络差、App 被系统暂停等），当作失败，别让它永远挡住后面的检查
  if(_updChecking&&Date.now()-_updCheckStart>30000)_updChecking=false;
  if(_updChecking||_updShown){if(manual)alert(LANG==="zh"?"已经在检查/已经有更新待处理。":"Already checking / update pending.");return;}
  _updChecking=true;_updCheckStart=Date.now();
  let _ac=null,_acT=null;try{_ac=new AbortController();_acT=setTimeout(()=>{try{_ac.abort();}catch(e){}},15000);}catch(e){}
  try{
    const res=await fetch(location.pathname+'?_ts='+Date.now(),{cache:'no-store',signal:_ac?_ac.signal:undefined});
    if(res.ok){
      const txt=await res.text();
      const m=txt.match(/const BUILD\s*=\s*"([^"]+)"/);
      if(m&&m[1]&&m[1]!==BUILD){showUpdateBanner(m[1]);}
      else if(manual){alert(LANG==="zh"?`当前版本 v${BUILD}，已是最新版。`:`v${BUILD} — already up to date.`);}
    }
  }catch(e){if(manual)alert(LANG==="zh"?"检查更新失败，请稍后再试。":"Check failed, try again later.");}
  if(_acT)clearTimeout(_acT);
  _updChecking=false;
}
/* 版本更新提示音：模仿 iPhone 内建「Tri-tone」提示音的三声上扬琶音风格
   (G5→C6→E6，一声接一声往上扬)，用 WebAudio 原创合成、不是抓 Apple 的音频档
   (那是苹果的版权音效，没办法直接内嵌)——但节奏/音符数刻意做成"三音上扬"，
   一听就有"Tri-tone"那种熟悉的辨识度，也跟新订单的两声"Note"风格铃声区分开。 */
function playUpdateChime(){
  try{primeAudio();if(!_audioCtx)return;const ctx=_audioCtx,now=ctx.currentTime;
    [[783.99,0],[1046.50,0.14],[1318.51,0.28]].forEach(([f,delay])=>{
      const t=now+delay;
      const master=ctx.createGain();master.connect(ctx.destination);
      master.gain.setValueAtTime(0.0001,t);
      master.gain.exponentialRampToValueAtTime(0.85,t+0.01);
      master.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      [[f,1],[f*2,0.3]].forEach(([freq,v])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=v;o.connect(g);g.connect(master);o.start(t);o.stop(t+0.55);});
    });
    try{if(navigator.vibrate)navigator.vibrate([150,80,150,80,150]);}catch(e){}
  }catch(e){}
}
function updBellRefresh(){const bc=document.getElementById('updBellCount');if(bc)bc.style.display=_updPending?'':'none';}
/* 铃铛点开：有更新待处理就重新弹出强制更新窗(避免不小心被切走/看不到)；
   没有的话就只是显示目前版本号，给所有账号都能查。 */
function openUpdatePanel(){
  if(_updPending){_updShown=false;showUpdateBanner(_updPendingVer);return;}
  alert(LANG==="zh"?`🛎️ 版本更新通知\n\n当前版本：v${BUILD}\n已是最新版，一旦有更新会自动跳出提醒+响铃。`:`Current version: v${BUILD} — up to date.`);
}
/* 强制更新：屏幕正中间弹一个盖住全屏的提示，只有一个"确认更新"按钮，
   没有关闭/点旁边取消的办法，逼着一定要更新到最新版才能继续用系统
   (避免有人一直用旧版本操作，数据结构/功能跟别人对不上)。
   所有账号(不分职位)都会收到这个提醒+专属提示音；区域副经理以下账号
   本来就看不到订单铃铛(bellBtn)，只会看到这个版本更新铃铛。 */
/* 正在填表单/正在打字的时候，绝对不能突然跳出强制更新窗把画面锁住——
   还没按『保存』的资料只存在画面上，还没写进系统，一被切页/刷新就没了。
   所以：侦测到新版本先只响铃+跳红点(不打断)，真正的强制更新窗要等
   "表单弹窗关掉、且当下没有任何输入框在打字" 才会跳出来；关表单/
   打字告一段落后，这里会自动每1.5秒检查一次，一safe就立刻跳出来。 */
function isBusyEditing(){
  const mbg=document.getElementById('mbg');
  if(mbg&&mbg.classList.contains('show'))return true; // 新增/编辑表单开着
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&!(ae.closest&&ae.closest('.top')))return true; // 正在某个输入框里打字/选择(如採购网格逐格输入)；顶栏的分店/岗位选单选完会一直保持焦点，不算在填表
  return false;
}
let _updWaitT=null;
function tryShowForcedUpdate(){
  if(_updShown||!_updPending)return;
  if(isBusyEditing()){
    if(!_updWaitT)_updWaitT=setInterval(()=>{if(!isBusyEditing()){clearInterval(_updWaitT);_updWaitT=null;tryShowForcedUpdate();}},1500);
    return;
  }
  _updShown=true;
  const zh=LANG==="zh";const newBuild=_updPendingVer;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(15,25,45,.72);display:flex;align-items:center;justify-content:center;padding:20px;';
  ov.innerHTML=`<div style="background:#fff;border-radius:16px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);">
    <div style="font-size:36px;margin-bottom:10px;">🔄</div>
    <div style="font-weight:800;font-size:17px;color:var(--ink);margin-bottom:8px;">${zh?"有新版本可用":"New Version Available"}</div>
    <div class="mini" style="margin-bottom:18px;line-height:1.6;">${zh?`系统已更新到 <b>${newBuild}</b>，请更新后才能继续使用，避免跟其他人使用的版本不一致。`:`The app was updated to <b>${newBuild}</b>. Please update to continue.`}</div>
    <button class="btn block brand" id="forceUpdBtn">✅ ${zh?"确认更新":"Update Now"}</button>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('forceUpdBtn').onclick=()=>{location.href=location.pathname+'?_ts='+Date.now();};
}
function showUpdateBanner(newBuild){
  const already=_updPending;
  _updPending=true;_updPendingVer=newBuild;updBellRefresh();
  if(!already)playUpdateChime(); // 只响一次铃，不会因为每次检查都重复响
  tryShowForcedUpdate();
}
function startUpdateCheck(){
  checkForUpdate();
  setInterval(()=>{checkForUpdate();if(_swReg)_swReg.update().catch(()=>{});},5*60*1000); // 每5分钟查一次，顺便叫 sw.js 也主动check
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkForUpdate();if(_swReg)_swReg.update().catch(()=>{});}}); // 从背景切回前台也查一次
}
</script>
